udioFile": "PB_000061.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000062", "originalText": "स द्विविधः सुरभिरसुरभिश्च। पृथिवीमात्रवृत्तिः॥ २१॥", "padacchedaText": "", "audioFile": "PB_000062.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000063", "originalText": "त्वगिन्द्रियमात्रग्राह्यो गुणः स्पर्शः।", "padacchedaText": "", "audioFile": "PB_000063.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000064", "originalText": "स च त्रिविधः शीतोष्णानुष्णाशीतभेदात्।", "padacchedaText": "", "audioFile": "PB_000064.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000065", "originalText": "पृथिव्यप्तेजोवायुवृत्तिः।", "padacchedaText": "", "audioFile": "PB_000065.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000066", "originalText": "तत्र शीतो जले।", "padacchedaText": "", "audioFile": "PB_000066.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000067", "originalText": "उष्णस्तेजसि। अनुष्णाशीतः पृथिवीवाय्वोः॥ २२॥", "padacchedaText": "", "audioFile": "PB_000067.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000068", "originalText": "रूपादिचतुष्टयं पृथिव्यां पाकजमनित्यं च।", "padacchedaText": "", "audioFile": "PB_000068.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000069", "originalText": "अन्यत्र अपाकजं नित्यमनित्यं च।", "padacchedaText": "", "audioFile": "PB_000069.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000070", "originalText": "नित्यगतं नित्यम्। अनित्यगतमनित्यम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_000070.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000071", "originalText": "एकत्वादिव्यवहारहेतुः संख्या।", "padacchedaText": "", "audioFile": "PB_000071.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000072", "originalText": "सा नवद्रव्यवृत्तिः एकत्वादिपरार्धपर्यन्ता।", "padacchedaText": "", "audioFile": "PB_000072.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000073", "originalText": "एकत्वं नित्यमनित्यं च।", "padacchedaText": "", "audioFile": "PB_000073.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000074", "originalText": "नित्यगत .wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000087", "originalText": "ज्येष्ठे कालकृतं परत्वम्। कनिष्ठे कालकृतमपरत्वम्॥ २९॥", "padacchedaText": "", "audioFile": "PB_000087.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000088", "originalText": "आद्यपतनासमवायिकारणं गुरुत्वम्। पृथिवीजलवृत्ति॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000088.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000089", "originalText": "आद्यस्यन्दनासमवायिकारणं द्रवत्वम्।", "padacchedaText": "", "audioFile": "PB_000089.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000090", "originalText": "पृथिव्यप्तेजोवृत्ति।", "padacchedaText": "", "audioFile": "PB_000090.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000091", "originalText": "तद्द्विविधं सांसिद्धिकं नैमित्तिकं च।", "padacchedaText": "", "audioFile": "PB_000091.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000092", "originalText": "सांसिद्धिकं जले।", "padacchedaText": "", "audioFile": "PB_000092.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000093", "originalText": "नैमित्तिकं पृथिवीतेजसोः।", "padacchedaText": "", "audioFile": "PB_000093.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000094", "originalText": "पृथिव्यां घृतादावग्नि संयोगजं द्रवत्वम्। तेजसि सुवर्णादौ॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000094.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000095", "originalText": "चूर्णादिपिण्डीभावहेतुर्गुणः स्नेहः। जलमात्रवृत्तिः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000095.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000096", "originalText": "श्रोत्रग्राह्यो गुणः शब्दः आकाशमात्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_000096.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000097", "originalText": "स द्विविधः ध्वन्यात्मकः वर्णात्मकश्च।", "padacchedaText": "", "audioFile": "PB_000097.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000098", "originalText": "तत्र ध्वन्यात्मकः भेर्यादौ। वर्णात्मकः संस्कृतभाषादिरूपः॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000098.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000099", "originalText": "सर्वव्यवहारहेतुर्गुणो बुद्धिर्ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000099.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000100", "originalText": "सा द्विविधा स्मृतिरनुभवश्च।", "padacchedaText": "", "audioFile": "PB_000100.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000101", "originalText": "संस्कारमात्रजन्यं ज्ञानं स्मृतिः।", "padacchedaText": "", "audioFile": "PB_000101.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000102", "originalText": "तद्भिन्नं ज्ञानमनुभवः।", "padacchedaText": "", "audioFile": "PB_000102.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000103", "originalText": "स द्विविधः यथार्थोऽयथार्थश्च।", "padacchedaText": "", "audioFile": "PB_000103.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000104", "originalText": "तद्वति तत्प्रकारकोऽनुभवो यथार्थः।", "padacchedaText": "", "audioFile": "PB_000104.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000105", "originalText": "यथा रजते इदं रजतमिति ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000105.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000106", "originalText": "सैव प्रमेत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000106.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000107", "originalText": "तदभाववति तत्प्रकारकोऽनुभवोऽयथार्थः।", "padacchedaText": "", "audioFile": "PB_000107.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000108", "originalText": "यथा शुक्ताविदंरजतमिति ज्ञानम्। सैव अप्रमेत्युच्यते॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000108.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000109", "originalText": "यथार्थनुभवश्चतुर्विधः\nप्रत्यक्षानुमित्युपमितिशाब्दभेदात्। तत्करणमपि चतुर्विधं\nप्रत्यक्षानुमानोपमानशब्दाभेदात्॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000109.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000110", "originalText": "असाधारणं कारणं करणम्।", "padacchedaText": "", "audioFile": "PB_000110.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000111", "originalText": "कार्यनियतपूर्ववृत्ति कारणम्। कार्यं प्रागभावप्रतियोगि॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000111.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000112", "originalText": "कारणं त्रिविधं समवाय्यसमवायिनिमित्तभेदात्।", "padacchedaText": "", "audioFile": "PB_000112.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000113", "originalText": "यत्समवेतं कार्यमुत्पद्यते तत्समवायिकारणम्।", "padacchedaText": "", "audioFile": "PB_000113.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000114", "originalText": "यथा तंतवः पटस्य पटश्च स्वगतरूपादेः।", "padacchedaText": "", "audioFile": "PB_000114.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000115", "originalText": "कार्येण कारणेन वा सहैकस्मिन्नर्थे समवेतत्वे सति\nयत्कारणं\nतदसमवायिकारणम्।", "padacchedaText": "", "audioFile": "PB_000115.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000116", "originalText": "यथा तंतुसंयोगः पटस्य तन्तुरूपं पटरूपस्य।", "padacchedaText": "", "audioFile": "PB_000116.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000117", "originalText": "तदुभयभिन्नं कारणं निमित्तकारणम्।", "padacchedaText": "", "audioFile": "PB_000117.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000118", "originalText": "यथा तुरीवेमादिकं पटस्य। तदेतत्त्रिविधकारणमध्ये यदसाधारणं कारणं\nतदेव करणम्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000118.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000119", "originalText": "तत्र प्रत्यक्षज्ञानकरणं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_000119.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000120", "originalText": "इन्द्रियार्थसंनिकर्षजन्यं ज्ञानं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_000120.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000121", "originalText": "तद्द्विविधं निर्विकल्पकं सविकल्पकं चेति।", "padacchedaText": "", "audioFile": "PB_000121.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000122", "originalText": "तत्र निष्प्रकारणं ज्ञानं निर्विकल्पकं यथेदं\nकिञ्चित्। सप्रकारकं ज्ञानं सविकल्पकं यथा डित्थोऽयं\nब्राह्मणोऽयं श्यामोऽयं\nपाचकोऽयमिति॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000122.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000123", "originalText": "प्रत्यक्षज्ञानहेतुरिन्द्रियार्थसंनिकर्षः\nषड्विधः।", "padacchedaText": "", "audioFile": "PB_000123.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000124", "originalText": "संयोगः संयुक्तसमवायः संयुक्तसमवेतसमवायः\nसमवायः\nसमवेतसमवायः विशेषणविशेष्यभावश्चेति।", "padacchedaText": "", "audioFile": "PB_000124.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000125", "originalText": "चक्षुषा घटप्रत्यक्षजनने संयोगः संनिकर्षः।", "padacchedaText": "", "audioFile": "PB_000125.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000126", "originalText": "घटरूपप्रत्यक्षजनने संयुक्तसमवायः\nसंनिकर्षः।", "padacchedaText": "", "audioFile": "PB_000126.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000127", "originalText": "चक्षुः संयुक्ते घटे रूपस्य समवायात्।", "padacchedaText": "", "audioFile": "PB_000127.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000128", "originalText": "रूपत्वसामान्यप्रत्यक्षे संयुक्तसमवेतसमवायः\nसंनिकर्षः।", "padacchedaText": "", "audioFile": "PB_000128.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000129", "originalText": "चक्षुः संयुक्ते घटे रूपं समवेतं तत्र\nरूपत्वस्य समवायात्।", "padacchedaText": "", "audioFile": "PB_000129.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000130", "originalText": "श्रोत्रेण शब्दसाक्षात्कारे समवायः संनिकर्षः\nकर्णविवरवर्त्याकाशस्य\nश्रोत्रत्वात् शब्दस्याकाशगुणत्वाद्गुणगुणिनोश्च\nसमवायात्।", "padacchedaText": "", "audioFile": "PB_000130.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000131", "originalText": "शब्दत्वसाक्षात्कारे समवेतसमवायः संनिकर्षः\nश्रोत्रसमवेते शब्दे\nशब्दत्वस्य समवायात्।", "padacchedaText": "", "audioFile": "PB_000131.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000132", "originalText": "अभावप्रत्यक्षे विशेषणविशेष्यभावः संनिकर्षः\nघटाभाववद्भूतलमित्यत्र\nचक्षुः संयुक्ते भूतले घटाभावस्य विशेषणत्वात्। एवं संनिकर्षषट्कजन्यं ज्ञानं प्रत्यक्षं\nतत्करणमिन्द्रियं\nतस्मातिन्द्रियं प्रत्यक्षप्रमाणमिति सिद्धम्॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000132.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000133", "originalText": "अनुमितिकरणमनुमानम्।", "padacchedaText": "", "audioFile": "PB_000133.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000134", "originalText": "परामर्शजन्यं ज्ञानमनुमितिः।", "padacchedaText": "", "audioFile": "PB_000134.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000135", "originalText": "व्याप्तिविशिष्टपक्षधर्मताज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000135.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000136", "originalText": "यथा वह्निव्याप्यधूमवानयं पर्वत इति ज्ञानं\nपरामर्शः।", "padacchedaText": "", "audioFile": "PB_000136.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000137", "originalText": "तज्जन्यं पर्वतो वह्निमानिति ज्ञानमनुमितिः।", "padacchedaText": "", "audioFile": "PB_000137.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000138", "originalText": "यत्र यत्र धूमस्तत्र तत्राग्निरिति साहचर्यनियमो\nव्याप्तिः। व्याप्यस्य पर्वतादिवृत्तित्वं पक्षधर्मता॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000138.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000139", "originalText": "अनुमानं द्विविधं स्वार्थं परार्थं च।", "padacchedaText": "", "audioFile": "PB_000139.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000140", "originalText": "तत्र स्वार्थं स्वानुमितिहेतुः तथाहि स्वायमेव\nभूयोदर्शनेन यत्र यत्र\nधूमस्तत्र तत्राग्निरिति महानसादौ व्याप्तिं गृहीत्वा\nपर्वतसमीपं गतः\nतद्गते चाग्नौ सन्दिहानः पर्वते धूमं पश्यन्व्याप्तिं\nस्मरति यत्र यत्र\nधूमस्तत्र तत्राग्निरिति।", "padacchedaText": "", "audioFile": "PB_000140.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000141", "originalText": "तदनन्तरं वह्निव्याप्यधुमवानयं पर्वत इति\nज्ञानमुत्पद्यते अयमेव\nलिङ्गपरामर्श इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000141.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000142", "originalText": "तस्मात्पर्वतो वह्निमानिति ज्ञानमनुमितिः उत्पद्यते।", "padacchedaText": "", "audioFile": "PB_000142.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000143", "originalText": "तदेतत्स्वार्थानुमानम्।", "padacchedaText": "", "audioFile": "PB_000143.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000144", "originalText": "यत्तु स्वयं धुमाग्निमनुमाय परंप्रतिबोधयितुं\nपञ्चावयव वाक्यं प्रयुज्यते\nतत्परार्थानुमानम्।", "padacchedaText": "", "audioFile": "PB_000144.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000145", "originalText": "यथा पर्वतो वह्निमान्धूमत्वाद्यो यो धूमवान्स\nवह्निमान्यथा महानसः तथा\nचायं तस्मात्तथेति। अनेन प्रतिपादिताल्लिङ्गात्परोऽप्यग्निं प्रतिपद्यते॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000145.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000146", "originalText": "प्रतिज्ञाहेतूदाहरणोपनयनिगमनानि पञ्चावयवाः।", "padacchedaText": "", "audioFile": "PB_000146.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000147", "originalText": "पर्वतो वह्निमानिति प्रतिज्ञा।", "padacchedaText": "", "audioFile": "PB_000147.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000148", "originalText": "धूमवत्वादिति हेतुः।", "padacchedaText": "", "audioFile": "PB_000148.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000149", "originalText": "यो यो धूमवान्स वह्निमान्यथा महानस इत्युदाहरणम्।", "padacchedaText": "", "audioFile": "PB_000149.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000150", "originalText": "तथा चायमित्युपनयः। तस्मात्तथेति निगमनम्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_000150.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000151", "originalText": "स्वार्थानुमितिपरार्थानुमित्योः लिङ्गपरामर्श एव\nकरणम्। तस्माल्लिङ्गपरामर्शोऽनुमानम्॥ ४३॥", "padacchedaText": "", "audioFile": "PB_000151.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000152", "originalText": "लिङ्गं त्रिविधम्।", "padacchedaText": "", "audioFile": "PB_000152.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000153", "originalText": "अन्वयव्यतिरेकि केवलान्वयि केवलव्यतिरेकि चेति।", "padacchedaText": "", "audioFile": "PB_000153.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000154", "originalText": "अन्वयेन व्यतिरेकेण च व्याप्तिमदन्वयव्यतिरेकि।", "padacchedaText": "", "audioFile": "PB_000154.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000155", "originalText": "यथा वह्नौ साध्ये धूमवत्त्वम्।", "padacchedaText": "", "audioFile": "PB_000155.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000156", "originalText": "यत्र धूमस्तत्राग्निर्यथा महानस इत्यन्वयव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000156.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000157", "originalText": "यत्र वह्निर्नास्ति तत्र धूमोऽपि नास्ति यथा महाह्रिद\nइति व्यतिरेकव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000157.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000158", "originalText": "अन्वयमात्रव्याप्तिकं केवलान्वयि।", "padacchedaText": "", "audioFile": "PB_000158.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000159", "originalText": "यथा घटोऽभिधेयः प्रमेयत्वात्पटवत्।", "padacchedaText": "", "audioFile": "PB_000159.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000160", "originalText": "अत्र प्रमेयत्वाभिधेयत्वयोः व्यतिरेकव्याप्तिर्नास्ति\nसर्वस्यापि\nप्रमेयत्वादभिधेयत्वाच्च।", "padacchedaText": "", "audioFile": "PB_000160.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000161", "originalText": "व्यतिरेकमात्रव्याप्तिकं केवलव्यतिरेकि यथा\nपृथिवीतरेभ्यो भिद्यते गन्धवत्त्वात्।", "padacchedaText": "", "audioFile": "PB_000161.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000162", "originalText": "यदितरेभ्यो न भिद्यते न तद्गन्धवद्यथा जलम्।", "padacchedaText": "", "audioFile": "PB_000162.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000163", "originalText": "न चेयं तथा।", "padacchedaText": "", "audioFile": "PB_000163.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000164", "originalText": "तस्मान्न तथेति। अत्र यद्गन्धवत्तदितरभिन्नमित्यन्वयदृष्टान्तो\nनास्ति पृथिवीमात्रस्य\nपक्षत्वात्॥ ४४॥", "padacchedaText": "", "audioFile": "PB_000164.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000165", "originalText": "सन्दिग्धसाध्यवान्पक्षः।", "padacchedaText": "", "audioFile": "PB_000165.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000166", "originalText": "यथा धूमवत्त्वे हेतौ पर्वतः।", "padacchedaText": "", "audioFile": "PB_000166.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000167", "originalText": "निश्चितसाध्यवान्सपक्षः यथा तत्रैव महानसम्। निश्चितसाध्याऽभाववान्विपक्षः यथा तत्रैव\nमहाह्रदः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_000167.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000168", "originalText": "सव्यभिचारविरुद्धसत्प्रतिपक्षासिद्धबाधिताः पञ्च\nहेत्वाभासाः।", "padacchedaText": "", "audioFile": "PB_000168.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000169", "originalText": "सव्यभिचारोऽनैकान्तिकः।", "padacchedaText": "", "audioFile": "PB_000169.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000170", "originalText": "स त्रिविधः साधारणासाधारणानुपसंहारिभेदात्।", "padacchedaText": "", "audioFile": "PB_000170.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000171", "originalText": "तत्र साध्याभाववद्वृत्तिः साधारणोऽनैकान्तिकः यथा\nपर्वतो वह्निमान्प्रमेयत्वादिति।", "padacchedaText": "", "audioFile": "PB_000171.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000172", "originalText": "प्रमेयत्वस्य वह्न्यभाववति ह्रदे विद्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_000172.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000173", "originalText": "सर्वसपक्षविपक्षव्यावृत्तः पक्षमात्रवृत्तिः\nअसाधारणः।", "padacchedaText": "", "audioFile": "PB_000173.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000174", "originalText": "यथा शब्दो नित्यः शब्दत्वादिति।", "padacchedaText": "", "audioFile": "PB_000174.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000175", "originalText": "शब्दत्वं हि सर्वेभ्यो नित्येभ्योऽनित्येभ्यश्च\nव्यावृत्तं शब्दमात्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_000175.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000176", "originalText": "अन्वयव्यतिरेकदृष्टान्तरहितोऽनुपसंहारी।", "padacchedaText": "", "audioFile": "PB_000176.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000177", "originalText": "यथा सर्वमनित्यं प्रमेयत्वादिति।", "padacchedaText": "", "audioFile": "PB_000177.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000178", "originalText": "अत्र सर्वस्यापि पक्षत्वाद्दृष्टान्तो नास्ति।", "padacchedaText": "", "audioFile": "PB_000178.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000179", "originalText": "साध्याभावव्याप्तो हेतुर्विरुद्धः।", "padacchedaText": "", "audioFile": "PB_000179.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000180", "originalText": "यथा शब्दो नित्यः कृतकत्वादिति।", "padacchedaText": "", "audioFile": "PB_000180.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000181", "originalText": "कृतकत्वं हि नित्यत्वाभावेनाऽनित्यत्वेन व्याप्तम्।", "padacchedaText": "", "audioFile": "PB_000181.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000182", "originalText": "यस्य साध्याभावसाधकं हेत्वन्तरं विद्यते स\nसत्प्रतिपक्षः।", "padacchedaText": "", "audioFile": "PB_000182.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000183", "originalText": "यथा शब्दो नित्यः श्रावणत्वाच्छब्दत्ववत्।", "padacchedaText": "", "audioFile": "PB_000183.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000184", "originalText": "शब्दोऽनित्यः कार्यत्वाद्घटवत्।", "padacchedaText": "", "audioFile": "PB_000184.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000185", "originalText": "असिद्धस्त्रिविधः आश्रयासिद्धः स्वरूपासिद्धो\nव्याप्यत्वासिद्धश्चेति।", "padacchedaText": "", "audioFile": "PB_000185.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000186", "originalText": "आश्रयासिद्धो यथा गगनारविन्दं सुरभि\nअरविन्दत्वात्सरोजारविन्दवत्।", "padacchedaText": "", "audioFile": "PB_000186.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000187", "originalText": "अत्र गगनारविन्दमाश्रयः स च नास्त्येव।", "padacchedaText": "", "audioFile": "PB_000187.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000188", "originalText": "स्वरूपासिद्धो यथा शब्दो गुणश्चाक्षुषत्वात्।", "padacchedaText": "", "audioFile": "PB_000188.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000189", "originalText": "अत्र चाक्षुषत्वं शब्दं नास्ति शब्दस्य\nश्रावणत्वात्।", "padacchedaText": "", "audioFile": "PB_000189.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000190", "originalText": "सोपाधिको हेतुः व्याप्यत्वासिद्धः।", "padacchedaText": "", "audioFile": "PB_000190.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000191", "originalText": "साध्यव्यापकत्वे सति साधनाव्यापकत्वमुपाधिः।", "padacchedaText": "", "audioFile": "PB_000191.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000192", "originalText": "साध्यसमानाधिकरणात्यन्ताभावाप्रतियोगित्वं\nसाध्यव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_000192.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000193", "originalText": "साधनवन्निष्ठात्यन्ताभावप्रतियोगित्वं\nसाधनाव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_000193.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000194", "originalText": "पर्वतो धूमवान्वह्निमत्वादित्यत्रार्द्रेन्धनसंयोग\nउपाधिः।", "padacchedaText": "", "audioFile": "PB_000194.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000195", "originalText": "तथाहि।", "padacchedaText": "", "audioFile": "PB_000195.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000196", "originalText": "यत्र धूमस्तत्रार्द्रेन्धनसंयोग इति साध्यव्यापकता।", "padacchedaText": "", "audioFile": "PB_000196.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000197", "originalText": "यत्र वह्निस्तत्रार्द्रेन्धनसंयोगो नास्त्ययोगोलके\nआर्द्रेन्धनसंयोगाभावादिति\nसाधनाव्यापकता।", "padacchedaText": "", "audioFile": "PB_000197.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000198", "originalText": "एवं साध्यव्यापकत्वे अस्ति\nसाधनाव्यापकत्वार्द्रेन्धनसंयोग उपाधिः।", "padacchedaText": "", "audioFile": "PB_000198.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000199", "originalText": "सोपाधिकत्वाद्वह्निमत्त्वं व्याप्यत्वासिद्धम्।", "padacchedaText": "", "audioFile": "PB_000199.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000200", "originalText": "यस्य साध्याभावः प्रमाणान्तरेण निश्चितः स\nबाधितः।", "padacchedaText": "", "audioFile": "PB_000200.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000201", "originalText": "यथा वह्निरनुष्णो द्रव्यत्वाज्जलवत्। अत्रानुष्णत्वं साध्यं तदभाव उष्णत्वं\nस्पर्शनप्रत्यक्षेण गुह्यते\nइति बाधितत्वम्॥ ४६॥", "padacchedaText": "", "audioFile": "PB_000201.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000202", "originalText": "उपमितिकरणमुपमानम्।", "padacchedaText": "", "audioFile": "PB_000202.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000203", "originalText": "संज्ञासंज्ञिसम्बन्धज्ञानमुपमितिः।", "padacchedaText": "", "audioFile": "PB_000203.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000204", "originalText": "तत्करणं सादृश्यज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000204.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000205", "originalText": "अतिदेशवाक्यार्थस्मरणमवान्तर व्यापारः।", "padacchedaText": "", "audioFile": "PB_000205.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000206", "originalText": "तथा हि\nकश्चिद्गवयशब्दार्थमजानन्कुतश्चिदारण्यकपुरुषाद्गोसदृशो\nगवय इति श्रुत्वा वन गतो वाक्यार्थं\nस्मरन्गोसदृशं पिण्डं पश्यति। तदनन्तरमसौ गवयशब्दवाच्य\nइत्युपमितिरुत्पद्यते॥ ४७॥", "padacchedaText": "", "audioFile": "PB_000206.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000207", "originalText": "आप्तवाक्यं शब्दः।", "padacchedaText": "", "audioFile": "PB_000207.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000208", "originalText": "आप्तस्तु यथार्थवक्ता।", "padacchedaText": "", "audioFile": "PB_000208.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000209", "originalText": "वाक्यं पदसमूहः।", "padacchedaText": "", "audioFile": "PB_000209.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000210", "originalText": "यथा गामानयेति।", "padacchedaText": "", "audioFile": "PB_000210.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000211", "originalText": "शक्तं पदम्। अस्मात्पदादयमर्थो बोद्धव्य इतीश्वरसंकेतः\nशक्तिः॥ ४८॥", "padacchedaText": "", "audioFile": "PB_000211.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000212", "originalText": "आकाङ्क्षा योग्यता संनिधिश्च वाक्यार्थज्ञानहेतुः\nपदस्य\nपदान्तरव्यतिरेकप्रयुक्तान्वयाननुभावकत्वमाकाङ्क्षा।", "padacchedaText": "", "audioFile": "PB_000212.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000213", "originalText": "अर्थाबोधो योग्यता। पदानामविलम्बेनोच्चारणं संनिधिः॥ ४९॥", "padacchedaText": "", "audioFile": "PB_000213.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000214", "originalText": "आकाङ्क्षादिरहितं वाक्यमप्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000214.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000215", "originalText": "यथा गौरश्वः पुरुषो हस्तीति न\nप्रमाणमाकाङ्क्षाविरहात्।", "padacchedaText": "", "audioFile": "PB_000215.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000216", "originalText": "अग्निना सिञ्चेदिति न प्रमाणं योग्यताविरहात्। प्रहरे प्रहरेऽसहोच्चारितानि गामानयेत्यादिपदानि न\nप्रमाणं सांनिध्याभावात्॥ ५०॥", "padacchedaText": "", "audioFile": "PB_000216.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000217", "originalText": "वाक्यं द्विविधम्।", "padacchedaText": "", "audioFile": "PB_000217.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000218", "originalText": "वैदिकं लौकिकं च।", "padacchedaText": "", "audioFile": "PB_000218.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000219", "originalText": "वैदिकमीश्वरोक्तत्वात्सर्वमेव प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000219.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000220", "originalText": "लौकिकं त्वाप्तोक्तं प्रमाणम्। अन्यदप्रमाणम्॥ ५१॥", "padacchedaText": "", "audioFile": "PB_000220.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000221", "originalText": "वाक्यार्थज्ञानं शब्दज्ञानम्। तत्करणं शब्दः॥ ५२॥", "padacchedaText": "", "audioFile": "PB_000221.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000222", "originalText": "अयथार्थानुभवस्त्रिविधः संशयविपर्ययतर्कभेदात्।", "padacchedaText": "", "audioFile": "PB_000222.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000223", "originalText": "एकस्मिन्धर्मिणि विरुद्धनानाधर्मवैशिष्ट्यावगाहि\nज्ञानं संशयः।", "padacchedaText": "", "audioFile": "PB_000223.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000224", "originalText": "यथा स्थाणुर्वा पुरुषो वेति।", "padacchedaText": "", "audioFile": "PB_000224.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000225", "originalText": "मिथ्याज्ञानं विपर्ययः।", "padacchedaText": "", "audioFile": "PB_000225.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000226", "originalText": "यथा शुक्तौ इदं रजतमिति। व्याप्यारोपेण व्यापकारोपस्तर्कः यथा यदि वह्निर्न\nस्यात्तर्हि धूमोऽपि न स्यादिति॥ ५३॥", "padacchedaText": "", "audioFile": "PB_000226.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000227", "originalText": "स्मृतिरपि द्विविधा।", "padacchedaText": "", "audioFile": "PB_000227.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000228", "originalText": "यथार्थायथार्था च।", "padacchedaText": "", "audioFile": "PB_000228.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000229", "originalText": "प्रमाजन्या यथार्था। अप्रमाजन्याऽयथार्था॥ ५४॥", "padacchedaText": "", "audioFile": "PB_000229.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000230", "originalText": "सर्वेषामनुकूलतया वेदनीयं सुखम्॥ ५५॥", "padacchedaText": "", "audioFile": "PB_000230.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000231", "originalText": "सर्वेषां प्रतिकूलतया वेदनीयं दुःखम्॥ ५६॥", "padacchedaText": "", "audioFile": "PB_000231.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000232", "originalText": "इच्छा कामः॥ ५७॥", "padacchedaText": "", "audioFile": "PB_000232.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000233", "originalText": "क्रोधो द्वेषः॥ ५८॥", "padacchedaText": "", "audioFile": "PB_000233.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000234", "originalText": "कृतिः प्रयत्नः॥ ५९॥", "padacchedaText": "", "audioFile": "PB_000234.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000235", "originalText": "विहितकर्मजन्यो धर्मः॥ ६०॥", "padacchedaText riginalText": "शरीरसंनिकृष्टसंयोगहेतुराकुञ्चनम्।", "padacchedaText": "", "audioFile": "PB_000248.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000249", "originalText": "विप्रकृष्टसंयोगहेतुः प्रसारणम्।", "padacchedaText": "", "audioFile": "PB_000249.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000250", "originalText": "अन्यत्सर्वं गमनम्। पृथिव्यादिचतुष्टयमनोमात्रवृत्ति॥ ६५॥", "padacchedaText": "", "audioFile": "PB_000250.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000251", "originalText": "नित्यमेकमनेकानुगतं सामान्यं\nद्रव्यगुणकर्मवृत्ति।", "padacchedaText": "", "audioFile": "PB_000251.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000252", "originalText": "तद्द्विविधं परापरभेदात्।", "padacchedaText": "", "audioFile": "PB_000252.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000253", "originalText": "परं सत्ता। अपरं द्रव्यत्वादिः॥ ६६॥", "padacchedaText": "", "audioFile": "PB_000253.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000254", "originalText": "नित्यद्रव्यवृत्तयो व्यावर्तका विशेषाः॥ ६७॥", "padacchedaText": "", "audioFile": "PB_000254.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000255", "originalText": "नित्यसम्बन्धः समवायः।", "padacchedaText": "", "audioFile": "PB_000255.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000256", "originalText": "अयुतसिद्धवृत्तिः। ययोर्द्वयोर्मध्ये\nएकमविनश्यदपराऽश्रितमेवावतिष्ठते\nतावयुतसिद्धौ\nयथा अवयवाऽवयविनौ क्रियाक्रियावन्तौ जातिव्यक्ती\nविशेषनित्यद्रव्ये चेति॥ ६८॥", "padacchedaText": "", "audioFile": "PB_000256.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000257", "originalText": "अनादिः सान्तः प्रागभावः।", "padacchedaText": "", "audioFile": "PB_000257.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000258", "originalText": "उत्पत्तेः पूर्वं कार्यस्य।", "padacchedaText": "", "audioFile": "PB_000258.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000259", "originalText": "सादिरनन्तः प्रध्वंसः।", "padacchedaText": "", "audioFile": "PB_000259.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000260", "originalText": "उत्पत्यनन्तरं कार्यस्य।", "padacchedaText": "", "audioFile": "PB_000260.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000261", "originalText": "त्रैकालिकसंसर्गावच्छिन्नप्रतियोगिताकोऽत्यन्ताभावः।", "padacchedaText": "", "audioFile": "PB_000261.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000262", "originalText": "यथा भूतले घटो नास्तीति।", "padacchedaText": "", "audioFile": "PB_000262.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000263", "originalText": "तादात्म्यसम्बन्धावच्छिन्नप्रतियोगिताकोऽन्योन्याभावः। यथा घटः पटो नेति॥ ६९॥", "padacchedaText": "", "audioFile": "PB_000263.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000264", "originalText": "सर्वेषां पदार्थानां यथायथमुक्तेष्वन्तर्भावात्सप्तैव\nपदार्था इति सिद्धम्॥ ७०॥", "padacchedaText": "", "audioFile": "PB_000264.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000265", "originalText": "कणादन्यायमतयोर्बालव्युत्पत्तिसिद्धये। अन्नंभट्टेन विदुषा रचितस्तर्कसंग्रहः॥", "padacchedaText": "", "audioFile": "PB_000265.wav", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000266", "originalText": "इति श्रीमहामहोपाध्याय\nअन्नम्भट्टविरचिततर्कसंग्रहः समाप्तः॥", "padacchedaText": "", "audioFile": "PB_000266.wav", "zipFile": "TarkaSangraha.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
