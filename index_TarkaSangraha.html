        const manifest = [{"id": "B_000000", "originalText": "॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000001", "originalText": "अन्नम्भट्टविरचिततर्कसंग्रहः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000002", "originalText": "निधाय हृदि विश्वेशं विधाय गुरुवन्दनम्। बालानां सुखबोधाय क्रियते तर्कसंग्रहः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000003", "originalText": "द्रव्यगुणकर्मसामान्यविशेषसमवायाऽभावाः\nसप्तपदार्थाः॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000004", "originalText": "तत्र द्रव्याणि पृथिव्यप्तेजोवाय्वाकाशाकालदिगात्ममनांसि नवैव॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000005", "originalText": "रूपरसगन्धस्पर्शसंख्यापरिमाणपृथक्त्वसंयोगविभाग—\nपरत्वापरत्वगुरुत्व—\nद्रवत्व—स्नेह—शब्द—बुद्धि—सुख—दुःखेच्छा—द्वेष—प्रयत्न—\nधर्माधर्म—संस्काराः चतुर्विंशतिर्गुणाः॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000006", "originalText": "उत्क्षेपणापक्षेपणाकुञ्चनप्रसारणगमनानि\nपञ्च कर्माणि॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000007", "originalText": "परमपरं चेति द्विविधं सामान्यम्॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000008", "originalText": "नित्यद्रव्यवृत्तयो विशेषास्त्वनन्ता एव॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000009", "originalText": "समवायस्त्वेक एव॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000010", "originalText": "अभावश्चतुर्विधः प्रागभावः प्रध्वंसाभावः\nअत्यन्ताभावः अन्य pFile": "TarkaSangraha.zip"}, {"id": "B_000023", "originalText": "पुनस्त्रिविधा शरीरेन्द्रियविषयभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000024", "originalText": "शरीरं वरुणलोके।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000025", "originalText": "इन्द्रियं रसग्राहकं रसनं जिह्वाग्रवर्ति। विषयः सरित्समुद्रादिः॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000026", "originalText": "उष्णस्पर्शवत्तेजः।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000027", "originalText": "तच्च द्विविधं नित्यमनित्यं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000028", "originalText": "नित्यं परमाणुरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000029", "originalText": "अनित्यं कार्यरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000030", "originalText": "पुनस्त्रिविधं शरीरेन्द्रियविषयभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000031", "originalText": "शरीरमादित्यलोके प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000032", "originalText": "इन्द्रियं रूपग्राहकं चक्षुः कृष्णताराग्रवर्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000033", "originalText": "विषयश्चतुर्विधः भौमदिव्यौदर्याकरजभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000034", "originalText": "भौमं वह्न्यादिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000035", "originalText": "अबिन्धनं दिव्यं विद्युदादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000036", "originalText": "भुक्तस्य परिणामहेतुरौदर्यम्। आकरजं सुवर्णादि॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000037", "originalText": "रूपरहीतः स्पर्शवान्वायुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000038", "originalText": "स द्विविधः नित्योऽनित्यश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000039", "originalText": "नित्यः परमाणुरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000040", "originalText": "अनित्यः कार्यरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000041", "originalText": "पुनस्त्रिविधः शरीरेन्द्रियविषयभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000042", "originalText": "शरीरं वायुलोके।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000043", "originalText": "इन्द्रियं स्पर्शग्राहकं त्वक्सर्वशरीरवर्ति। विषयो वृक्षादिकम्पनहेतुः॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000044", "originalText": "शरीरान्तःसंचारी वयुः प्राणः। स च एकोऽप्युपाधिभेदात्प्राणापानादिसंज्ञां लभते॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000045", "originalText": "शब्दगुणकमाकाशम्। तच्चैकं विभु नित्यञ्च॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000046", "originalText": "अतीतादिव्यवहारहेतुः कालः। स चैको विभुर्नित्यश्च॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000047", "originalText": "प्राच्यादिव्यवहारहेतुर्दिक्। सा चैका विभ्वी नित्या च॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000048", "originalText": "ज्ञानाधिकरणमात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000049", "originalText": "स द्विविधः परमात्मा जीवात्मा च।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000050", "originalText": "तत्रेश्वरः सर्वज्ञः परमात्मैक एव। जीवात्मा प्रतिशरीरं भिन्नो विभुर्नित्यश्च॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000051", "originalText": "सुखाद्युपलब्धिसाधनमिन्द्रियं मनः। तच्च प्रत्यात्मनियतत्वादनन्तं परमाणुरूपं नित्यं\nच॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000052", "originalText": "चक्षुर्मात्रग्राह्यो गुणो रूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000053", "originalText": "तच्च शुक्लनीलपीतरक्तहरितकपिशचिन्न\nभेदात्सप्तविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000054", "originalText": "पृथिवीजलतेजोवृत्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000055", "originalText": "तत्र पृथिव्यां सप्तविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000056", "originalText": "अभास्वरशुक्लं जले। भास्वरशुक्लं तेजसि॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000057", "originalText": "रसनग्राह्यो गुणो रसः।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000058", "originalText": "स च मधुराम्ललवणकटुकषायतिक्तभेदात्\nषड्विधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000059", "originalText": "पृथिवीजलवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000060", "originalText": "तत्र पृथिव्यां षड्विधः। जले मधुर एव॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000061", "originalText": "घ्राणग्राह्यो गुणो गन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000062", "originalText": "स द्विविधः सुरभिरसुरभिश्च। पृथिवीमात्रवृत्तिः॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000063", "originalText": "त्वगिन्द्रियमात्रग्राह्यो गुणः स्पर्शः।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000064", "originalText": "स च त्रिविधः शीतोष्णानुष्णाशीतभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000065", "originalText": "पृथिव्यप्तेजोवायुवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000066", "originalText": "तत्र शीतो जले।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000067", "originalText": "उष्णस्तेजसि। अनुष्णाशीतः पृथिवीवाय्वोः॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000068", "originalText": "रूपादिचतुष्टयं पृथिव्यां पाकजमनित्यं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000069", "originalText": "अन्यत्र अपाकजं नित्यमनित्यं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000070", "originalText": "नित्यगतं नित्यम्। अनित्यगतमनित्यम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000071", "originalText": "एकत्वादिव्यवहारहेतुः संख्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000072", "originalText": "सा नवद्रव्यवृत्तिः एकत्वादिपरार्धपर्यन्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000073", "originalText": "एकत्वं नित्यमनित्यं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000074", "originalText": "नित्यगतं नित्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000075", "originalText": "अनित्यगतमनित्यम्। द्वित्वादिकं तु सर्वत्राऽनित्यमेव॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000076", "originalText": "मानव्यवहारासाधारणकारणं परिमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000077", "originalText": "नवद्रव्यवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000078", "originalText": "तच्चतुर्विधम्। अनु महद्दीर्घं हृस्वं चेति॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000079", "originalText": "पृथग्व्यवहारासाधारणकारणं पृथक्त्वम्। सर्वद्रव्यवृत्तिः॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000080", "originalText": "संयुक्तव्यवहारहेतुः संयोगः। सर्वद्रव्यवृत्तिः॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000081", "originalText": "संयोगनाशको गुणो विभागः। सर्वद्रव्यवृत्तिः॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000082", "originalText": "परापरव्यवहारासाधारणकारणे परत्वापरत्वे।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000083", "originalText": "पृथिव्यादिचतुष्टय मनोवृत्तिनी।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000084", "originalText": "ते द्विविधे दिक्कृते कालकृते च।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000085", "originalText": "दूरस्ते दिक्कृतं परत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000086", "originalText": "समीपस्थे दिक्कृतमपरत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000087", "originalText": "ज्येष्ठे कालकृतं परत्वम्। कनिष्ठे कालकृतमपरत्वम्॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000088", "originalText": "आद्यपतनासमवायिकारणं गुरुत्वम्। पृथिवीजलवृत्ति॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000089", "originalText": "आद्यस्यन्दनासमवायिकारणं द्रवत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000090", "originalText": "पृथिव्यप्तेजोवृत्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000091", "originalText": "तद्द्विविधं सांसिद्धिकं नैमित्तिकं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000092", "originalText": "सांसिद्धिकं जले।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000093", "originalText": "नैमित्तिकं पृथिवीतेजसोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000094", "originalText": "पृथिव्यां घृतादावग्नि संयोगजं द्रवत्वम्। तेजसि सुवर्णादौ॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000095", "originalText": "चूर्णादिपिण्डीभावहेतुर्गुणः स्नेहः। जलमात्रवृत्तिः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000096", "originalText": "श्रोत्रग्राह्यो गुणः शब्दः आकाशमात्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000097", "originalText": "स द्विविधः ध्वन्यात्मकः वर्णात्मकश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000098", "originalText": "तत्र ध्वन्यात्मकः भेर्यादौ। वर्णात्मकः संस्कृतभाषादिरूपः॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000099", "originalText": "सर्वव्यवहारहेतुर्गुणो बुद्धिर्ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000100", "originalText": "सा द्विविधा स्मृतिरनुभवश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000101", "originalText": "संस्कारमात्रजन्यं ज्ञानं स्मृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000102", "originalText": "तद्भिन्नं ज्ञानमनुभवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000103", "originalText": "स द्विविधः यथार्थोऽयथार्थश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000104", "originalText": "तद्वति तत्प्रकारकोऽनुभवो यथार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000105", "originalText": "यथा रजते इदं रजतमिति ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000106", "originalText": "सैव प्रमेत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000107", "originalText": "तदभाववति तत्प्रकारकोऽनुभवोऽयथार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000108", "originalText": "यथा शुक्ताविदंरजतमिति ज्ञानम्। सैव अप्रमेत्युच्यते॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000109", "originalText": "यथार्थनुभवश्चतुर्विधः\nप्रत्यक्षानुमित्युपमितिशाब्दभेदात्। तत्करणमपि चतुर्विधं\nप्रत्यक्षानुमानोपमानशब्दाभेदात्॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000110", "originalText": "असाधारणं कारणं करणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000111", "originalText": "कार्यनियतपूर्ववृत्ति कारणम्। कार्यं प्रागभावप्रतियोगि॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000112", "originalText": "कारणं त्रिविधं समवाय्यसमवायिनिमित्तभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000113", "originalText": "यत्समवेतं कार्यमुत्पद्यते तत्समवायिकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000114", "originalText": "यथा तंतवः पटस्य पटश्च स्वगतरूपादेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000115", "originalText": "कार्येण कारणेन वा सहैकस्मिन्नर्थे समवेतत्वे सति\nयत्कारणं\nतदसमवायिकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000116", "originalText": "यथा तंतुसंयोगः पटस्य तन्तुरूपं पटरूपस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000117", "originalText": "तदुभयभिन्नं कारणं निमित्तकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000118", "originalText": "यथा तुरीवेमादिकं पटस्य। तदेतत्त्रिविधकारणमध्ये यदसाधारणं कारणं\nतदेव करणम्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000119", "originalText": "तत्र प्रत्यक्षज्ञानकरणं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000120", "originalText": "इन्द्रियार्थसंनिकर्षजन्यं ज्ञानं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000121", "originalText": "तद्द्विविधं निर्विकल्पकं सविकल्पकं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000122", "originalText": "तत्र निष्प्रकारणं ज्ञानं निर्विकल्पकं यथेदं\nकिञ्चित्। सप्रकारकं ज्ञानं सविकल्पकं यथा डित्थोऽयं\nब्राह्मणोऽयं श्यामोऽयं\nपाचकोऽयमिति॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000123", "originalText": "प्रत्यक्षज्ञानहेतुरिन्द्रियार्थसंनिकर्षः\nषड्विधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000124", "originalText": "संयोगः संयुक्तसमवायः संयुक्तसमवेतसमवायः\nसमवायः\nसमवेतसमवायः विशेषणविशेष्यभावश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000125", "originalText": "चक्षुषा घटप्रत्यक्षजनने संयोगः संनिकर्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000126", "originalText": "घटरूपप्रत्यक्षजनने संयुक्तसमवायः\nसंनिकर्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000127", "originalText": "चक्षुः संयुक्ते घटे रूपस्य समवायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000128", "originalText": "रूपत्वसामान्यप्रत्यक्षे संयुक्तसमवेतसमवायः\nसंनिकर्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000129", "originalText": "चक्षुः संयुक्ते घटे रूपं समवेतं तत्र\nरूपत्वस्य समवायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000130", "originalText": "श्रोत्रेण शब्दसाक्षात्कारे समवायः संनिकर्षः\nकर्णविवरवर्त्याकाशस्य\nश्रोत्रत्वात् शब्दस्याकाशगुणत्वाद्गुणगुणिनोश्च\nसमवायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000131", "originalText": "शब्दत्वसाक्षात्कारे समवेतसमवायः संनिकर्षः\nश्रोत्रसमवेते शब्दे\nशब्दत्वस्य समवायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000132", "originalText": "अभावप्रत्यक्षे विशेषणविशेष्यभावः संनिकर्षः\nघटाभाववद्भूतलमित्यत्र\nचक्षुः संयुक्ते भूतले घटाभावस्य विशेषणत्वात्। एवं संनिकर्षषट्कजन्यं ज्ञानं प्रत्यक्षं\nतत्करणमिन्द्रियं\nतस्मातिन्द्रियं प्रत्यक्षप्रमाणमिति सिद्धम्॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000133", "originalText": "अनुमितिकरणमनुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000134", "originalText": "परामर्शजन्यं ज्ञानमनुमितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000135", "originalText": "व्याप्तिविशिष्टपक्षधर्मताज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000136", "originalText": "यथा वह्निव्याप्यधूमवानयं पर्वत इति ज्ञानं\nपरामर्शः।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000137", "originalText": "तज्जन्यं पर्वतो वह्निमानिति ज्ञानमनुमितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000138", "originalText": "यत्र यत्र धूमस्तत्र तत्राग्निरिति साहचर्यनियमो\nव्याप्तिः। व्याप्यस्य पर्वतादिवृत्तित्वं पक्षधर्मता॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000139", "originalText": "अनुमानं द्विविधं स्वार्थं परार्थं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000140", "originalText": "तत्र स्वार्थं स्वानुमितिहेतुः तथाहि स्वायमेव\nभूयोदर्शनेन यत्र यत्र\nधूमस्तत्र तत्राग्निरिति महानसादौ व्याप्तिं गृहीत्वा\nपर्वतसमीपं गतः\nतद्गते चाग्नौ सन्दिहानः पर्वते धूमं पश्यन्व्याप्तिं\nस्मरति यत्र यत्र\nधूमस्तत्र तत्राग्निरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000141", "originalText": "तदनन्तरं वह्निव्याप्यधुमवानयं पर्वत इति\nज्ञानमुत्पद्यते अयमेव\nलिङ्गपरामर्श इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000142", "originalText": "तस्मात्पर्वतो वह्निमानिति ज्ञानमनुमितिः उत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000143", "originalText": "तदेतत्स्वार्थानुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000144", "originalText": "यत्तु स्वयं धुमाग्निमनुमाय परंप्रतिबोधयितुं\nपञ्चावयव वाक्यं प्रयुज्यते\nतत्परार्थानुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000145", "originalText": "यथा पर्वतो वह्निमान्धूमत्वाद्यो यो धूमवान्स\nवह्निमान्यथा महानसः तथा\nचायं तस्मात्तथेति। अनेन प्रतिपादिताल्लिङ्गात्परोऽप्यग्निं प्रतिपद्यते॥ ४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000146", "originalText": "प्रतिज्ञाहेतूदाहरणोपनयनिगमनानि पञ्चावयवाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000147", "originalText": "पर्वतो वह्निमानिति प्रतिज्ञा।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000148", "originalText": "धूमवत्वादिति हेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000149", "originalText": "यो यो धूमवान्स वह्निमान्यथा महानस इत्युदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000150", "originalText": "तथा चायमित्युपनयः। तस्मात्तथेति निगमनम्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000151", "originalText": "स्वार्थानुमितिपरार्थानुमित्योः लिङ्गपरामर्श एव\nकरणम्। तस्माल्लिङ्गपरामर्शोऽनुमानम्॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000152", "originalText": "लिङ्गं त्रिविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000153", "originalText": "अन्वयव्यतिरेकि केवलान्वयि केवलव्यतिरेकि चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000154", "originalText": "अन्वयेन व्यतिरेकेण च व्याप्तिमदन्वयव्यतिरेकि।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000155", "originalText": "यथा वह्नौ साध्ये धूमवत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000156", "originalText": "यत्र धूमस्तत्राग्निर्यथा महानस इत्यन्वयव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000157", "originalText": "यत्र वह्निर्नास्ति तत्र धूमोऽपि नास्ति यथा महाह्रिद\nइति व्यतिरेकव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000158", "originalText": "अन्वयमात्रव्याप्तिकं केवलान्वयि।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000159", "originalText": "यथा घटोऽभिधेयः प्रमेयत्वात्पटवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000160", "originalText": "अत्र प्रमेयत्वाभिधेयत्वयोः व्यतिरेकव्याप्तिर्नास्ति\nसर्वस्यापि\nप्रमेयत्वादभिधेयत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000161", "originalText": "व्यतिरेकमात्रव्याप्तिकं केवलव्यतिरेकि यथा\nपृथिवीतरेभ्यो भिद्यते गन्धवत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000162", "originalText": "यदितरेभ्यो न भिद्यते न तद्गन्धवद्यथा जलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000163", "originalText": "न चेयं तथा।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000164", "originalText": "तस्मान्न तथेति। अत्र यद्गन्धवत्तदितरभिन्नमित्यन्वयदृष्टान्तो\nनास्ति पृथिवीमात्रस्य\nपक्षत्वात्॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000165", "originalText": "सन्दिग्धसाध्यवान्पक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000166", "originalText": "यथा धूमवत्त्वे हेतौ पर्वतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000167", "originalText": "निश्चितसाध्यवान्सपक्षः यथा तत्रैव महानसम्। निश्चितसाध्याऽभाववान्विपक्षः यथा तत्रैव\nमहाह्रदः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000168", "originalText": "सव्यभिचारविरुद्धसत्प्रतिपक्षासिद्धबाधिताः पञ्च\nहेत्वाभासाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000169", "originalText": "सव्यभिचारोऽनैकान्तिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000170", "originalText": "स त्रिविधः साधारणासाधारणानुपसंहारिभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000171", "originalText": "तत्र साध्याभाववद्वृत्तिः साधारणोऽनैकान्तिकः यथा\nपर्वतो वह्निमान्प्रमेयत्वादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000172", "originalText": "प्रमेयत्वस्य वह्न्यभाववति ह्रदे विद्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000173", "originalText": "सर्वसपक्षविपक्षव्यावृत्तः पक्षमात्रवृत्तिः\nअसाधारणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000174", "originalText": "यथा शब्दो नित्यः शब्दत्वादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000175", "originalText": "शब्दत्वं हि सर्वेभ्यो नित्येभ्योऽनित्येभ्यश्च\nव्यावृत्तं शब्दमात्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000176", "originalText": "अन्वयव्यतिरेकदृष्टान्तरहितोऽनुपसंहारी।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000177", "originalText": "यथा सर्वमनित्यं प्रमेयत्वादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000178", "originalText": "अत्र सर्वस्यापि पक्षत्वाद्दृष्टान्तो नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000179", "originalText": "साध्याभावव्याप्तो हेतुर्विरुद्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000180", "originalText": "यथा शब्दो नित्यः कृतकत्वादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000181", "originalText": "कृतकत्वं हि नित्यत्वाभावेनाऽनित्यत्वेन व्याप्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000182", "originalText": "यस्य साध्याभावसाधकं हेत्वन्तरं विद्यते स\nसत्प्रतिपक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000183", "originalText": "यथा शब्दो नित्यः श्रावणत्वाच्छब्दत्ववत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000184", "originalText": "शब्दोऽनित्यः कार्यत्वाद्घटवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000185", "originalText": "असिद्धस्त्रिविधः आश्रयासिद्धः स्वरूपासिद्धो\nव्याप्यत्वासिद्धश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000186", "originalText": "आश्रयासिद्धो यथा गगनारविन्दं सुरभि\nअरविन्दत्वात्सरोजारविन्दवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000187", "originalText": "अत्र गगनारविन्दमाश्रयः स च नास्त्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000188", "originalText": "स्वरूपासिद्धो यथा शब्दो गुणश्चाक्षुषत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000189", "originalText": "अत्र चाक्षुषत्वं शब्दं नास्ति शब्दस्य\nश्रावणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000190", "originalText": "सोपाधिको हेतुः व्याप्यत्वासिद्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000191", "originalText": "साध्यव्यापकत्वे सति साधनाव्यापकत्वमुपाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000192", "originalText": "साध्यसमानाधिकरणात्यन्ताभावाप्रतियोगित्वं\nसाध्यव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000193", "originalText": "साधनवन्निष्ठात्यन्ताभावप्रतियोगित्वं\nसाधनाव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000194", "originalText": "पर्वतो धूमवान्वह्निमत्वादित्यत्रार्द्रेन्धनसंयोग\nउपाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000195", "originalText": "तथाहि।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000196", "originalText": "यत्र धूमस्तत्रार्द्रेन्धनसंयोग इति साध्यव्यापकता।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000197", "originalText": "यत्र वह्निस्तत्रार्द्रेन्धनसंयोगो नास्त्ययोगोलके\nआर्द्रेन्धनसंयोगाभावादिति\nसाधनाव्यापकता।", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000198", "originalText": "एवं साध्यव्यापकत्वे अस्ति\nसाधनाव्यापकत्वार्द्रेन्धनसंयोग उपाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000199", "originalText": "सोपाधिकत्वाद्वह्निमत्त्वं व्याप्यत्वासिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000200", "originalText": "यस्य साध्याभावः प्रमाणान्तरेण निश्चितः स\nबाधितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000201", "originalText": "यथा वह्निरनुष्णो द्रव्यत्वाज्जलवत्। अत्रानुष्णत्वं साध्यं तदभाव उष्णत्वं\nस्पर्शनप्रत्यक्षेण गुह्यते\nइति बाधितत्वम्॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000202", "originalText": "उपमितिकरणमुपमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000203", "originalText": "संज्ञासंज्ञिसम्बन्धज्ञानमुपमितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000204", "originalText": "तत्करणं सादृश्यज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000205", "originalText": "अतिदेशवाक्यार्थस्मरणमवान्तर व्यापारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000206", "originalText": "तथा हि\nकश्चिद्गवयशब्दार्थमजानन्कुतश्चिदारण्यकपुरुषाद्गोसदृशो\nगवय इति श्रुत्वा वन गतो वाक्यार्थं\nस्मरन्गोसदृशं पिण्डं पश्यति। तदनन्तरमसौ गवयशब्दवाच्य\nइत्युपमितिरुत्पद्यते॥ ४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000207", "originalText": "आप्तवाक्यं शब्दः।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000208", "originalText": "आप्तस्तु यथार्थवक्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000209", "originalText": "वाक्यं पदसमूहः।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000210", "originalText": "यथा गामानयेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000211", "originalText": "शक्तं पदम्। अस्मात्पदादयमर्थो बोद्धव्य इतीश्वरसंकेतः\nशक्तिः॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000212", "originalText": "आकाङ्क्षा योग्यता संनिधिश्च वाक्यार्थज्ञानहेतुः\nपदस्य\nपदान्तरव्यतिरेकप्रयुक्तान्वयाननुभावकत्वमाकाङ्क्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000213", "originalText": "अर्थाबोधो योग्यता। पदानामविलम्बेनोच्चारणं संनिधिः॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000214", "originalText": "आकाङ्क्षादिरहितं वाक्यमप्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000215", "originalText": "यथा गौरश्वः पुरुषो हस्तीति न\nप्रमाणमाकाङ्क्षाविरहात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000216", "originalText": "अग्निना सिञ्चेदिति न प्रमाणं योग्यताविरहात्। प्रहरे प्रहरेऽसहोच्चारितानि गामानयेत्यादिपदानि न\nप्रमाणं सांनिध्याभावात्॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000217", "originalText": "वाक्यं द्विविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000218", "originalText": "वैदिकं लौकिकं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000219", "originalText": "वैदिकमीश्वरोक्तत्वात्सर्वमेव प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000220", "originalText": "लौकिकं त्वाप्तोक्तं प्रमाणम्। अन्यदप्रमाणम्॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000221", "originalText": "वाक्यार्थज्ञानं शब्दज्ञानम्। तत्करणं शब्दः॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000222", "originalText": "अयथार्थानुभवस्त्रिविधः संशयविपर्ययतर्कभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000223", "originalText": "एकस्मिन्धर्मिणि विरुद्धनानाधर्मवैशिष्ट्यावगाहि\nज्ञानं संशयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000224", "originalText": "यथा स्थाणुर्वा पुरुषो वेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000225", "originalText": "मिथ्याज्ञानं विपर्ययः।", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000226", "originalText": "यथा शुक्तौ इदं रजतमिति। व्याप्यारोपेण व्यापकारोपस्तर्कः यथा यदि वह्निर्न\nस्यात्तर्हि धूमोऽपि न स्यादिति॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000227", "originalText": "स्मृतिरपि द्विविधा।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000228", "originalText": "यथार्थायथार्था च।", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000229", "originalText": "प्रमाजन्या यथार्था। अप्रमाजन्याऽयथार्था॥ ५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000230", "originalText": "सर्वेषामनुकूलतया वेदनीयं सुखम्॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000231", "originalText": "सर्वेषां प्रतिकूलतया वेदनीयं दुःखम्॥ ५६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000232", "originalText": "इच्छा कामः॥ ५७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000233", "originalText": "क्रोधो द्वेषः॥ ५८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000234", "originalText": "कृतिः प्रयत्नः॥ ५९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000235", "originalText": "विहितकर्मजन्यो धर्मः॥ ६०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000236", "originalText": "निषिद्धकर्मजन्यस्त्वधर्मः॥ ६१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000237", "originalText": "बुद्ध्यादयोऽष्टावात्ममात्रविशेषगुणाः॥ ६२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000238", "originalText": "बुद्धीच्छा प्रयत्ना द्विविधाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000239", "originalText": "नित्या अनित्याश्च। नित्या ईश्वरस्यानित्या जीवस्य॥ ६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000240", "originalText": "संस्कारस्त्रिविधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000241", "originalText": "वेगो भावना स्थितिस्थापकश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000242", "originalText": "वेगः पृथिव्यादिचतुष्टयमनोवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000243", "originalText": "अनुभवजन्या स्मृतिहेतुर्भावना।", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000244", "originalText": "आत्ममात्रवृत्तिः। अन्यथाकृतस्य पुनस्तदवस्थापकः स्थितिस्थापकः\nकटादिपृथिवीवृत्तिः॥ ६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000245", "originalText": "चलनात्मकं कर्म।", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000246", "originalText": "ऊर्ध्वदेशसंयोगहेतुरुत्क्षेपणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000247", "originalText": "अधोदेशसंयोगहेतुरपक्षेपणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000248", "originalText": "शरीरसंनिकृष्टसंयोगहेतुराकुञ्चनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000249", "originalText": "विप्रकृष्टसंयोगहेतुः प्रसारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000250", "originalText": "अन्यत्सर्वं गमनम्। पृथिव्यादिचतुष्टयमनोमात्रवृत्ति॥ ६५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000251", "originalText": "नित्यमेकमनेकानुगतं सामान्यं\nद्रव्यगुणकर्मवृत्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000252", "originalText": "तद्द्विविधं परापरभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000253", "originalText": "परं सत्ता। अपरं द्रव्यत्वादिः॥ ६६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000254", "originalText": "नित्यद्रव्यवृत्तयो व्यावर्तका विशेषाः॥ ६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000255", "originalText": "नित्यसम्बन्धः समवायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000256", "originalText": "अयुतसिद्धवृत्तिः। ययोर्द्वयोर्मध्ये\nएकमविनश्यदपराऽश्रितमेवावतिष्ठते\nतावयुतसिद्धौ\nयथा अवयवाऽवयविनौ क्रियाक्रियावन्तौ जातिव्यक्ती\nविशेषनित्यद्रव्ये चेति॥ ६८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000256.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000257", "originalText": "अनादिः सान्तः प्रागभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000257.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000258", "originalText": "उत्पत्तेः पूर्वं कार्यस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000258.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000259", "originalText": "सादिरनन्तः प्रध्वंसः।", "padacchedaText": "", "audioFile": "PB_hear2read_000259.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000260", "originalText": "उत्पत्यनन्तरं कार्यस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000260.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000261", "originalText": "त्रैकालिकसंसर्गावच्छिन्नप्रतियोगिताकोऽत्यन्ताभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000261.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000262", "originalText": "यथा भूतले घटो नास्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000262.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000263", "originalText": "तादात्म्यसम्बन्धावच्छिन्नप्रतियोगिताकोऽन्योन्याभावः। यथा घटः पटो नेति॥ ६९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000263.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000264", "originalText": "सर्वेषां पदार्थानां यथायथमुक्तेष्वन्तर्भावात्सप्तैव\nपदार्था इति सिद्धम्॥ ७०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000264.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000265", "originalText": "कणादन्यायमतयोर्बालव्युत्पत्तिसिद्धये। अन्नंभट्टेन विदुषा रचितस्तर्कसंग्रहः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000265.mp3", "zipFile": "TarkaSangraha.zip"}, {"id": "B_000266", "originalText": "इति श्रीमहामहोपाध्याय\nअन्नम्भट्टविरचिततर्कसंग्रहः समाप्तः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000266.mp3", "zipFile": "TarkaSangraha.zip"}];
        const contentDiv = document.getElementById('content');
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentSource = null;
        let isPlaying = false;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            if (currentSource) {
                currentSource.playbackRate.value = this.value;
            }
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = async () => {
            if (isPlaying) {
                if (currentSource) {
                    currentSource.onended = null;
                    currentSource.stop();
                    currentSource = null;
                }
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                if (currentIndex >= 0) {
                    playAudio(currentIndex);
                } else {
                    playAudio(0);
                }
                playPauseBtn.innerText = "Stop";
            }
        };
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- Web Audio API Prefetching Logic ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> AudioBuffer

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchAndDecode(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const audioBuffer = await fetchAndDecode(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, audioBuffer);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old buffers to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentSource) {
                currentSource.onended = null;
                currentSource.stop();
                currentSource = null;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Resume AudioContext if it was suspended (browser autoplay policy)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            
            try {
                let audioBuffer;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioBuffer = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioBuffer = await fetchAndDecode(sourceUrl);
                }
                
                currentSource = audioCtx.createBufferSource();
                currentSource.buffer = audioBuffer;
                currentSource.playbackRate.value = document.getElementById('speed-slider').value;
                currentSource.connect(audioCtx.destination);
                
                currentSource.onended = () => { playAudio(currentIndex + 1); };
                currentSource.start(0);
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
