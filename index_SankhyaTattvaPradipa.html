        const manifest = [{"id": "B_000000", "originalText": "साङ्ख्यतत्त्वप्रदीपः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3"}, {"id": "B_000001", "originalText": "श्रीगणेशाय नमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3"}, {"id": "B_000002", "originalText": "प्रकृतिं पुरुषं शुद्धं प्रणिपत्य प्रणीयते। प्रदीपः सांख्यतत्त्वस्य परोपकृतये मया॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3"}, {"id": "B_000003", "originalText": "इह खलु प्रवाहविध्वस्तोत्तरणोपाया इव\nसांख्यतन्त्राध्ययनपरिश्रमालसास्तत्प्रक्रियाज्ञानतरीविहीनाः\nशब्दोदधावनन्यावलम्बनाः सीदन्ति तत्तरणोपायः\nसकलसांख्यप्रक्रियाद्योतको बह्वर्थोऽल्पाक्षरो मया प्रकाश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3"}, {"id": "B_000004", "originalText": "कापिलतन्त्राध्ययनालसैस्तत्प्रक्रियाजिज्ञासायामिदमेव प्रकरणं\nसम्यगवलोकनीयमत्युग्रशुभाशुभादृष्टफलवत् प्रयत्नं विनैव\nसर्वमत्रैवाधिगन्तव्यम् अयत्नलब्धेर्थे यत्नादर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3"}, {"id": "B_000005", "originalText": "उक्तं च\nसांख्याचार्यैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3"}, {"id": "B_000006", "originalText": "अक्के चेन्मधु विन्देत किमर्थं पर्वतं व्रजेत्। इष्टस्यार्थस्य संसिद्धौ को विद्वान् यत्नमाचरेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3"}, {"id": "B_000007", "originalText": "ऋजुमार्गेण सिद्ध्यतोऽर्थस्य वक्रेण साधनायोगात् इति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3"}, {"id": "B_000008", "originalText": "दुःखत्रयाभिघातोद्विग्नचित्तास्तान्निवृत्त्युपायमेव\nतावदभिकामयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3"}, {"id": "B_000009", "originalText": "तं चाग्रे दर्शयिष्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3"}, {"id": "B_000010", "originalText": "दुःखत्रयं च\nआध्यात्मिकमाधिभौतिकमाधिदैविकं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3"}, {"id": "B_000011", "originalText": "तत्राध्यात्मिकं द्विधा\nशारीरं मानसं च वातपित्तश्लेष्मणां वैषम्यनिमित्तं शारीरम्\nकामक्रोधलोभमोहेर्ष्याविषादविषयविशेषादर्शनकारणकं\nमानसम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3"}, {"id": "B_000012", "originalText": "आन्तरोपायसाध्यत्वादाध्यात्मिकं दुःखमिति व्यपदिश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3"}, {"id": "B_000013", "originalText": "ब्राह्मोपायसाध्यमपि दुःखं द्विविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3"}, {"id": "B_000014", "originalText": "आधिभौतिकमाधिदैवैकं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3"}, {"id": "B_000015", "originalText": "तत्राधिभौतिकं मानुषपक्षिसरीसृपस्थावरनिबन्धनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3"}, {"id": "B_000016", "originalText": "आधिदैविकं\nपक्षराक्षविनायकग्रहाद्यावेशनिमित्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3"}, {"id": "B_000017", "originalText": "सर्वं मानसप्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3"}, {"id": "B_000018", "originalText": "एतद् दुःखं रजःपरिणामविशेषो नित्यपरिणामित्वादिदमपि नित्यमिति\nन शक्यते बाधितुम् तथापि शक्य एव तदभिभवः कर्तुं साधनेन\nतच्च साधनं शास्त्रजनितं प्रकृतिपुरुषान्यताज्ञानं नान्यदिति\nतच्छास्त्रप्रतिपाद्यार्थश्चतुर्विधः तद्यथा कश्चिदर्थः\nप्रकृतिरेव न तु कस्यचित् विकृतिर्यथा मूलप्रकृतिः\nसा सर्वस्य मूलमादिकारणं न तु तस्याः कारणान्तरं किञ्चित्\nप्रमाणसिद्धं तथात्वे वा मूलक्षतिकारीत्यनवस्था स्यात् स्वस्यैव\nस्वकारणत्वे तु तस्यापेक्षया कारणत्वात् स्वस्यैव पूर्ववर्तित्वं\nकार्यत्वात् पश्चाद्वर्तित्वमित्यसंभवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3"}, {"id": "B_000019", "originalText": "सकारणत्वे अजामेकां\nलोहितशुक्लकृष्णामित्यजत्वप्रतिपादनपरश्रुतिविरोधः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3"}, {"id": "B_000020", "originalText": "सा च\nप्रकरोतीति प्रकृतिः प्रधानं सत्त्वरजस्तमसां साम्यावस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3"}, {"id": "B_000021", "originalText": "कश्चिदर्थः प्रकृतिर्विकृतिश्च तच्च महत्तत्त्वमहङ्कारः\nपञ्चतन्मात्राणि चेति सप्तसङ्ख्याको गणः कस्यचित्प्रकृतिः\nकस्यचिद्विकृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3"}, {"id": "B_000022", "originalText": "तद्यथा महत्तत्त्वमहङ्कारस्य प्रकृतिर्विकृतिश्च\nमूलप्रकृतेः तथा अहङ्कारः पञ्चतन्मात्राणामिन्द्रियाणां च\nप्रकृतिर्विकृतिर्महतः तथा पञ्चतन्मात्राणि भूतानामाकाशादीनां\nप्रकृतयो विकृतयश्चाहङ्कारस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3"}, {"id": "B_000023", "originalText": "पञ्च महाभूतान्येकादशेन्द्रियाणि\nचेति षोडशसङ्ख्याको गणो विकृतिरेव न तु कस्यचित्प्रकृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3"}, {"id": "B_000024", "originalText": "ननु पृथिव्यादीनामपि गोघटवृक्षादयो विकारा उपलभ्यन्ते तथा\nतद्विकारविशेषाणां पयोबीजादीनां दध्यङ्कुरादय इति कथं विकृतित्वमेव\nतेषामिति चेन्न तत्त्वान्तरोपादानत्वं प्रकृतित्वमिहाभ्युपगतम् न त्वेतेषां\nतदस्ति स्थौल्येन्द्रियग्राह्यतया गोघटादीनां समानत्वात् न तत्त्वान्तरता\nपृथिव्यादिभ्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3"}, {"id": "B_000025", "originalText": "उक्तं च तत्त्वकौमुद्याम् ᳚सर्वेषां गोघटादीनां\nस्थूलतेन्द्रियग्राह्यता च समेति᳚ न तत्त्वान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3"}, {"id": "B_000026", "originalText": "पुरुषस्तु न कस्यचित्\nप्रकृतिरपरिणामित्वान्नापि विकृतिर्नित्यत्वादन्यथा साधनसाध्याभिव्यक्तिः\nस्यात् घटवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3"}, {"id": "B_000027", "originalText": "प्रमाणविरहिणोऽर्थस्य नृश‍ृङ्गसादृश्याभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3"}, {"id": "B_000028", "originalText": "उक्तप्रमेयसाधकं त्रिविधं प्रमाणमुररीकत्यम्\nप्रत्यक्षमनुमानमाप्तवचनं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3"}, {"id": "B_000029", "originalText": "साङ्ख्याचार्यैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3"}, {"id": "B_000030", "originalText": "अन्यवाद्यङ्गीकृतप्रमाणानामेतेष्वेव त्रिष्वन्तर्भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3"}, {"id": "B_000031", "originalText": "उक्तं\nच 'सर्वप्रमाणसिद्धत्वादिति' सर्वेषां वाद्यन्तराभ्युपगतानां\nप्रमाणानां सिद्धत्वात् त्रिष्वेवान्तर्भावादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3"}, {"id": "B_000032", "originalText": "ननु यत्र\nयत्र प्रत्यक्षमप्रवर्तमानं तत्तदत्यन्ताऽसदिति व्याप्तिः\nसुप्रसिद्धा शशश‍ृङ्गकूर्मलोमादौ एवं प्रधानस्यापि\nप्रत्यक्षासिद्धत्वात् तदत्यन्तासत्त्वमेव युक्तं गगनकुसुमादीनामिवेति\nचेन्न नहि यत् प्रत्यक्षागोचरं तदत्यन्तासदिति व्याप्तिग्रहो\nयुक्तोऽन्यथा गृहान्निर्गतस्य गृहधनपुत्रपशुवनितादीन्\nसुखसाधनभूतानपश्यतस्तन्नाशनिश्चयजदुःखविप्लुष्टान्तःकरणस्य\nरुदतो मरणं स्यात् न त्वेवमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3"}, {"id": "B_000033", "originalText": "किञ्च किं सर्वप्रत्यक्षविषयत्वं\nसत्त्वे हेतुः किञ्चित्प्रत्यक्षविषयत्वं वा? नाद्यः\nनहि गृहान्तरदेशान्तरकालान्तरगतं वस्तु केनाप्ययोगिना\nप्रत्यक्षेण विषयीकर्तुं शक्यमन्यथा सर्व एव सर्वज्ञः स्यात्\nपरबुद्धेरप्रत्यक्षतया सर्वैः सर्वं प्रत्यक्षेण गृह्यते\nनवेत्यसर्वज्ञेन निश्चेतुमशक्यतया संशयानिवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3"}, {"id": "B_000034", "originalText": "नापि चरमः व्यभिचारात् नहि नगरस्थेन स्वेनानुपलब्धो गवय\nएतावतैवारण्यकोपलब्धस्य तस्यापलापसम्भवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3"}, {"id": "B_000035", "originalText": "उक्तञ्च लीलावतीकारेण\n᳚सर्वादृष्टेश्च सन्देहात् स्वादृष्टेर्व्यभिचारत᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3"}, {"id": "B_000036", "originalText": "तस्मात्\nप्रत्यक्षप्रवृत्तिप्रतिकूलाभावविशिष्टं प्रत्यक्षं यत्र न प्रवर्तते\nतदत्यन्तासदिति निश्चेतुं शक्यम् न तु प्रत्यक्षाप्रवृत्तिमात्रात् अन्यथा\nपुरुषप्रधानमहत्स्वर्गापूर्वदेवतादीनामतीन्द्रियाणामत्यन्ताभावः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3"}, {"id": "B_000037", "originalText": "तेन वियति गच्छतः पतत्रिणो ग्रहणेऽतिदूरत्वमेव प्रतिकूलम्\nतथा नेत्रगतकज्जलग्रहणेऽतिसामीप्यम् एवं रूपशब्दादिग्रहणे\nआन्ध्यबधिरत्वादयः तथा विषयग्रहणे मनसः कामाद्यभिव्याप्तिः यथा\nकामाद्यभिव्याप्तमनाः स्फीतालोकमध्यवर्तिनमिन्द्रियसन्निकृष्टमप्यर्थं न\nपश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3"}, {"id": "B_000038", "originalText": "परमाण्वादिविषयतायां सौक्ष्म्यमेव प्रतिकूलम् यतः प्रणिहितमना\nअपि तं न पश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3"}, {"id": "B_000039", "originalText": "भित्त्यादिपरवस्तुग्रहणे तद्व्यवधानमेव प्रतिकूलं\nसम्प्रतिपन्नपदार्थग्रहणे हस्तादिव्यवधानवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3"}, {"id": "B_000040", "originalText": "क्वचिदभिभवः\nयथा अहनि सौरीभिर्भाभिरभिभूतं नक्षत्रसूर्यादिग्रहे\nचक्षुः समर्थं न भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3"}, {"id": "B_000041", "originalText": "क्वचित् समानाभिहारः प्रतिकूलं यथा\nजलाशयेऽम्बुदविमुक्तजलबिन्दुग्रहणे नेत्रासामर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3"}, {"id": "B_000042", "originalText": "क्वचिदनुद्भवः\nयथा क्षीरदध्याद्यवस्थायां दधिघृतादिविवेचनासामर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3"}, {"id": "B_000043", "originalText": "एवं सति\nदृढतरप्रमाणान्तरप्रसिद्धे वस्तुनि प्रत्यक्षाप्रवृत्तावेतदन्यतमं\nप्रतिबन्धकं कल्प्यते न तु तदभावादेवाप्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3"}, {"id": "B_000044", "originalText": "उक्तञ्च\nसाङ्ख्यमूलकारेण ᳚सौक्ष्म्यात् तदनुपलब्धिर्नाभावात्᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3"}, {"id": "B_000045", "originalText": "ननु\nक्वचित्प्रत्यक्षप्रसिद्धस्य क्वचित्सन्देहादनुमानविषयता न\nत्वस्य तदस्तीत्यभाव एव युक्त इति चेन्न कार्यं हि कारणानुमापकं\nभवतीति सर्ववाद्यभिमतम् तथा च महदादिकार्यान्यथानुपपत्त्यैव\nप्रधानसिद्धिरिति न तदभावो युक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3"}, {"id": "B_000046", "originalText": "ननु कार्यान्यथानुपपत्त्या\nकारणसिद्धौ तन्त्रान्तराभिमतकारणसिद्धिः सेत्स्यति न तु\nत्वदभिमतप्रधानसिद्धिरिति चेन्न मतपर्यालोचनेन यन्मतं\nकपिलसूत्रनिबद्धं प्रधानसाधनानुगुणं तदेव युक्तिसहमन्यत् तु\nबाह्यमतवत् मताभासत्वाद्बाध्यमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3"}, {"id": "B_000047", "originalText": "तद्यथा 'असतः सज्जायत' इति\nबौद्धमते प्रधानसिद्धिः 'सतः सज्जायत' इति साङ्ख्यमतविरुद्धत्वान्न\nपण्डितमुखमण्डनायालम् सदसतोः कार्यकारणभावासम्भवात् असदलीकं\nकारणं सत्त्वादिरूपशब्दाद्यात्मकं कथं स्यात् सदसतोस्तादात्म्यदर्शनात्\nकार्यं हि कारणसमवेतं तन्तुपटादिस्थलेषु प्रसिद्धम् तथा च घटोऽसन्\nपटोऽसन्नित्यसत्समवेतं सर्वो व्यवहर्ता व्यवहरेत न तु सदिदमिति\nसत्तावैशिष्ट्येन प्रतीतिः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3"}, {"id": "B_000048", "originalText": "अथ सद्विवर्तोऽयं प्रपञ्च इति यद्वेदान्तिमतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3"}, {"id": "B_000049", "originalText": "तदप्यसाधु अनेनापि\nसतः सज्जायत इति मतसिद्धिर्न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3"}, {"id": "B_000050", "originalText": "अद्वयस्य सद्वयतया भाने रज्जोः\nस्रक्खण्डसर्प्पाद्यात्मना भानवत् भ्रान्तिरेव स्यात् बाधितविषयतया\nरज्जुसर्पप्रत्ययवत् प्रपञ्चज्ञानस्याप्रमाणतया प्रमारूपं\nज्ञानमेवास्तमियात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3"}, {"id": "B_000051", "originalText": "न चेष्टापत्तिर्गुरुशिष्योत्तरप्रश्नयोरप्रमाणबुद्ध्या\nव्यवहारमात्रोच्छेदः स्यात् लौकिकवैदिकव्यवहारानुष्ठाने च कस्यचित्\nप्रवृत्त्यनुपपत्त्या भोगापवर्गौ न स्यातामिति तच्छास्त्राप्रामाण्यं स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3"}, {"id": "B_000052", "originalText": "अपसिद्धान्तश्च न हि वेदान्तिमते ब्रह्म विवर्ति भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3"}, {"id": "B_000053", "originalText": "उक्तञ्च—\nबालान् प्रति विवर्तोऽयं ब्रह्मणः सकलं जगत्। अविवर्तितमानन्दमास्थिताः कृतिनः सदा॥", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3"}, {"id": "B_000054", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3"}, {"id": "B_000055", "originalText": "सतोऽसज्जायत इति सतः परमाणोरसद्द्व्यणुकाख्यं कार्यं\nजायत इति कणभक्षाक्षचरणमतमपि न युक्तिसहम्\nतथा हि परमाणुर्हि द्व्यणुकसमवायिकारणम् द्व्यणुकं\nचासदित्यसत्त्वाविशेषाच्छशश‍ृङ्गादिसमवायिकारणतापि परमाणौ\nस्यात् सदसतोः समवायासम्भवाच्च असता तादात्म्ये सतोप्यसत्त्वं\nस्यात् नन्वसत्त्वं नाम प्रागभावप्रतियोगित्वं न तु वायुरूपादिवत्\nत्रिकालासत्त्वमिति चेन्न किमिदं प्रागभावप्रतियोगित्वमसत्त्वम् किं\nप्रागभावप्रतियोगित्वादसत्त्वमसत्त्वाद्वा प्रागभावप्रतियोगित्वम्? नाद्यः\nसर्वेषां कार्यपदार्थानामसत्त्वाविशेषेणाकाशपुष्पादिष्विवासत्त्वेनैव\nव्यवहारः स्यात् तेषामपि प्रागभावप्रतियोगित्वात् तथा\nच कार्यपदार्थगतगुणसामान्यादीनामुच्छेदः स्यात् तेषां\nभावधर्मत्वेनासत्त्वेनावस्थानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3"}, {"id": "B_000056", "originalText": "न च कूर्मलोमादेरस्यासतो\nविशेषः सामान्याद्यभावेन भेदकधर्माभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3"}, {"id": "B_000057", "originalText": "नापि चरमः\nअसत्त्वात्प्रागभावप्रतियोगित्वे नरश‍ृङ्गादीनामपि प्रागभावप्रतियोगित्वं\nस्यात् प्रागभावस्य च स्वप्रतियोग्युत्पादकत्वनियमेन सर्वेषामसतां सत्त्वं\nस्यात् सदसद्विभागो जगति दत्तजलाञ्जलिः स्यादिति न तार्किकवैशेषिकमतं\nविचारसहम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3"}, {"id": "B_000058", "originalText": "तस्मात् सतः सज्जायत इति साङ्ख्यमतमेव युक्तिसहम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3"}, {"id": "B_000059", "originalText": "सतः\nकारणात् स्वोत्पत्तेः प्रागपि सदेव कार्यं कारणव्यापारादभिव्यक्तिमाप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3"}, {"id": "B_000060", "originalText": "न च सिद्धसाधनता कारणवैयर्थ्यं चेति वाच्यम् कार्यसत्त्वेऽपि\nतदभिव्यक्तौ कारणं प्रयोजनवदिति न किञ्चिदवद्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3"}, {"id": "B_000061", "originalText": "असत्कार्यपक्षे\nतु कारणवैयर्थ्यं स्फुटमेव न ह्यसतः कारणसम्बन्धो निरूपयितुं\nशक्यते सम्बद्धमेव असम्बद्धेन जन्यते असम्बद्धस्य जन्यत्वे सर्वस्मात्\nसर्वं स्यात् कारणनियमोऽस्तमियात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3"}, {"id": "B_000062", "originalText": "असच्चेत्कार्यं न कारणव्यापारात्\nसद्भवितुमर्हति उक्तञ्च तत्त्वकौमुद्याम्— नहि नीलं शिल्पसहस्रेणापि\nपीतं कर्तुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3"}, {"id": "B_000063", "originalText": "न च कारणव्यापारात् पूर्वं घटोऽसन् संश्च\nव्यापारानन्तरमिति घटस्य सत्त्वासत्त्वे धर्माविति वाच्यम् धर्मस्य\nभावधर्मत्वेन तेनैव धर्मिणः सत्त्वं स्वस्थित्यन्यथानुपपत्त्या\nसाधितमिति सदेव कार्यं कारणव्यापारादूर्ध्वमिव प्रागपि।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3"}, {"id": "B_000064", "originalText": "कारणव्यापारस्तु\nतदभिव्यक्तावनन्यथासिद्धः अन्यत्रापि कारणव्यापारादभिव्यक्तिरेव\nदृश्यते यथाऽवघातेन धान्येषु तण्डुलानाम् अवपीडनेन तिलेषु तैलस्य\nदोहनेन सौरभेयीणां पयस इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3"}, {"id": "B_000065", "originalText": "असदुत्पत्तौ तु न दृष्टान्तोऽस्ति तस्मात्\nसदेव कार्यं कारणव्यापारेणाभिव्यज्यते। असता कारणसम्बन्धासम्भवात्\nन तस्य तदुत्पादकत्वम् उक्तञ्च साङ्ख्याचार्यैः\nअसत्त्वान्नास्ति सम्बन्धः कारणैः सत्त्वसङ्गिभिः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3"}, {"id": "B_000066", "originalText": "असम्बद्धस्य चोत्पत्तिमिच्छतो न व्यवस्थितिः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3"}, {"id": "B_000067", "originalText": "किञ्च सम्बद्धमपि तदेव करोति यत्र यत् कारणं शक्तम्\nशक्तिश्च कार्यैकाधिगम्या यथा चक्षुषैव रूपज्ञानं भवति\nनेन्द्रियान्तरेणेतीदमेव तत्र शक्तमित्यधिगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3"}, {"id": "B_000068", "originalText": "तथा च सा शक्तिः\nशक्तकारणाश्रया शक्यकार्याश्रया सर्वत्र वा स्यात्? अन्त्ये सर्वस्मात् सर्वं\nस्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3"}, {"id": "B_000069", "originalText": "अथ कार्ये सा शक्तिस्तदा कथमसतः कार्यस्य शक्त्याश्रयता तथा\nच शक्तेन शक्यमुत्पाद्यते शक्यं च कारणात्मकम् कारणं च सदिति\nकथं तदभिन्नं कार्यमसत्स्यात् 'उक्तञ्च शक्तस्य शक्यकरणादिति'।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3"}, {"id": "B_000070", "originalText": "उपादानोपादेयभावग्रहणाच्च न भेदस्तन्तुपटयोर्ययोर्भेदो न\nतयोरुपादानोपादेयभावो यथाश्ववृक्षयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3"}, {"id": "B_000071", "originalText": "इतोऽपि नार्थान्तरत्वं\nतन्तुपटयोः संयोगाप्राप्त्यदर्शनात् अर्थान्तरत्वे संयोगो दृष्टो\nरज्जुघटकुण्डबदरादौ अप्राप्तिरपि दृष्टा सुमेरुविध्ययोरिव\nइह च संयोगाप्राप्त्योरभावान्न तन्तुभ्योऽर्थान्तरं पटः।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3"}, {"id": "B_000072", "originalText": "कार्यकारणयोरभेदसाधकं प्रमाणं चोक्तं साङ्ख्याचार्यैः तद्यथा न\nपटस्तन्तुभ्यो भिद्यते तद्धर्मत्वात् इह यद्यतो भिद्यते तत् तस्य धर्मो\nन भवति यथा गौरश्वस्य धर्मश्च पटस्तन्तूनान्तस्मान्नार्थान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3"}, {"id": "B_000073", "originalText": "गुरुत्वान्तराग्रहणादपि न कारणादर्थान्तरं कार्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3"}, {"id": "B_000074", "originalText": "एवमभेदे\nसिद्धे तन्तव एव तेन तेन संस्थानविशेषेण परिणताः पटो न तु\nपटस्तन्तुभ्योऽर्थान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3"}, {"id": "B_000075", "originalText": "न चात्माश्रयबुद्धिभेदादर्थक्रियाभेदाच्च\nभेदसिद्धिः कार्यकारणयोरिति वाच्यम् एकस्मिन्नपि\nविशेषान्तराविर्भावतिरोभावाभ्यामात्माश्रयार्थक्रियाबुद्धिभेदसम्भवान्न\nतदन्यथानुपपत्त्या भेदसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3"}, {"id": "B_000076", "originalText": "तत्र एकस्यापि कूर्मस्यावयवा\nनिःसरन्त्याविर्भवन्ति त एव कूर्मशरीरे निविशमानास्तिरोभवन्ति\nनहि ते कूर्मावयवा उत्पद्यन्ते ध्वंसन्ते वा एवमेकस्यापि सुवर्णस्य\nमृदो व कटककुण्डलादयो घटादयो निःसरन्त उत्पन्ना इति व्यवहारं\nभजन्ते त एव निविशमानास्तिरोभवन्ति नश्यन्तीत्युच्यन्ते न पुनः\nसदसतोर्निरोधोत्पादयोर्निदर्शनमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3"}, {"id": "B_000077", "originalText": "उक्तं च भगवता नासतो विद्यते\nभावो नाभावो विद्यते सत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3"}, {"id": "B_000078", "originalText": "यथा सङ्कोचविकाशवद्भ्यः स्वावयवेभ्यः\nकूर्मो न भिद्यते तथा मृत्सुवर्णादिभ्योऽपि कटककुण्डलादयो न भिन्नाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3"}, {"id": "B_000079", "originalText": "न च नाम बुद्ध्यर्थक्रियाभेदात् कार्यकारणयोर्भेदसिद्धिरिति वाच्यम्\nनटे व्यभिचारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3"}, {"id": "B_000080", "originalText": "नटो हि दशरथोऽहं रामोऽहं युधिष्ठिरोऽहमिति\nस्वयमनन्तनामा भूत्वा नामान्तरेण वेशान्तरमर्थक्रियान्तरञ्च कुरुते\nतथा च सत्यपि भेदत्रये नटभेदादर्शनात् यथाहुः—\nरूपमथो अपि कार्यमथो\nअभिधापि नटस्य पृथग्विदिता।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3"}, {"id": "B_000081", "originalText": "न पृथक्त्वमुपैति नटः किमिति\nप्रतिवाच्यमवश्यमिदं कुशलैः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3"}, {"id": "B_000082", "originalText": "एकस्यापि वह्नेर्दाहकत्वपाचकत्वभेदेन नानार्थक्रियाकारित्वं\nदृश्यते न ह्येतावता वह्निर्भेदमधिगच्छति एकैकस्य\nतृणस्यातपवृष्ट्यादिनिवृत्तावसामर्थ्येऽपि बहूनि\nमिलित्वावस्थाविशेषमवाप्य यथा तान्येव तन्निवृत्तौ\nसामर्थ्यमधिगच्छन्ति तथैक एव तन्तुः प्रावरणाद्यर्थक्रियासमर्थोऽपि\nमिलितास्त एवावस्थाविशेषं प्राप्याविर्भूतपटभावाः प्रावरणाद्यर्थक्रियां\nकरिष्यन्ति तस्मात्सदेव कार्यं कारणात् तदभिव्यक्तिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3"}, {"id": "B_000083", "originalText": "नन्वाविर्भावः\nकारणव्यापारात्पूर्वं सन्नसन् वा? आद्ये कारणव्यापारासम्बवः नहि सदुत्पत्तौ\nकेनापि कारणानि व्यापार्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3"}, {"id": "B_000084", "originalText": "अन्त्ये प्राप्तमसदुत्पादनत्वमिति चेन्न\nतवापि केयमुत्पत्तिः सत्यसती वा? आद्ये न कारणप्रयोजनं पश्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3"}, {"id": "B_000085", "originalText": "अन्त्येऽसदुत्पत्तिरुत्पद्यत इति तदुत्पत्तेरप्युत्पत्त्यन्तरं तत्राप्यन्यदिति\nस्फुटैवानवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3"}, {"id": "B_000086", "originalText": "अथ पटात् तदुत्पत्तिर्नातिरिच्यते तदा पट इत्युक्ते\nपुनरुत्पद्यते इति न वाच्यं पौनरुक्त्यात् तथोत्पद्यते इत्युक्त्वा पुनः पट\nइति न वाच्यं पूर्वोक्तदोषादेव पटो विनश्यतीत्यपि न वाच्यं विरोधात्\nतस्मात्स्वसत्तासमवायो वा स्वकारणसमवायो वा पटोत्पत्तिः समवायस्य\nच नित्यत्वेन सर्वथापि न पटोत्पत्तिः सम्भवति न तदर्थञ्च\nकारणानि व्यापार्य्यन्ते तथा च सत एव पटादेराविर्भावे कारणापेक्षेति न\nकिञ्चिदवद्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3"}, {"id": "B_000087", "originalText": "न च पटादिकार्यरूपेण कारणसम्बन्धस्तस्याक्रियत्वात्\nक्रियासम्बधित्वात्कारकाणामन्यथा कारकत्वक्षतिः स्यात् तस्मात्सत्कार्यमिति\nस्थितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3"}, {"id": "B_000088", "originalText": "दुःखत्रयाभिभवसाधनं प्रकृतिपुरुषान्यताज्ञानं तदुपयोगित्वात्\nव्यक्तवैरूप्यं प्रतिपादनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3"}, {"id": "B_000089", "originalText": "तच्च व्यक्तं पृथिव्यादि\nतच्चाव्यक्तात्प्रधानाद्विलक्षणम् यत इदं सकारणकं तत एवानित्यं\nपराभिमतविनाशसामग्र्या तिरोभवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3"}, {"id": "B_000090", "originalText": "अव्यापकं च कारणं हि कार्यं\nव्याप्नोति न तु कार्यं कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3"}, {"id": "B_000091", "originalText": "सक्रियं च बुद्ध्यादयः पूर्वपूर्वोपात्तं\nदेहं परित्यजन्ति देहान्तरं चोपाददते सैव तेषां क्रिया पृथिव्यादीनां\nक्रिया परिणामरूपेण प्रसिद्धैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3"}, {"id": "B_000092", "originalText": "प्रतिपुरुषं बुद्ध्यादिभेदादनेकम्\nतथा घटशरीरादिभेदेन पृथिव्याद्यप्यनेकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3"}, {"id": "B_000093", "originalText": "स्वकारणाश्रितम्\nयद्यपि बुद्ध्यादीनां प्रधानभेदाभावात् नाश्रयाश्रयिभावस्तथापि\nकथञ्चित् भेदविवक्षयाश्रयाश्रयिभावो यथेह वने तिलकाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3"}, {"id": "B_000094", "originalText": "सावयवमवयवावयविसंयोगसंयोगिबुद्धिप्रधानयोस्तु न संयोगस्तादात्म्यात्\nनापि सत्त्वरजस्तमसां संयोगः अप्राप्तिपूर्विका प्राप्तिः संयोगस्तदभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3"}, {"id": "B_000095", "originalText": "नित्यमेव परतन्त्रं स्वकार्येऽहङ्काराख्ये जनयितव्ये प्रकृत्या\nपूरमपेक्षते अन्यथा क्षीणा सती नाहङ्कारं जनयितुं क्षमा भवति\nतथाहङ्कारोऽपि स्वकार्ये प्रकृत्या पूरमपेक्षते एवं कारणमात्रं\nस्वकार्ये जनयितव्ये तदपेक्षां कुरुते तथा च स्वकार्ये जनयितव्ये\nपरतन्त्रं व्यक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3"}, {"id": "B_000096", "originalText": "यत इत्यभिव्याप्य यदुक्तं तद्विपरीतमव्यक्तम्\nयद्यप्यव्यक्तस्य परिणामलक्षणाक्रियास्ति तथापि न परिस्पन्दः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3"}, {"id": "B_000097", "originalText": "इदानीं व्यक्ताव्यक्तयोः साधर्म्यं पुरुषाच्च वैधर्म्यं प्रतिपादनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3"}, {"id": "B_000098", "originalText": "व्यक्तं हि त्रिगुणं त्रयो गुणाः सुखदुःखमोहात्मका अस्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3"}, {"id": "B_000099", "originalText": "अत्र\nकार्यकारणयोरभेदात् सुखादिशब्दैः सत्त्वादयोऽभिधीयन्ते त्रिगुणमित्युक्त्या\nसत्त्वादीनामात्मगुणत्वं पराभिमतमपाकृतं वेदितव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3"}, {"id": "B_000100", "originalText": "तथा अविवेकि यथा\nप्रधानं सतो न विविच्यते तथा महदादयोऽपि प्रधानान्न विविच्यन्ते\nतत्स्वरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3"}, {"id": "B_000101", "originalText": "यद्वा संभूयकारिताऽविवेकः नह्येकं किञ्चित्कार्यं\nजनयितुं क्षमं भवत्यपि तु संभूय सर्वः सर्वं करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3"}, {"id": "B_000102", "originalText": "एवमचेतनं\nप्रधानबुद्ध्यादयः सर्वे अचेतना तथा प्रसवरूपधर्मवन्तः। एते\nव्यक्तधर्माः कथितास्त एवाव्यक्तस्यापीत्यवगन्तव्यमिदमेव व्यक्ताव्यक्तयोः\nसाधर्म्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3"}, {"id": "B_000103", "originalText": "एते साधर्म्यवैधर्म्याभ्यां व्यक्ताव्यक्ते निरूपिते\nतदुभयगतधर्मरहितत्वात् विपरीतः पुरुष इति\nपुरुषस्य व्यक्ताव्यक्तवैधर्म्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3"}, {"id": "B_000104", "originalText": "नन्वहेतुमत्त्वनित्यत्वादि\nप्रधानसाधर्म्यं पुरुषस्य प्रतीयते तथा चानेकत्वं\nव्यक्तसाधर्म्यमेवं सति कथं व्यक्ताव्यक्तविपरीतः पुरुष इति चेन्न\nअहेतुमत्त्वादिसाधर्म्येऽप्यत्रैगुण्याद्यस्यास्त्येव वैधर्म्यमिति न दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3"}, {"id": "B_000105", "originalText": "न च त्रैगुण्यमप्रसिद्धम् प्रीत्यप्रीतिविषादात्मका गुणा इति सांख्याचार्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3"}, {"id": "B_000106", "originalText": "अत्र क्रमेण प्रीतिः सुखं तदेव सत्त्वम् तथा अप्रीतिर्दुःखमप्रीत्यात्मको रजो\nगुणः एवं विषादो मोहो विषादात्मकस्तमोगुणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3"}, {"id": "B_000107", "originalText": "यन्मते प्रीतिर्दुःखाभावः\nतथा दुःखमपि प्रीत्यभावस्तन्निवृत्त्यर्थं मूलकारेणात्मग्रहणं\nकृतमात्मशब्दस्य भावतत्त्वेन नेतरेतराश्रयस्तथासत्येकस्यापि सिद्धिर्न\nस्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3"}, {"id": "B_000108", "originalText": "प्रकाशप्रवृत्तिनियमनमेषां क्रमेण प्रयोजनमप्यवगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3"}, {"id": "B_000109", "originalText": "क्रियात्मकेन रजस लघु सत्त्वं सर्वत्र नीतं स्यादतिवायुना\nतूलावयववद्यदि गुरुणा तमसा नियमनं न स्यात्तमोनियतं तु क्वचिदेव\nप्रवर्तयति ततस्तमो नियमार्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3"}, {"id": "B_000110", "originalText": "अन्योन्याभिभववृत्तयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3"}, {"id": "B_000111", "originalText": "एतेषामन्यतमेनार्थवशादुद्भूतेनान्यतममभिभूयते तद्यथा सत्त्वं\nरजस्तमसी अभिभूयात्मनः शान्तां वृत्तिमधिगच्छति तथा रजः\nसत्त्वतमसी अभिभूय घोरां वृत्तिमेति एवं तमः सत्त्वरजसी\nअभिभूय मूढामिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3"}, {"id": "B_000112", "originalText": "तथाऽन्योन्याश्रयवृत्तयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3"}, {"id": "B_000113", "originalText": "यथाहुः\nसत्त्वं प्रवृत्तिनियमावाश्रित्य रजस्तमसोः प्रकाशेनोपकरोति रजः\nप्रकाशनियमावाश्रित्य प्रवृत्येतरयोः तमः प्रकाशप्रवृत्ती आश्रित्य\nनियमेनेतरयोरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3"}, {"id": "B_000114", "originalText": "तथा अन्योन्यजननवृत्तयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3"}, {"id": "B_000115", "originalText": "अन्यतमोऽन्यतमं\nजनयति जननमत्र परिमाणः स च गुणानां सदृशरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3"}, {"id": "B_000116", "originalText": "अत एव\nन हेतुमत्त्वं तत्त्वान्तरस्य हेतोरभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3"}, {"id": "B_000117", "originalText": "नाप्यनित्यत्वं तत्त्वान्तरे\nलयाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3"}, {"id": "B_000118", "originalText": "अन्योन्यसंज्ञाव्यभिचारिणश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3"}, {"id": "B_000119", "originalText": "उक्तञ्च\nअन्योन्यमिथुनाः सर्वे सर्वे सर्वत्रगामिनः। रजसो मिथुनं सत्त्वं सत्त्वस्य मिथुनं रजः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3"}, {"id": "B_000120", "originalText": "तमसश्चापि मिथुने ते सत्त्वरजसी उभे। मिथुनवृत्तित्वं सहचाराव्यभिचारित्वम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3"}, {"id": "B_000121", "originalText": "उभयोः सत्त्वरजसोर्मिथुनं तम उच्यते। नैषामादिः सम्प्रयोगो वियोगो वोपलभ्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3"}, {"id": "B_000122", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3"}, {"id": "B_000123", "originalText": "नियतकृत्यं तु तेषामिदं लघुत्वं प्रकाशकत्वं च सत्त्वस्यैव न तु\nतयोः कस्यचित् तत्रोर्ध्वगमनहेतुभूतो धर्मो लाघवं गौरवासहवर्ति\nयतोऽग्नेरूर्ध्वज्वाला गतिर्भवति तदेव कस्यचित्तिर्यग्गमने हेतुर्यथा\nवायोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3"}, {"id": "B_000124", "originalText": "एवं करणानां वृत्तिकुशलताहेतुर्लाघवं गुरुत्वे तु तानि\nमन्दानि स्युरिति सत्त्वस्य प्रकाशात्मकत्वमुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3"}, {"id": "B_000125", "originalText": "सत्त्वतमसी अक्रियतया\nस्वकार्योत्पादनेऽवसीदन्ती रजसोपष्टेभ्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3"}, {"id": "B_000126", "originalText": "अवसादाद्विमुच्योत्साहे\nप्रयत्नवती क्रियेते।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3"}, {"id": "B_000127", "originalText": "उक्तं च\nसत्त्वं लघु प्रकाशकमिष्टमुपष्टम्भकं चलं च रजः।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3"}, {"id": "B_000128", "originalText": "कुत उपष्टम्भकं यतश्चलमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3"}, {"id": "B_000129", "originalText": "रजश्चलतया सर्वतस्त्रैगुण्यं\nचालयेद्यदि गुरुणा आवृण्वता तमसा तत्र प्रतिबन्धो न स्यात् तमसा\nतु ततस्ततो व्यावृत्त्य क्वचिदेव प्रवर्त्यते इति नियामकं तमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3"}, {"id": "B_000130", "originalText": "यथाहुः गुरु वरणकमेव तम इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3"}, {"id": "B_000131", "originalText": "तथाच लघु प्रकाशकं सत्त्वमेव\nउपष्टम्भकं चलं च रज एव गुरु वरणकं तम एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3"}, {"id": "B_000132", "originalText": "ननु परस्परं\nविरोधशीलानां गुणानां सुन्दोपसुन्दन्यायेन परस्परं बाध एव युक्तो\nन त्वेककार्यकर्तृत्वमिति चेत् न एवंभूतानामप्येककार्यकर्तृतायाः\nप्रदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3"}, {"id": "B_000133", "originalText": "तद्यथा वर्त्तितैले अनलविरोधिनी अथानलेन मिलित्वा\nरूपप्रकाशलक्षणं कार्यं कुरुतः यथाच वातपित्तश्लेष्माणः\nपरस्परं विरोधशीला अपि मिलिताः सन्तः शरीरधारणकार्य्यकारिणः\nतथा सत्त्वरजस्तमांसि विरुद्धशीलान्यपि सह वर्त्स्यन्ति मिलित्वा चैकं\nकार्य्यं करिष्यन्ति च पुरुषार्थवशात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3"}, {"id": "B_000134", "originalText": "उक्तञ्च प्रदीपवच्चार्थतो\nवृत्तिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3"}, {"id": "B_000135", "originalText": "गुणानां प्रधानात्मकत्वादैक्येऽप्यभिभाव्याभिभावकरूपेण\nनानात्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3"}, {"id": "B_000136", "originalText": "उक्तं एकैव स्त्री गुणकुलरूपशीलयौवनसम्पन्ना स्वामिनं\nसुखाकरोति तत् कस्य हेतोस्तं प्रति तस्याः सुखरूपसमुद्भवात् सैव\nसपत्नीर्दुःखाकरोति तत्कस्य हेतोस्तां प्रति तस्याः दुःखरूपसमुद्भवात्\nएवं पुरुषान्तरं तामविन्दमानं सैव मोहयति तत्कस्य हेतोस्तं प्रति\nतस्याः मोहरूपसमुद्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3"}, {"id": "B_000137", "originalText": "अनया स्त्रिया सर्वे भावा व्याख्याताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3"}, {"id": "B_000138", "originalText": "तत्र\nयत्सुखकारणं तत्सुखात्मकं सत्त्वम् एवं यत् दुःखकारणं तत् दुःखात्मकं\nरजः तथा यन्मोहहेतुस्तन्मोहात्मकं तमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3"}, {"id": "B_000139", "originalText": "तस्मात्कारणव्यापारात्सदेव\nकार्यं पूर्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3"}, {"id": "B_000140", "originalText": "तदेव पुनस्तद्व्यापारादाविर्भवति यथा सन्त्येव\nकूर्माङ्गानि निःसरन्ति विभज्यन्ते इदं कूर्मशरीरमेतानि तदङ्गानि\nतेन तानि सङ्कोचितानि तस्मिन्नव्यक्तीभवन्ति तथा मृत्सुवर्णादिभ्यः\nसन्त्येव घटकुण्डलादीन्याविर्भवन्ति विभज्यन्ते इयं मृदयं तत्कार्यो\nघट इत्यादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3"}, {"id": "B_000141", "originalText": "तथा सन्त्येव पृथिव्यादीनि कारणात्तन्मात्रादाविर्भवन्ति\nविभज्यन्ते इदमस्य कारणमिदमस्य कार्यमिति तथा सन्त्येव\nतन्मात्राण्यहङ्कारादाविर्भवन्ति विभज्यन्ते एवं सन्नेवाहङ्कारो\nमहतोऽभिव्यक्तिमेति सन्नेव च महान्मूलप्रकृतेरभिव्यक्तिं\nयाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3"}, {"id": "B_000142", "originalText": "एवं कारणभूतात्परमाव्यक्तात्साक्षात्पारम्पर्येण समन्वितस्य\nकार्यभूतस्य प्रपञ्चस्य विभागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3"}, {"id": "B_000143", "originalText": "सर्गमात्रं मृत्पिण्डं हेमपिण्डं\nवा विशन्तो घटकुण्डलादयोऽव्यक्तीभवन्ति कारणरूपेणाभिव्यक्ता अपि\nकार्यरूपेणानभिव्यक्तीभवन्ति तथा पृथिव्यादयस्तन्मात्राणि विशन्तः\nस्वस्वरूपेण तन्मात्राण्यभिव्यक्तयन्ति स्वस्वरूपेण कारणमभिव्यक्तमपि\nकार्यस्वरूपं स्वकीयं स्वस्मिन्ननभिव्यक्तयति तन्मात्राणि तथाहङ्कारं\nविशन्त्यहङ्कारं स्वापेक्षयाऽव्यक्तयन्ति तथाहङ्कारो महान्तं विशन्\nमहान्तमव्यक्तयति महान्प्रधानं स्वकारणं विशन् तदव्यक्तयति प्रधानस्य\nतु न क्वचित्प्रवेशोऽकारणत्वादपि तु तत्सर्वकार्याणामव्यक्तम् कारणम्\nएवमविभागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3"}, {"id": "B_000144", "originalText": "प्रकृतौ विश्वस्यैवं विभागाविभागौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3"}, {"id": "B_000145", "originalText": "केचन अव्यक्तं वा महान्तं वाहङ्कारं वा इन्द्रियाणि वा भूतानि\nवा आत्मत्वेनादाय तानेवोपासते ते तु वक्ष्यमाणरीत्याऽपाकरणीयाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3"}, {"id": "B_000146", "originalText": "अव्यक्तादेर्व्यतिरिक्तः पुरुषोऽस्ति अव्यक्तमहदहङ्कारादयः\nपरार्थाः कुतः सङ्घातत्वात् यः सङ्घातो भवति स परार्थो\nदृष्टस्तैलताम्बूलघृतदधिदुग्धान्नवस्त्रादिवत् सुखदुःखमोहात्मकत्वेन\nसर्वे सङ्घातास्तथाच यदर्थं सङ्घाताः स एव पुरुषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3"}, {"id": "B_000147", "originalText": "ननु\nशयनासनादिः सङ्घातः सङ्घातशरीरादिपरार्थो दृष्टो न त्वात्मानं\nप्रति परार्थः तस्मात्सङ्घातान्तरमेव साधयेयुर्नासंहतमात्मानमिति\nयदुक्तम् तन्न साधु सङ्घातस्य सङ्घातान्तरार्थत्वे तस्यापि\nसङ्घातत्वात्संघातान्तरार्थता तस्यापि सङ्घातत्वात्तथात्वं तस्यापि\nतथात्वमित्यनवस्था दुस्तरा स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3"}, {"id": "B_000148", "originalText": "किञ्च सङ्घातस्य पारार्थ्यमात्रेण\nव्याप्तिर्न तु सङ्घातपारार्थ्येन।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3"}, {"id": "B_000149", "originalText": "न च दृष्टान्तदृष्टत्वात्तथा\nकल्प्यत इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3"}, {"id": "B_000150", "originalText": "दृष्टान्तदृष्टयावद्धर्माणां दार्ष्टान्तिके\nसाधनायानुमानमिच्छतो दृष्टान्तमहानसादिगतमहानसत्वादेः\nपर्वतादावभावात्सर्वानुमानोच्छेदः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3"}, {"id": "B_000151", "originalText": "यथाहुः त्रिगुणत्वादयो हि\nधर्मा सङ्घातत्वेन व्याप्ताः ते तु अस्मिन्परे व्यावर्तमानास्त्रैगुण्यादि\nव्यावर्तयन्ति ब्राह्मण्यमिव निवर्तमानं कठत्वादिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3"}, {"id": "B_000152", "originalText": "अधिष्ठानादपि\nपुरुषास्तित्वं सिद्ध्यति त्रिगुणात्मकानां बुद्ध्यादीनामधिष्ठीयमानत्वात्\nयथा रथादिर्यन्त्रादिभिरधिष्ठीयते तथा सुखदुःखमोहात्मकं\nबुद्ध्यादि परेणाधिष्ठातव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3"}, {"id": "B_000153", "originalText": "भोक्तृभावादपि पुरुषास्तित्वमवसेयम्\nभोग्ये हि सुखदुःखे अनुकूलप्रतिकूलवेदनीये प्रत्यात्ममनुभूयेते\nतेनानयोरनुकूलतया प्रतिकूलतया वाऽनुभवित्रा केनचिद्भवितव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3"}, {"id": "B_000154", "originalText": "न च बुद्ध्यादिरेव तथेति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3"}, {"id": "B_000155", "originalText": "तेषां सुखाद्यात्मकत्वेन\nस्वेनैव स्ववेदने आत्माश्रयः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3"}, {"id": "B_000156", "originalText": "कैवल्यार्थं प्रवृत्तेरपि\nपुरुषास्तित्वं सिद्धम् दुःखत्रयात्यन्तिकनिवृत्तिलक्षणं कैवल्यं न\nतावद्बुद्ध्यादीनां ते हि सुखदुःखमोहात्मकाः कथं स्वभावाद्वियोजयितुं\nशक्याः तस्मात्कैवल्यार्थमागमानां महाधियां च प्रवृत्तेरस्ति\nबुद्ध्याद्व्यतिरिक्त आत्मेति पुरुषास्तित्वं सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3"}, {"id": "B_000157", "originalText": "ननु भवत्वेवं\nबुद्ध्याद्यतिरिक्तात्मसिद्धिस्तथापि स किं प्रतिशरीरं भिन्न एक एव वेति\nचेद्भिन्न एवेति ब्रूमः जन्ममरणादिव्यवस्थान्यथानुपपत्त्या बहुत्वस्यैव\nसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3"}, {"id": "B_000158", "originalText": "उक्तं च सांख्याचार्यैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3"}, {"id": "B_000159", "originalText": "जन्ममरणकरणानां प्रतिनियमादयुगपत्प्रवृत्तेश्च। पुरुषबहुत्वं सिद्धं त्रैगुण्यविपर्ययाच्चैव॥", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3"}, {"id": "B_000160", "originalText": "जातिविशिष्टाभिरपूर्वाभिर्देहेन्द्रियमनोऽहङ्कारबुद्धिवेदनाभिः\nपुरुषस्याभिसम्बन्धो जन्म न तु पुरुषस्य परिणामस्तस्यापरिणामित्वात्\nतेषामेव च देहादीनामुपात्तानां परित्यागो मरणं न त्वात्मनो\nविनाशस्तस्य कूटस्थस्य नित्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3"}, {"id": "B_000161", "originalText": "बुद्ध्यादीनि करणानि\nत्रयोदश तेषां जन्ममरणकरणानां प्रतिनियमो व्यवस्था सा त्वियं\nशर्वशरीरेष्वेकस्मिन्पुरुषे न सम्भवति तथा सत्येकस्मिन्सुखिनि\nसर्वे सुखिनः स्युः दुःखिनि वा दुःखिनो भवेयुः तथा एकस्मिन् म्रियमाणे\nसर्वे म्रियेरन् जायमाने च जायेरन् एवमेकस्मिन्नन्धबधिरादौ सर्व\nएव तथा स्युः न त्वेवमस्ति तथा एकस्मिन्विचित्ते सर्वे विचित्ताः\nस्युरित्यव्यवस्था पुरुषभेदे तु सम्यगुपपद्यते व्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3"}, {"id": "B_000162", "originalText": "नचैकस्मिन्नपि पुरुषे देहान्तरोपाधिवशात् उपपद्यत एव व्यवस्थेति\nवाच्यम् करचरणस्तनादिभेदेनापि जन्ममरणादिव्यवस्था स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3"}, {"id": "B_000163", "originalText": "गुणत्रयविपर्ययादपि पुरुषबहुत्वमवसेयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3"}, {"id": "B_000164", "originalText": "तद्यथा केचित्सत्त्वबहुलाः\nयथोर्द्ध्वस्रोतसः केचिद्रहोबहुलाः यथा मनुष्याः केचित्तमोबहुलाः\nयथा तिर्यग्योनयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3"}, {"id": "B_000165", "originalText": "पुरुषस्य बहुत्ववदत्रिगुणत्वं विवेकित्वमविषयत्वमसाधारणत्वं\nचेतनत्वमप्रसवधर्मित्वं साक्षित्वादिकमपि बोद्धव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3"}, {"id": "B_000166", "originalText": "प्रधानपुरुषयोः संयोगकृतोऽयं सर्गः स चापेक्षां विना\nभिन्नयोर्न सम्भवति अपेक्षा च स्वदर्शनार्थं पुरुषेण प्रधानस्य\nप्रधानं हि विषयात्मकतया भोग्यम् भोगश्च भोक्तारमन्तरेण\nन भवतीति भोक्त्रपेक्षा प्रधानस्य पुरुषस्य स्वकैवल्यार्थं\nप्रधानापेक्षा प्रधानेन हि भोग्येन सम्भिन्नः पुरुषस्तद्गतं\nदुःखत्रयं स्वात्मन्यभिमन्यमानः कैवल्यं प्रार्थयते तत्तु\nसत्त्वपुरुषान्यताख्यातिकारणकं सत्त्वपुरुषान्यताख्यातिश्च प्रधानमन्तरा\nन भवतीति पुरुषस्य प्रधानापेक्षया पङ्ग्वन्धवदुभयोः संयोगः\nभोगायानादिपरम्परासंयुक्तोऽपि कैवल्याय पुनः संयुज्यते स च संयोगो\nमहदादिसर्गमन्तरेण भोगापवर्गयोः समर्थो न भवतीति संयोग एव\nमहदादिसर्गं करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3"}, {"id": "B_000167", "originalText": "उक्तञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3"}, {"id": "B_000168", "originalText": "प्रकृतेर्महांस्ततोऽहङ्कारस्तस्माद्गणश्च षोडशकः। तस्मादपि षोडशकात्पञ्चभ्यः पञ्च भूतानि॥", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3"}, {"id": "B_000169", "originalText": "एकादशेन्द्रियाणि पञ्च तन्मात्राणि चेति षोडशसंख्यामितो गणः\nषोडशकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3"}, {"id": "B_000170", "originalText": "उक्तञ्च तत्र शब्दतन्मात्रादाकाशं शब्दगुणम्,\nशब्दतन्मात्रसहिताच्च स्पर्शतन्मात्राद्वायुः शब्दस्पर्शगुणः,\nशब्दस्पर्शतन्मात्रसहिताद्रूपतन्मात्रात्तेजः शब्दस्पर्शरूपगुणं,\nशब्दस्पर्शरूपतन्मात्रसहिताद्रसतन्मात्राच्छब्दस्पर्शरूपरसगुणं जलम्,\nशब्दस्पर्शरूपरसतन्मात्रासहिताद्गन्धतन्मात्राच्छब्दस्पर्शरूपरसगन्धगुणा\nपृथिवी जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3"}, {"id": "B_000171", "originalText": "अध्यवसायो बुद्धिः क्रियाक्रियावतोरभेदविवक्षया व्यपदेशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3"}, {"id": "B_000172", "originalText": "धर्मो ज्ञानं विराग ऐश्वर्यमिति सात्त्विकाः बुद्धिधर्माः\nएतद्विपरीतास्त्वधर्मादयस्तामसाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3"}, {"id": "B_000173", "originalText": "बुद्धिधर्मादैश्वर्यादणिमादिप्रादुर्भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3"}, {"id": "B_000174", "originalText": "तच्च\nअणिमा महिमा चैव गरिमा लघिमा तथा। प्राप्तिः प्राकाम्यमीशित्वं वशित्वं चाष्टसिद्धयः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3"}, {"id": "B_000175", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3"}, {"id": "B_000176", "originalText": "नन्वेकादशक इन्द्रियगणः पञ्चतन्मात्रकं चेति द्विविधः प्रवर्तते\nसर्गोऽहङ्कारात् तथा चैकस्मादहङ्कारात् कारणात्कथं प्रकाशजडात्मको\nविलक्षणः सर्ग इति यदुक्तं तन्न सुन्दरम् प्रकाशलाघवाभ्यामेकादशक\nइन्द्रियगणः सात्त्विकादहङ्काराद्भवति भूतादेस्त्वहङ्कारात्\nतामसात्तन्मात्रगणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3"}, {"id": "B_000177", "originalText": "यद्यप्येकोऽहङ्कारस्तथापि गुणोद्भवाभिभवाभ्यां\nभिन्नं कार्यं करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3"}, {"id": "B_000178", "originalText": "ननु यदि सत्त्वतमोभ्यामेव सर्गः कृतं तर्हि\nरजसा अकिञ्चिकरेणेति चेन्न तैजसादुभयमिति मूलकरः तैजसादुभयं\nगणद्वयं भवति सर्गद्वयं सत्त्वतमसोरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3"}, {"id": "B_000179", "originalText": "यद्यपि रजसो न\nकार्यान्तरमस्ति तथापि सत्त्वतमसी स्वयमक्रिये समर्थे अपि न कार्यं\nकुरुतो रजसा चालिते तु तत्प्रसादात् प्राप्तक्रिये स्वकार्योत्पादने समर्थे\nभवत इति राजसादुभयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3"}, {"id": "B_000180", "originalText": "यथाहुः उभयस्मिन्नपि कार्ये सत्त्वतमसोः\nक्रियोत्पादनद्वारेणास्ति रजसः कारणत्वमिति न व्यर्थं रज इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3"}, {"id": "B_000181", "originalText": "इन्द्रियविचारस्तु तत्त्वप्रदीपे कृत इति विस्तरभयान्नेह प्रतन्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3"}, {"id": "B_000182", "originalText": "महदहङ्कारमनांस्यन्तरिन्द्रियाणि तानि स्वलक्षणानि स्वमसाधारणं\nलक्षणं येषां तानि स्वलक्षणानि तच्च महतोऽध्यवसायः\nअहङ्कारस्याभिमानः सङ्कल्पो मनसो वृत्तिर्व्यापारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3"}, {"id": "B_000183", "originalText": "एतेषां\nवृत्तिद्वैविध्यं साधारणत्वासाधारणत्वाभ्यामाह सैषा भवत्यसामान्या\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3"}, {"id": "B_000184", "originalText": "एषोक्ताऽसाधारणी वृत्तिः साधारणी वृत्तिस्तु करणानां प्राणाद्या\nवायवः पञ्च करणत्रयस्य पञ्च वायवो वृत्तिर्जीवनं तद्भावे भावात्\nअभावे चाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3"}, {"id": "B_000185", "originalText": "तत्र प्राणो नासाग्रहृन्नाभिपादाङ्गुष्ठवृत्तिः\nअपानः कृकाटिकापृष्ठपार्श्वपायूपस्थवृत्तिः समानो\nहृन्नाभिसर्वसन्धिवृत्तिः उदानो हृत्कण्ठतालमूर्धभ्रूमध्यवृत्तिः\nव्यानस्त्वग्वृत्तिरिति पञ्च वायवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3"}, {"id": "B_000186", "originalText": "अविद्या पञ्चविधा तथाहि अविद्याऽस्मितारागद्वेषाभिनिवेशा यथासंख्यं\nतमोमोहमहामोहतामिस्रान्धतामिस्रसंज्ञका चेति पञ्चपर्वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3"}, {"id": "B_000187", "originalText": "प्रत्ययसर्गतद्भेदास्त्वतिविस्तरभयात्सन्तोऽपि न निदर्श्यन्ते प्रत्ययसर्गो\nबुद्धिसर्गः उक्तञ्च एष प्रत्ययसर्गो विपर्ययाशक्तितुष्टिसिद्ध्याख्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3"}, {"id": "B_000188", "originalText": "प्रतीयतेऽनेनेति प्रत्ययो बुद्धिस्तस्य सर्गः प्रत्ययसर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3"}, {"id": "B_000189", "originalText": "दैवसर्गस्तु मूलकारेणैव स्पष्टो निरुक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3"}, {"id": "B_000190", "originalText": "स च अष्टविकल्पो दैवः\nसर्गः ब्राह्मप्राजापत्यैन्द्रपैत्र्यगान्धर्वयाक्षराक्षसपैशाच\nइत्यष्टविकल्पो दैवसर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3"}, {"id": "B_000191", "originalText": "तिर्यग्योनयश्च पञ्चविधा\nभवन्ति पशुमृगपक्षिसरीसृपस्थावराः। मानुषश्चैकविधः\nब्राह्मणत्वाद्यवन्तरजातिभेदाविवक्षया संस्थानस्य चतुर्ष्वप्यविशेषादिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3"}, {"id": "B_000192", "originalText": "ननु प्राधानिकोऽयं सर्गः प्रधानं च जडं कथं स्वार्थं\nपरार्थं वा प्रवृत्तिं कर्तुमर्हति तस्मात्केनचिच्चेतनेन\nप्रकृत्यधिष्ठात्रा भवितव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3"}, {"id": "B_000193", "originalText": "न च क्षेत्रज्ञास्तथा तेषां\nप्रकृतिस्वरूपानभिज्ञत्वात् तस्मादस्ति प्रकृतेरधिष्ठाता\nकश्चित्सर्वज्ञः स एवेश्वर इति चेन्न अचेतनमपि प्रयोजनवशात्\nप्रवर्तमानं दृष्टं यथा वत्सविवृद्ध्यर्थमचेतनमपि क्षीरं\nप्रवर्तते तथा जडापि प्रकृतिः पुरुषविमोक्षाय प्रवर्तिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3"}, {"id": "B_000194", "originalText": "किञ्चाभोक्तुरीश्वरस्य प्रवृत्तौ न करुणां विनाऽन्यत् प्रयोजनं\nपश्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3"}, {"id": "B_000195", "originalText": "सा च निरुपाधिपरदुःखप्रहाणेच्छा सृष्टेः पूर्वं\nप्राण्यभावादेव तत्सम्बन्धिदुःखाभावात् कस्य निवृत्तौ प्रवृत्तिः\nस्यादीश्वरस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3"}, {"id": "B_000196", "originalText": "न च सर्गानन्तरमीश्वरप्रवृत्तिः सर्गस्य जातत्वादेव\nनेश्वरप्रयोजनं पश्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3"}, {"id": "B_000197", "originalText": "न च दुःखनिवृत्तिः प्रयोजनं तदर्थं\nतत्प्रवृत्तौ जगति कोऽपि दुःखी न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3"}, {"id": "B_000198", "originalText": "उक्तञ्च प्रेक्षावतः\nप्रवृत्तेः स्वार्थकारुण्याभ्यां व्याप्तत्वात् ते च जगत्सर्गाद्व्यावर्तमाने\nप्रेक्षावत्प्रवृत्तिपूर्वकत्वमपि निवर्तयतः न ह्याप्तसकलेप्सितस्य\nभगवतो जगत्सृजतः किमप्यभिलषितं भवति नापि कारुण्यादस्य सर्गे\nप्रवृत्तिः प्राक्सर्गाज्जीवानामिन्द्रियशरीरविषयानुत्पत्तौ दुःखाभावेन कस्य\nप्रहाणेच्छा कारुण्येन सृष्टिः सृष्ट्या च कारुण्यमिति परस्पराश्रयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3"}, {"id": "B_000199", "originalText": "अपि च करुणया प्रवृत्तः सुखिन एव जन्तून्सृजेत् न दरिद्रान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3"}, {"id": "B_000200", "originalText": "न च कर्मवैचित्र्यात् जगद्वैचित्र्यम् तर्हि कृतमीश्वरेण तत एव\nजगद्वैचित्र्योपपत्तेः प्रवृत्तिस्तु पारार्थ्यप्रयोजनवशात् जडस्यापि\nदृश्यते वत्सविवृद्धिनिमित्तं दुग्धस्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3"}, {"id": "B_000201", "originalText": "ननु भवतु प्रकृतेः प्रवर्तकः पुरुषार्थो निवर्तकं न तु कमपि\nपश्याम इति चेन्न यथा नर्तकी परिषद्भ्यो नृत्यं दर्शयित्वा स्वयमेव\nनिवर्तते न तु तस्याः स्वनिवृत्तौ निवर्तकान्तरापेक्षा तथा शब्दाद्यात्मकं\nस्वस्वरूपं पुरुषाद्भेदेन प्रकाश्य साधितपुरुषप्रयोजना स्वयमेव\nनिवर्तते प्रकृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3"}, {"id": "B_000202", "originalText": "यथाहुः सांख्याचार्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3"}, {"id": "B_000203", "originalText": "रङ्गस्य दर्शयित्वा निवर्तते यथा नर्तकी नृत्यात्। पुरुषस्य तथात्मानं प्रकाश्य विनिवर्तते प्रकृतिः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3"}, {"id": "B_000204", "originalText": "ननु यथा दर्शितनृत्या नर्तकी द्रष्टृकौतुहलात्पुनः प्रवर्तते\nतथा प्रकृतिरपि पुरुषायात्मानं दर्शयित्वा निवृत्तापि पुनश्चेत्\nप्रवर्तेते तदा मुक्तानामपि पुनः संसारप्राप्तिः स्यादिति चेन्न\nयथा परपुरुषदर्शनासहा सूर्यदर्शनवर्जितापि कुलवधूः\nप्रमादाद्विगलिताङ्गपटा चेदवलोक्यते परपुरुषेण तदाऽसौ तथा\nप्रवर्ततेऽप्रमत्तां यथैनां पुनः पुरुषान्तरानि न पश्यन्ति तथा\nप्रकृतिः कुलवधूतोऽप्यधिका दृष्टा बिंबकेन पुनर्न दर्शनमार्गमेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3"}, {"id": "B_000205", "originalText": "उक्तं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3"}, {"id": "B_000206", "originalText": "प्रकृतेः सुकुमारतरं न किञ्चिदस्तीति मे मतिर्भवति। या दृष्टास्मीति पुनर्न दर्शनमुपैति पुरुषस्येति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3"}, {"id": "B_000207", "originalText": "धर्मो ज्ञानं विराग ऐश्वर्यमिति सात्त्विका बुद्धिधर्माः।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3"}, {"id": "B_000208", "originalText": "अधर्माज्ञानावैराग्यानैश्वर्याभिधानाश्चत्वारस्तामसाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3"}, {"id": "B_000209", "originalText": "अत्र ज्ञानवर्जितैः सप्तभिः प्रकृतिर्बध्नात्यात्मानं विवेकख्यात्या\nप्रकृतिपुरुषान्यताज्ञानेन सैव विमोचयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3"}, {"id": "B_000210", "originalText": "उक्तञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3"}, {"id": "B_000211", "originalText": "रूपैः सप्तभिरेवम्बध्नात्यात्मानमात्मना प्रकृतिः। सैव च पुरुषार्थम प्रति विमोचयत्येकरूपेण॥", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3"}, {"id": "B_000212", "originalText": "यथा विद्रुममणिमौक्तिकशुक्तिमकरकच्छपनागशंखकपर्दकादीन्\nविहाय परमकारुणिकेन लीलाविग्रहधारिणा भगवता\nरत्न्यान्येव समुद्धृतान्युदधेर्देवसमृद्ध्यर्थं तथा\nजल्पतर्काभासाख्याऽन्यत्रसुलभप्रमेयवितण्डादींश्च विहाय\nसांख्यमातैकलभ्यप्रमेयरत्नानि सांख्यतंत्राध्ययनपरिश्रमालसानां\nसांख्यतन्त्रोदधेर्मया समुद्धृतानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3"}, {"id": "B_000213", "originalText": "रामकृष्णकथा यावद्यावच्चन्द्रदिवाकरौ। सांख्यतत्त्वप्रदीपोऽयं तावदस्तु महीतले॥", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3"}, {"id": "B_000214", "originalText": "इति\nश्रीमत्परमहंसपरिव्राजकाचार्यपूज्यपादश्रीवैकुण्ठशिष्ययतिकविराजयतिप्रकाशितः\nसांख्यतत्त्वप्रदीपः समाप्तः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3"}];
        const contentDiv = document.getElementById('content');
        const audioPlayer = document.getElementById('audio-player');
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioPlayer.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => playAudio(index);
            contentDiv.appendChild(div);
        });

        function playAudio(index) {
            if (index < 0 || index >= manifest.length) return;
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Build the URL to stream from Cloudflare R2 Worker
            // Example: https://worker.url/BucketName/Book.zip/file.mp3
            audioPlayer.src = WORKER_URL + '/' + BUCKET_NAME + '/' + ZIP_NAME + '/' + item.audioFile;
            audioPlayer.playbackRate = document.getElementById('speed-slider').value;
            audioPlayer.play().catch(e => console.log("Audio play error:", e));
        }

        audioPlayer.onended = () => { playAudio(currentIndex + 1); };
    </script>
