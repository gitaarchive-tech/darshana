_000023.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000024", "originalText": "तीव्रसंवेगानामासन्नः॥ १.२१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000025", "originalText": "मृदुमध्याधिमात्रत्वात् ततोऽपि विशेषः॥ १.२२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000026", "originalText": "ईश्वरप्रणिधानाद्वा॥ १.२३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000027", "originalText": "क्लेशकर्मविपाकाशयैरपरामृष्टः पुरुषविशेष ईश्वरः॥ १.२४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000028", "originalText": "तत्र निरतिशयं सर्वज्ञबीजम्॥ १.२५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000029", "originalText": "(सर्वज्ञत्वबीजम्)\n\nस पूर्वेषामपि गुरुः कालेनानवच्छेदात्॥ १.२६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000030", "originalText": "तस्य वाचकः प्रणवः॥ १.२७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000031", "originalText": "तज्जपस्तदर्थभावनम्॥ १.२८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000032", "originalText": "ततः प्रत्यक्चेतनाधिगमोऽप्यन्तरायाभावश्च॥ १.२९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000033", "originalText": "व्याधिस्त्यानसंशयप्रमादालस्याविरति\nभ्रान्तिदर्शनालब्धभूमिकत्वानवस्थितत्वानि\nचित्तविक्षेपास्तेऽन्तरायाः॥ १.३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000034", "originalText": "दुःखदौर्मनस्याङ्गमेजयत्वश्वासप्रश्वासा विक्षेपसहभुवः॥ १.३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000035", "originalText": "तत्प्रतिषेधार्थमेकतत्त्वाभ्यासः॥ १.३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000036", "originalText": "मैत्रीकरुणामुदितोपेक्षाणां सुखदुःखपुण्यापुण्यविषयाणां\nभावनातश्चित्तप्रसादनम्॥ १.३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000037", "originalText": "प्रच्छर्दनविधारणाभ्यां वा प्राणस्य॥ १.३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000038", "originalText": "विषयवती वा प्रवृत्तिरुत्पन्ना मनसः स्थितिनिबन्धिनी॥ १.३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000039", "originalText": "विशोका वा ज्योतिष्मती॥ १.३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000040", "originalText": "वीतरागविषयं वा चित्तम्॥ १.३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000041", "originalText": "स्वप्ननिद्राज्ञानालम्बनं वा॥ १.३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000042", "originalText": "यथाभिमतध्यानाद्वा॥ १.३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000043", "originalText": "परमाणु परममहत्त्वान्तोऽस्य वशीकारः॥ १.४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000044", "originalText": "क्षीणवृत्तेरभिजातस्येव मणेर्ग्रहीतृग्रहणग्राह्येषु\nतत्स्थतदञ्जनता समापत्तिः॥ १.४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000045", "originalText": "तत्र शब्दार्थज्ञानविकल्पैः सङ्कीर्णा सवितर्का समापत्तिः॥ १.४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000046", "originalText": "स्मृतिपरिशुद्धौ स्वरूपशून्येवार्थमात्रनिर्भासा निर्वितर्का॥ १.४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000047", "originalText": "एतयैव सविचारा निर्विचारा च सूक्ष्मविषया व्याख्याता॥ १.४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000048", "originalText": "सूक्ष्मविषयत्वं चालिङ्गपर्यवसानम्॥ १.४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000049", "originalText": "ता एव सबीजः समाधिः॥ १.४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000050", "originalText": "निर्विचारवैशारद्येऽध्यात्मप्रसादः॥ १.४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000051", "originalText": "ऋतम्भरा तत्र प्रज्ञा॥ १.४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000052", "originalText": "श्रुतानुमानप्रज्ञाभ्यामन्यविषया विशेषार्थत्वात्॥ १.४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000053", "originalText": "तज्जः संस्कारोऽन्यसंस्कारप्रतिबन्धी॥ १.५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000054", "originalText": "तस्यापि निरोधे सर्वनिरोधान्निर्बीजः समाधिः॥ १.५१॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000055", "originalText": "इति पतञ्जलिविरचिते योगसूत्रे प्रथमः समाधिपादः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000056", "originalText": "द्वितीयोऽध्यायः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000057", "originalText": "साधनपादः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000058", "originalText": "तपःस्वाध्यायेश्वरप्रणिधानानि क्रियायोगः॥ २.१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000059", "originalText": "समाधिभावनार्थः क्लेशतनूकरणार्थश्च॥ २.२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000060", "originalText": "अविद्यास्मितारागद्वेषाभिनिवेशाः क्लेशाः॥ २.३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000061", "originalText": "अविद्या क्षेत्रमुत्तरेषां प्रसुप्ततनुविच्छिन्नोदाराणाम्॥ २.४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000062", "originalText": "अनित्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मख्यातिरविद्या॥ २.५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000063", "originalText": "दृग्दर्शनशक्त्योरेकात्मतेवास्मिता॥ २.६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000064", "originalText": "सुखानुशयी रागः॥ २.७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000065", "originalText": "दुःखानुशयी द्वेषः॥ २.८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000066", "originalText": "स्वरसवाही विदुषोऽपि तथारूढोऽभिनिवेशः॥ २.९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000067", "originalText": "ते प्रतिप्रसवहेयाः सूक्ष्माः॥ २.१०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000068", "originalText": "ध्यानहेयास्तद्वृत्तयः॥ २.११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000069", "originalText": "क्लेशमूलः कर्माशयो दृष्टादृष्टजन्मवेदनीयः॥ २.१२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000070", "originalText": "सति मूले तद्विपाको जात्यायुर्भोगाः॥ २.१३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000071", "originalText": "ते ह्लादपरितापफलाः पुण्यापुण्यहेतुत्वात्॥ २.१४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000072", "originalText": "परिणामतापसंस्कारदुःखैर्गुणवृत्तिविरोधाच्च\n दुःखमेव सर्वं विवेकिनः॥ २.१५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000073", "originalText": "हेयं दुःखमनागतम्॥ २.१६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000074", "originalText": "द्रष्टृदृश्ययोः संयोगो हेयहेतुः॥ २.१७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000075", "originalText": "प्रकाशक्रियास्थितिशीलं भूतेन्द्रियात्मकं\nभोगापवर्गार्थं दृश्यम्॥ २.१८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000076", "originalText": "विशेषाविशेषलिङ्गमात्रालिङ्गानि गुणपर्वाणि॥ २.१९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000077", "originalText": "द्रष्टा दृशिमात्रः शुद्धोऽपि प्रत्ययानुपश्यः॥ २.२०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000078", "originalText": "तदर्थ एव दृश्यस्यात्मा॥ २.२१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000079", "originalText": "कृतार्थं प्रति नष्टमप्यनष्टं तदन्यसाधारणत्वात्॥ २.२२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000080", "originalText": "स्वस्वामिशक्त्योः स्वरूपोपलब्धिहेतुः संयोगः॥ २.२३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000081", "originalText": "तस्य हेतुरविद्या॥ २.२४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000082", "originalText": "तदभावात् संयोगाभावो हानं तद्दृशेः कैवल्यम्॥ २.२५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000083", "originalText": "विवेकख्यातिरविप्लवा हानोपायः॥ २.२६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000084", "originalText": "तस्य सप्तधा प्रान्तभूमिः प्रज्ञा॥ २.२७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000085", "originalText": "योगाङ्गानुष्ठानादशुद्धिक्षये ज्ञानदीप्तिरा विवेकख्यातेः॥ २.२८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000086", "originalText": "यमनियमासनप्राणायामप्रत्याहारधारणाध्यानसमाधयोऽष्टावङ्गानि॥ २.२९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000087", "originalText": "अहिंसासत्यास्तेयब्रह्मचर्यापरिग्रहा यमाः॥ २.३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000088", "originalText": "जातिदेशकालसमयानवच्छिन्नाः सार्वभौमा महाव्रतम्॥ २.३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000089", "originalText": "शौचसन्तोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः॥ २.३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000090", "originalText": "वितर्कबाधने प्रतिपक्षभावनम्॥ २.३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000091", "originalText": "वितर्का हिंसादयः कृतकारितानुमोदिता लोभक्रोधमोहपूर्वका\nमृदुमध्याधिमात्रा दुःखाज्ञानानन्तफला इति प्रतिपक्षभावनम्॥ २.३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000092", "originalText": "अहिंसाप्रतिष्ठायां तत्सन्निधौ वैरत्यागः॥ २.३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000093", "originalText": "सत्यप्रतिष्ठायां क्रियाफलाश्रयत्वम्॥ २.३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000094", "originalText": "अस्तेयप्रतिष्ठायां सर्वरत्नोपस्थानम्॥ २.३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000095", "originalText": "ब्रह्मचर्यप्रतिष्ठायां वीर्यलाभः॥ २.३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000096", "originalText": "अपरिग्रहस्थैर्ये जन्मकथन्तासम्बोधः॥ २.३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000097", "originalText": "शौचात् स्वाङ्गजुगुप्सा परैरसंसर्गः॥ २.४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000098", "originalText": "सत्त्वशुद्धिसौमनस्यैकाग्र्येन्द्रियजयात्मदर्शनयोग्यत्वानि च॥ २.४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000099", "originalText": "सन्तोषादनुत्तमसुखलाभः॥ २.४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000100", "originalText": "कायेन्द्रियसिद्धिरशुद्धिक्षयात् तपसः॥ २.४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000101", "originalText": "स्वाध्यायाद् इष्टदेवतासम्प्रयोगः॥ २.४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000102", "originalText": "समाधिसिद्धिरीश्वरप्रणिधानात्॥ २.४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000103", "originalText": "स्थिरसुखम् आसनम्॥ २.४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000104", "originalText": "प्रयत्नशैथिल्यानन्तसमापत्तिभ्याम्॥ २.४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000105", "originalText": "ततो द्वन्द्वानभिघातः॥ २.४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000106", "originalText": "तस्मिन्सति श्वासप्रश्वासयोर्गतिविच्छेदः प्राणायामः॥ २.४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000107", "originalText": "बाह्याभ्यन्तरस्तम्भवृत्तिर्देशकालसङ्ख्याभिः\n परिदृष्टो दीर्घसूक्ष्मः॥ २.५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000108", "originalText": "बाह्याभ्यन्तरविषयाक्षेपी चतुर्थः॥ २.५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000109", "originalText": "ततः क्षीयते प्रकाशावरणम्॥ २.५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000110", "originalText": "धारणासु च योग्यता मनसः॥ २.५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000111", "originalText": "स्वविषयासम्प्रयोगे चित्तस्वरूपानुकार इवेन्द्रियाणां प्रत्याहारः॥ २.५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000112", "originalText": "ततः परमा वश्यतेन्द्रियाणाम्॥ २.५५॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000113", "originalText": "इति पतञ्जलिविरचिते योगसूत्रे द्वितीयः साधनपादः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000114", "originalText": "तृतीयोऽध्यायः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000115", "originalText": "विभूतिपादः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000116", "originalText": "देशबन्धश्चित्तस्य धारणा॥ ३.१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000117", "originalText": "तत्र प्रत्ययैकतानता ध्यानम्॥ ३.२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000118", "originalText": "तदेवार्थमात्रनिर्भासं स्वरूपशून्यमिव समाधिः॥ ३.३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000119", "originalText": "त्रयमेकत्र संयमः॥ ३.४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000120", "originalText": "तज्जयात्प्रज्ञालोकः॥ ३.५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000121", "originalText": "तस्य भूमिषु विनियोगः॥ ३.६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000122", "originalText": "त्रयमन्तरङ्गं पूर्वेभ्यः॥ ३.७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000123", "originalText": "तदपि बहिरङ्गं निर्बीजस्य॥ ३.८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000124", "originalText": "व्युत्थाननिरोधसंस्कारयोरभिभवप्रादुर्भावौ\nनिरोधक्षणचित्तान्वयो निरोधपरिणामः॥ ३.९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000125", "originalText": "तस्य प्रशान्तवाहिता संस्कारात्॥ ३.१०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000126", "originalText": "सर्वार्थतैकाग्रतयोः क्षयोदयौ चित्तस्य समाधिपरिणामः॥ ३.११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000127", "originalText": "ततः पुनः शान्तोदितौ तुल्यप्रत्ययौ चित्तस्यैकाग्रतापरिणामः॥ ३.१२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000128", "originalText": "एतेन भूतेन्द्रियेषु धर्मलक्षणावस्थापरिणामा व्याख्याताः॥ ३.१३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000129", "originalText": "शान्तोदिताव्यपदेश्यधर्मानुपाती धर्मी॥ ३.१४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000130", "originalText": "क्रमान्यत्वं परिणामान्यत्वे हेतुः॥ ३.१५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000131", "originalText": "परिणामत्रयसंयमाद् अतीतानागतज्ञानम्॥ ३.१६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000132", "originalText": "शब्दार्थप्रत्ययानामितरेतराध्यासात्\nसङ्करस्तत्प्रविभागसंयमात्सर्वभूतरुतज्ञानम्॥ ३.१७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000133", "originalText": "संस्कारसाक्षात्करणात्पूर्वजातिज्ञानम्॥ ३.१८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000134", "originalText": "प्रत्ययस्य परचित्तज्ञानम्॥ ३.१९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000135", "originalText": "न च तत्सालम्बनं तस्याविषयीभूतत्वात्॥ ३.२०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000136", "originalText": "कायरूपसंयमात्तद्ग्राह्यशक्तिस्तम्भे\nचक्षुःप्रकाशासम्प्रयोगेऽन्तर्धानम्॥ ३.२१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000137", "originalText": "सोपक्रमं निरुपक्रमं च कर्म\n तत्संयमादपरान्तज्ञानमरिष्टेभ्यो वा॥ ३.२२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000138", "originalText": "मैत्र्यादिषु बलानि॥ ३.२३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000139", "originalText": "बलेषु हस्तिबलादीनि॥ ३.२४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000140", "originalText": "प्रवृत्त्यालोकन्यासात्सूक्ष्मव्यवहितविप्रकृष्टज्ञानम्॥ ३.२५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000141", "originalText": "भुवनज्ञानं सूर्ये संयमात्॥ ३.२६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000142", "originalText": "चन्द्रे ताराव्यूहज्ञानम्॥ ३.२७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000143", "originalText": "ध्रुवे तद्गतिज्ञानम्॥ ३.२८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000144", "originalText": "नाभिचक्रे कायव्यूहज्ञानम्॥ ३.२९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000145", "originalText": "कण्ठकूपे क्षुत्पिपासानिवृत्तिः॥ ३.३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000146", "originalText": "कूर्मनाड्यां स्थैर्यम्॥ ३.३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000147", "originalText": "मूर्धज्योतिषि सिद्धदर्शनम्॥ ३.३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000148", "originalText": "प्रातिभाद्वा सर्वम्॥ ३.३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000149", "originalText": "हृदये चित्तसंवित्॥ ३.३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000150", "originalText": "सत्त्वपुरुषयोरत्यन्तासङ्कीर्णयोः प्रत्ययाविशेषो भोगः\nपरार्थत्वात्स्वार्थसंयमात्पुरुषज्ञानम्॥ ३.३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000151", "originalText": "ततः प्रातिभश्रावणवेदनादर्शास्वादवार्ता जायन्ते॥ ३.३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000152", "originalText": "ते समाधावुपसर्गा व्युत्थाने सिद्धयः॥ ३.३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000153", "originalText": "बन्धकारणशैथिल्यात्प्रचारसंवेदनाच्च\n चित्तस्य परशरीरावेशः॥ ३.३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000154", "originalText": "उदानजयाज्जलपङ्ककण्टकादिष्वसङ्ग उत्क्रान्तिश्च॥ ३.३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000155", "originalText": "समानजयाज्ज्वलनम्॥ ३.४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000156", "originalText": "(समानजयात्प्रज्वलनम्)\n\nश्रोत्राकाशयोः सम्बन्धसंयमाद्दिव्यं श्रोत्रम्॥ ३.४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000157", "originalText": "कायाकाशयोः सम्बन्धसंयमाल्लघुतूल\n समापत्तेश्चाकाशगमनम्॥ ३.४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000158", "originalText": "बहिरकल्पिता वृत्तिर्महाविदेहा ततः प्रकाशावरणक्षयः॥ ३.४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000159", "originalText": "स्थूलस्वरूपसूक्ष्मान्वयार्थवत्त्वसंयमाद्भूतजयः॥ ३.४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000160", "originalText": "ततोऽणिमादिप्रादुर्भावः कायसम्पत्तद्धर्मानभिघातश्च॥ ३.४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000161", "originalText": "रूपलावण्यबलवज्रसंहननत्वानि कायसम्पत्॥ ३.४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000162", "originalText": "ग्रहणस्वरूपास्मितान्वयार्थवत्त्वसंयमादिन्द्रियजयः॥ ३.४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000163", "originalText": "ततो मनोजवित्वं विकरणभावः प्रधानजयश्च॥ ३.४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000164", "originalText": "सत्त्वपुरुषान्यताख्यातिमात्रस्य सर्वभावाधिष्ठातृत्वं\nसर्वज्ञातृत्वं च॥ ३.४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000165", "originalText": "तद्वैराग्यादपि दोषबीजक्षये कैवल्यम्॥ ३.५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000166", "originalText": "स्थान्युपनिमन्त्रणे सङ्गस्मयाकरणं पुनरनिष्टप्रसङ्गात्॥ ३.५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000167", "originalText": "क्षणतत्क्रमयोः संयमाद्विवेकजं ज्ञानम्॥ ३.५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000168", "originalText": "जातिलक्षणदेशैरन्यतानवच्छेदात् तुल्ययोस्ततः प्रतिपत्तिः॥ ३.५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000169", "originalText": "तारकं सर्वविषयं सर्वथाविषयमक्रमञ्चेति विवेकजं ज्ञानम्॥ ३.५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000170", "originalText": "सत्त्वपुरुषयोः शुद्धिसाम्ये कैवल्यमिति॥ ३.५५॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000171", "originalText": "इति पतञ्जलिविरचिते योगसूत्रे तृतीयो विभूतिपादः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000172", "originalText": "चतुर्थोऽध्यायः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000173", "originalText": "कैवल्यपादः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000174", "originalText": "जन्मौषधिमन्त्रतपःसमाधिजाः सिद्धयः॥ ४.१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000175", "originalText": "जात्यन्तरपरिणामः प्रकृत्यापूरात्॥ ४.२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000176", "originalText": "निमित्तमप्रयोजकं प्रकृतीनां वरणभेदस्तु\n ततः क्षेत्रिकवत्॥ ४.३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000177", "originalText": "निर्माणचित्तान्यस्मितामात्रात्॥ ४.४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000178", "originalText": "प्रवृत्तिभेदे प्रयोजकं चित्तमेकमनेकेषाम्॥ ४.५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000179", "originalText": "तत्र ध्यानजमनाशयम्॥ ४.६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000180", "originalText": "कर्माशुक्लाकृष्णं योगिनस्त्रिविधमितरेषाम्॥ ४.७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000181", "originalText": "ततस्तद्विपाकानुगुणानामेवाभिव्यक्तिर्वासनानाम्॥ ४.८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000182", "originalText": "जातिदेशकालव्यवहितानामप्यानन्तर्यं स्मृतिसंस्कारयोरेकरूपत्वात्॥ ४.९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000183", "originalText": "तासामनादित्वं चाशिषो नित्यत्वात्॥ ४.१०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000184", "originalText": "हेतुफलाश्रयालम्बनैः सङ्गृहीतत्वादेषामभावे तदभावः॥ ४.११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000185", "originalText": "अतीतानागतं स्वरूपतोऽस्त्यध्वभेदाद्धर्माणाम्॥ ४.१२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000186", "originalText": "ते व्यक्तसूक्ष्मा गुणात्मानः॥ ४.१३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000187", "originalText": "परिणामैकत्वाद्वस्तुतत्त्वम्॥ ४.१४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000188", "originalText": "वस्तुसाम्ये चित्तभेदात्तयोर्विभक्तः पन्थाः॥ ४.१५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000189", "originalText": "न चैकचित्ततन्त्रं वस्तु तदप्रमाणकं तदा किं स्यात्॥ ४.१६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000190", "originalText": "तदुपरागापेक्षित्वाच्चित्तस्य वस्तु ज्ञाताज्ञातम्॥ ४.१७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000191", "originalText": "सदा ज्ञाताश्चित्तवृत्तयस्तत्प्रभोः पुरुषस्यापरिणामित्वात्॥ ४.१८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000192", "originalText": "न तत्स्वाभासं दृश्यत्वात्॥ ४.१९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000193", "originalText": "एकसमये चोभयानवधारणम्॥ ४.२०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000194", "originalText": "चित्तान्तरदृश्ये बुद्धिबुद्धेरतिप्रसङ्गः स्मृतिसङ्करश्च॥ ४.२१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000195", "originalText": "चितेरप्रतिसङ्क्रमायास्तदाकारापत्तौ स्वबुद्धिसंवेदनम्॥ ४.२२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000196", "originalText": "द्रष्टृदृश्योपरक्तं चित्तं सर्वार्थम्॥ ४.२३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000197", "originalText": "तदसङ्ख्येयवासनाभिश्चित्रमपि परार्थं संहत्यकारित्वात्॥ ४.२४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000198", "originalText": "विशेषदर्शिन आत्मभावभावनाविनिवृत्तिः॥ ४.२५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000199", "originalText": "तदा विवेकनिम्नं कैवल्यप्राग्भारं चित्तम्॥ ४.२६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000200", "originalText": "तच्छिद्रेषु प्रत्ययान्तराणि संस्कारेभ्यः॥ ४.२७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000201", "originalText": "हानमेषां क्लेशवदुक्तम्॥ ४.२८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000202", "originalText": "प्रसङ्ख्यानेऽप्यकुसीदस्य सर्वथा विवेकख्यातेर्धर्ममेघः समाधिः॥ ४.२९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000203", "originalText": "ततः क्लेशकर्मनिवृत्तिः॥ ४.३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000204", "originalText": "तदा सर्वावरणमलापेतस्य ज्ञानस्यानन्त्याज्ज्ञेयमल्पम्॥ ४.३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000205", "originalText": "ततः कृतार्थानां परिणामक्रमसमाप्तिर्गुणानाम्॥ ४.३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000206", "originalText": "क्षणप्रतियोगी परिणामापरान्तनिर्ग्राह्यः क्रमः॥ ४.३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000207", "originalText": "पुरुषार्थशून्यानां गुणानां प्रतिप्रसवः कैवल्यं\nस्वरूपप्रतिष्ठा वा चितिशक्तिरिति॥ ४.३४॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000208", "originalText": "इति पतञ्जलिविरचिते योगसूत्रे चतुर्थः कैवल्यपादः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "Yogasutra.zip"}, {"id": "B_000209", "originalText": "इति श्री पातञ्जलयोगसूत्राणि॥", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "Yogasutra.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
