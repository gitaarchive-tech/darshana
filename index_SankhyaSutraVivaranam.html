3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000079", "originalText": "आनन्दयितव्यमधिभूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000080", "originalText": "प्रजापतिस्तत्राधिदैवतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000081", "originalText": "एवमेव\nत्रयोदशकरणस्याध्यात्ममधिभूतमधिदैवं च व्याख्यातम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000082", "originalText": "कानि\nचत्वारीत्यत आह चेति। त्रीणि गुणरूपाणि चतुर्थमधिदैवतमित्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000083", "originalText": "चत्वारि यो वेदयते यथावद्\nगुणस्वरूपाण्यधिदैवतं च। विमुक्तपाप्मा गतदोषसङ्गो\nगुणांस्तु भुङ्क्ते न गुणैः स भुज्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000084", "originalText": "अथ कास्ता अभिबुद्धय इत्युच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000085", "originalText": "पञ्चाभिबुद्धयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000086", "originalText": "बुद्धिरभिमान\nइच्छा कर्तव्यं तत्क्रिया चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000087", "originalText": "अभिमुखी बुद्धिरभिबुद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000088", "originalText": "इदं\nकरणीयमेत्येतदध्यवसायो बुद्धिः क्रियात्मपरामर्शस्वरूपप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000089", "originalText": "अभिमुखो मानोऽहं करोमीत्यहंकारोऽभिमानः।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000090", "originalText": "बुद्धिक्रिया इच्छा\nवाञ्छा।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000091", "originalText": "कर्तव्यं संकल्पो मनसो वृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000092", "originalText": "क्रिया एतद्वस्तुस्वरूपमिति\nकर्तव्यालोचनं यद्बुद्धीन्द्रियाणां सा क्रिया।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000093", "originalText": "इत्थमेतत् कर्तव्यमिति\nयत्प्रवृत्तिः कर्मेन्द्रियाणां सा क्रियेति। एवमेताह पञ्चाभिबुद्धयो\nव्याख्याताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000094", "originalText": "अथ काः पञ्चकर्मयोनयः उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000095", "originalText": "धृतिः श्रद्धा सुखा अविविदिषा\nविविदिषा चेति पञ्च कर्मयोनयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000096", "originalText": "वाचि कर्मणि काये च प्रतीतिर्याभिरज्यते। तन्निष्ठस्तत्प्रतिष्ठश्च धृतेरेतद्धि लक्षणम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000097", "originalText": "अनसूया ब्रह्मचर्यं यजनं याजनं तपः। प्रतिग्रहोऽत्रहोमश्च श्रद्धाया लक्षणं स्मृतम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000098", "originalText": "सुखार्थी यस्तु सेवेत विद्याकर्मतपांसि च। प्रायश्चित्तपरो नित्यं सुखेयं परिकीर्तिता॥", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000099", "originalText": "विषधूममूर्छितवदविविदिषा।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000100", "originalText": "विविदिषा ध्यायिनां प्रज्ञायोनिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000101", "originalText": "एकत्वं च पृथक्त्वं च नित्यं चेदमचेतनम्। सूक्ष्मं सत्कार्यमक्षोभ्यं ज्ञेया विविदिषा हि सा॥", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000102", "originalText": "कार्यकारणक्षमकरा विविदिषा प्राकृतिका वृत्तिः। धृतिः श्रद्धा सुखा\nअविविदिषा चतस्रो बन्धाय विविदिषैका मोक्षाय इति पञ्च कर्मयोनयो\nव्याख्याताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000103", "originalText": "अत्राह के ते पञ्चवायवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000104", "originalText": "उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000105", "originalText": "प्राणोऽपानः समानश्च उदानो व्यान एव च। इत्येते वायवः पञ्च शरीरेषु शरीरिणाम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000106", "originalText": "तत्र प्राणो नाम वायुर्योऽयं मुखनासिकाधिष्ठानप्राणनात्\nक्रमेणाननात् प्राण इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000107", "originalText": "अपानो नाम वायुर्नाभेरधिष्ठाता\nअपनयनादधोगमनाच्चापान इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000108", "originalText": "समानो नाम\nवायुर्हृदधिष्ठाता समनात् समगमनाच्च समान इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000109", "originalText": "उदानो\nनाम वायुः कण्ठाधिष्ठाता ऊर्ध्वं गमनाच्च उदान इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000110", "originalText": "व्यानो\nनाम वायुः सन्ध्यधिष्ठाता प्राणादिजृम्भणाच्च व्यान इत्यभिधीयते। इति पञ्चवायवो व्याख्याताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000111", "originalText": "आह के ते पञ्चकर्मात्मानः उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000112", "originalText": "वैकारिकस्तैजसो भूतादिश्च\nसानुमानो निरनुमानश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000113", "originalText": "तत्र वैकारिकः शुभकर्मकर्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000114", "originalText": "तैजसोऽशुभकर्मकर्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000115", "originalText": "भूतादिर्मूढकर्मकर्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000116", "originalText": "सानुमानः\nशुभमूढकर्मकर्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000117", "originalText": "निरनुमानोऽशुभमूढकर्मकर्ता। इत्येते\nपञ्चकर्मकर्तारो व्याख्याताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000118", "originalText": "आह का सा पञ्चपर्वाविद्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000119", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000120", "originalText": "तमो मोहो\nमहामोहस्तामिस्रोऽन्धतामिस्रश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000121", "originalText": "तत्र तमोमोहावुभावेतावष्टात्माकौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000122", "originalText": "महामोहो दशात्मकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000123", "originalText": "तामिस्रान्धतामिस्रौ चाष्टादशात्माकौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000124", "originalText": "तत्र तमो\nनामाष्टासु प्रकृतिष्वव्यक्तबुद्ध्यहंकारपञ्चतन्मात्रसञ्ज्ञितासु\nअनात्मस्वात्मज्ञानाभिमानस्तम इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000125", "originalText": "मोहो\nनामाणिमाद्यष्टागुणैश्वर्यप्राप्तये योभिमान उत्पद्यते स मोह\nइत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000126", "originalText": "महामोहो नाम दृष्टानुश्रविकेषु विषयेषु दशसु\nनिवृत्तेषु मुक्तोऽहमिति मन्यते स महामोह इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000127", "originalText": "तामिस्रो\nनाम अष्टगुणैश्वर्येऽणिमाद्ये दशविधे च विषये प्रतिहतस्य\nदुःखमुत्पद्यतेऽसौ तामिस्र इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000128", "originalText": "अन्धतामिस्रो नाम\nअणिमाद्यष्टगुणैश्वर्ये दशविधे च विषये सिद्धे मरणकाले च\nयो विषादः प्रत्यपद्यते सोऽन्धतामिस्र इत्यभिधीयते। एवमेषा\nपञ्चपर्वाऽविद्या द्विषष्टिभेदा व्याख्याता॥", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000129", "originalText": "अत्राह काष्टाविंशतिधाशक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000130", "originalText": "अत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000131", "originalText": "एकादशेन्द्रियवधाः\nसप्तदशबुद्धिवधाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000132", "originalText": "एषाष्टाविंशतिधाशक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000133", "originalText": "तत्रेन्द्रियवधास्तावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000134", "originalText": "बधिरस्त्वक्बधिरः अन्धः जडजिह्वः अजिघ्रः मूकः कुणिः पङ्गुः नपुंसकः\nऊर्ध्ववायुयुक्तः अमनाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000135", "originalText": "तदुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000136", "originalText": "बाधिर्यं कुष्ठितान्धस्त्वं जडताऽजिघ्रता तथा। मूकता कौण्यपङ्गुत्वं क्लैब्योदावर्तमत्तताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000137", "originalText": "एतेदिन्द्रियद्वारा बुद्धेरेव वधाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000138", "originalText": "साक्षाद्बुद्धिवधा यथा। नवविधतुष्टिवैकल्यात् अष्टविधासिद्धवैकल्याच्च सप्तदशबुद्धिवधा\nइत्यष्टाविंशतिधाशक्तिः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000139", "originalText": "का पुनर्नवधा तुष्टिः उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000140", "originalText": "चतस्र आद्यात्मिक्यस्तुष्टयः बाह्याः\nपञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000141", "originalText": "आद्याः प्रकृत्युपादानकालभाग्याख्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000142", "originalText": "प्रकृत्यैव मुक्तिः\nकिं पुनः साधनैरिति तुष्टिः प्रकृत्याख्या अम्भो नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000143", "originalText": "साधनैः\nसंन्यासादिभिरुपात्तैस्तुष्टिः साधानाख्या सलिलं नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000144", "originalText": "कालेनैव मुक्त्यादिकं\nसेत्स्यति किं दुःखैः संन्यासादिसाधनैरिति तुष्टिः कालाख्याऽघो नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000145", "originalText": "या तु भाग्यादेव सर्वं सेत्स्यति किं साधनादिध्यानादिक्लेशैरिति सा\nभाग्याख्या तुष्टिर्नाम। बाह्याः शब्दादिविषयवैराग्यास्तुष्टयः\nअर्जनरक्षणक्षयभोगहिंसादोषदर्शनं वैराग्यहेतुः\nपञ्चविधस्तद्भेदेन पञ्चतुष्टयः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000146", "originalText": "अथ काः सिद्धयः उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000147", "originalText": "अष्टौ सिद्धयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000148", "originalText": "उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000149", "originalText": "अध्ययनं तारं\nनाम सिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000150", "originalText": "ततोऽर्थज्ञानं सुतारं नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000151", "originalText": "ततस्तर्केणार्थपरीक्षणं\nतारतारं नाम सिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000152", "originalText": "ततः परीक्षकसंवादनं रम्यकं नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000153", "originalText": "ततो विवेकख्यातिः सदामुदितं नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000154", "originalText": "एताः पञ्च गौण्यः सिद्धयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000155", "originalText": "दुःखत्रयविघातास्तास्त्रयो मुख्याः सिद्धयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000156", "originalText": "प्रमोदमुदितमोदनामाख्याः\nफलमित्यष्टौ सिद्धयः। तुष्टिसिद्धीनां विपर्ययात् सप्तदशधा\nवुद्धिवधाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000157", "originalText": "के पुनर्मौलिकार्थाः कतिधा उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000158", "originalText": "दशधा मौलिकार्थाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000159", "originalText": "एकत्वमर्थवत्त्वं पारार्थ्यं प्रधानस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000160", "originalText": "अन्यत्वमकर्तृत्वं बहुत्वं\nपुरुषस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000161", "originalText": "अस्तित्वं योगो वियोगश्चेत्युभययोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000162", "originalText": "शेषवृत्तिः\nपरिशिष्टत्वं प्रलये तदुभययोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000163", "originalText": "तदुक्तम्\nप्रधानास्तित्वमेकत्वमर्थवत्त्वं यथार्थता। पारार्थ्यं च तथा नैक्यं वियोगो योग एव च॥", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000164", "originalText": "शेषवृत्तिरकर्तृत्वं मौलिकार्थाः स्मृता दश॥", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000165", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000166", "originalText": "अत्राह कोऽनुग्रहसर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000167", "originalText": "अनुगृह्णाति प्रत्ययभूतादिसर्गं यः सर्गः\nसोऽनुग्रहसर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000168", "originalText": "तन्मात्रसर्ग एवासौ विशेषापरनामा।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000169", "originalText": "के विशेषाः कियन्तश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000170", "originalText": "उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000171", "originalText": "लिङ्गदेहाह स्थूलदेहाः\nस्थूलभूतानि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000172", "originalText": "तत्र लिङ्गं स्थूलदेहात् पूर्वमुत्पन्नमव्याहतं\nस्थूलनाशेऽप्यनश्वरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000173", "originalText": "महदहंकारेन्द्रियतन्मात्रात्मकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000174", "originalText": "धर्माधर्मज्ञानाज्ञानवैराग्यावैराग्यैश्वर्यानैश्वर्याख्यभाववासितं\nसंसरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000175", "originalText": "स्थूलभूतानि तु भूगोलसमुद्रवह्निशिशुमारब्रह्माण्डविराटादीनि। स्थूलदेहाः के कतिविधाश्चेति उच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000176", "originalText": "चतुर्दशविधो भूतसर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000177", "originalText": "तत्राष्टाविकल्पो दैवस्तैर्यग्योनः पञ्चधा मानुष्य एकविधः ब्राह्मः\nप्राजापत्यः पैत्रे गान्धर्वो याक्षो राक्षसः पैशाचाश्च दैवसर्गः\nपशुमृगसरीसृपस्थावराः तिरश्चां सर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000178", "originalText": "ब्राह्मणादिजातिभेदेऽपि\nसंस्थाने विशेषाभावात् एकविधो मानुष्य इति चतुर्दशविधाः\nस्थूलदेहाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000179", "originalText": "कह पुनर्बन्धः कतिधा च।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000180", "originalText": "त्रिविधो बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000181", "originalText": "काः पुनस्ता विधा उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000182", "originalText": "प्राकृतिको वैकृतिको दाक्षणिकश्च\nबन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000183", "originalText": "प्रकृतिमात्मानं ज्ञात्वा तच्चिन्तनात् प्राकृतिकः अत्रोच्यते\nपूर्णवर्षसहस्रं तु तिष्ठन्त्यव्यक्तचिन्तका इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000184", "originalText": "महदादीनात्मत्वेन\nज्ञात्वा तच्चिन्तनाद्वैकारिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000185", "originalText": "अत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000186", "originalText": "दशमन्वन्तराणीह तिष्ठन्तीन्द्रियचिन्तकाः। भौतिकास्तु शतं पूर्णं सहस्रं चाभिमानिकाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000187", "originalText": "बौद्धा दशसहस्राणि तिष्ठन्ति विगतज्वराः।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000188", "originalText": "अमी विदेहाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000189", "originalText": "इष्टापूर्त्ती दक्षिणा तन्निमित्तो दाक्षणिकः अत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000190", "originalText": "स्वर्गस्था नरकं यान्ति नारकाश्च त्रिविष्टपमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000191", "originalText": "गतागतं कामकामा लभन्त इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000192", "originalText": "अत एव हि त्रिष्वपि बन्धेषु एकैकापाये\nततस्ततो मोक्ष इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000193", "originalText": "त्रिविधो मोक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000194", "originalText": "कर्मणो विकारात् प्राकृतश्च मोक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000195", "originalText": "यदुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000196", "originalText": "प्राकृतेन च बन्धेन तथा वैकारिकेण च। दक्षिणाभिस्तृतीयेन वृद्धो नान्येन मुच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000197", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000198", "originalText": "अथ कुतस्त्यानां तत्त्वानां सिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000199", "originalText": "प्रमाणादिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000200", "originalText": "तत्र प्रमाणं\nकिं कतिविधम वा उच्यते त्रिविधं प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000201", "originalText": "तिस्रो विधा यस्येति\nत्रिविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000202", "originalText": "कास्ता विधाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000203", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000204", "originalText": "दृष्टमनुमानमाप्तवचनं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000205", "originalText": "अर्थसन्निकृष्टेन्द्रियजो निश्चयो दृष्टम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000206", "originalText": "इन्द्रियाणि पञ्च\nचक्षुरादीनि मनश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000207", "originalText": "व्याप्तिपक्षधर्मताज्ञानपूर्वकमनुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000208", "originalText": "तच्च त्रिविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000209", "originalText": "पूर्ववत् शेषवत् सामान्यतो दृष्टं\nच।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000210", "originalText": "पूर्ववद्यथा कर्दमेन पूर्ववृत्तवृष्ट्यनुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000211", "originalText": "शेषवद्यथा।", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000212", "originalText": "समुद्रातपलमुदकं(?) क्षारमुपलभ्य\nशेषस्यापि क्षारत्वानुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000213", "originalText": "सामान्यतो दृष्टां च यथा।", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000214", "originalText": "रूपाद्युपलभ्य तदुपलब्धेः कारणस्यानुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000215", "originalText": "रूपाद्युपलब्धयः\nकरणसाध्याः क्रियत्वात् छिदिक्रियावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000216", "originalText": "आप्तश्रुतिराप्तवचनं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000217", "originalText": "यथार्थवाक्यजार्थविषयोध्यवसाय इति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000218", "originalText": "प्रावादुकोद्भावितानां तु\nउपमानार्थापत्तिसम्भवाभावैतिह्यप्रतिभानामित्युक्तेष्वेवान्तर्भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000219", "originalText": "यत् तद्यथा गौर्गवयस्तथेति वाक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000220", "originalText": "तद्ज्ञाननिधीरागम\nएव।", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000221", "originalText": "गवयेपि गोसदृशस्य गवयशब्दो वाचक इति प्रत्ययः\nसोयमनुमानमेतत्सङ्केतग्रहरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000222", "originalText": "यद् गवयस्य\nचक्षुःसन्निकृष्टगोसादृश्यज्ञानं तत्प्रत्यक्षमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000223", "originalText": "अत एव स्मर्यमाणायां गवि सादृश्यज्ञानं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000224", "originalText": "गोगवययोः सादृश्यस्य गवयान्तरवर्त्तिभूयोवयवसामान्यरूपस्य\nयोगरूपस्यैकत्वादित्युपमानं न मानान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000225", "originalText": "जीवतो गृहाभावदर्शनेन\nबहिर्भावकल्पनादित्यर्थापत्तिरनुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000226", "originalText": "सम्भवोऽपि खार्यादौ\nद्रोणाढकप्रस्थाद्यवगमरूपोऽनुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000227", "originalText": "इह भूतले घटो\nनास्तीत्यादिरभावावगमोऽपि प्रत्यक्षमेवेति नाभावः पृथक् प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000228", "originalText": "अनिर्दिष्टप्रवक्तृकं प्रवादमात्रमैतिह्यमपीह वटे यक्षः\nप्रतिवसतीत्यप्रमाणमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000229", "originalText": "आप्तमूलत्वे त्वागम एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000230", "originalText": "द्वारवती पुण्यभूमिरिति\nश्रुतेः तत्र वसतः श्रेयांसस्तत्र गमने पुण्यं भवतीत्यादिबुद्धिर्जायमाना\nप्रतिभा।", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000231", "originalText": "यत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000232", "originalText": "अनुक्तमप्यूहति पण्डितो जन इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000233", "originalText": "सा तु प्रायेण\nप्रमाणमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000234", "originalText": "आर्षं तु दर्शनं प्रत्यक्षमेव। या प्रतिभा साप्यनुमानमेव॥", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000235", "originalText": "त्रयोविंशतिसूत्रैर्हि सर्वशास्त्रार्थसंग्रहः। कृतो मुनिवरेणात्र यथामति सचीवृतः(?)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}, {"id": "B_000236", "originalText": "इति सांख्यसूत्रविवरणाख्या कापिलसूत्रवृत्तिः समाप्ता॥", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "SankhyaSutraVivaranam.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
</body>
