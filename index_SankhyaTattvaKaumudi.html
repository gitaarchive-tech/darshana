    <script>
        const WORKER_URL = "https://bhashya-audio-worker.anantachaitanya108.workers.dev";
        const BUCKET_NAME = "darshana";

        const manifest = [{"id": "B_000000", "originalText": "साङ्ख्यतत्त्वकौमुदी॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000001", "originalText": "कारिका १\n\nअजामेकां लोहितशुक्लकृष्णां\nबह्वीः प्रजाः सृजमानां नमामः। अजा ये तां जुषमाणां भजन्ते\nजहत्येनां भुक्तभोगां नुमस्तान्॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000002", "originalText": "कपिलाय महामुनये मुनये शिष्याय तस्य चासुरये। पञ्चशिखाय तथेश्वरकृष्णायैते नमस्यामः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000003", "originalText": "इह खलु प्रतिपित्सितमर्थं प्रतिपादयन् प्रतिपादयिताऽवधेयवचनो\nभवति प्रेक्षावताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000004", "originalText": "अप्रतिपित्सितमर्थं तु प्रतिपादयन् 'नायं\nलौकिको नापि परीक्षकः' इति प्रेक्षावद्भिरुन्मत्तवदुपेक्ष्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000005", "originalText": "स\nचैषां प्रतिपित्सितोऽर्थो, यो ज्ञातः सन् परमपुरुषार्थाय कल्पते,\nइति प्रारिप्सितशास्रविषयज्ञानस्य परमपुरुषार्थसाधनहेतुत्वात्\nतद्विषयजिज्ञासामवतारयति—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000006", "originalText": "दुःखत्रयाभिघाताज्जिज्ञासा तदघातके हेतौ। दृष्टे सापार्था चेत् नैकान्तात्यन्ततोऽभावात्॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000007", "originalText": "एवं हि शास्त्रविषयो न जिज्ञास्येत यदि दुःखं नाम जगति न स्यात्,\n सद्वा न जिहासितम्, जिहासितं वा अशक्यसमुच्छेदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000008", "originalText": "अशक्यसमुच्छेदता\n च द्वेधा— दुःखस्य नित्यत्वात्, तदुच्छेदोपायापरिज्ञानाद्वा। शक्यसमुच्छेदत्वेऽपि च शास्त्रविषयस्य ज्ञानस्यानुपायभूतत्वाद्वा,\n सुकरस्योपायान्तरस्य सद्भावाद्वा॥", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000009", "originalText": "तत्र न तावद् दुःखं नास्ति, नाप्यजिहासितमित्युक्तम्— ᳚दुःखत्रयाभिघाताद्᳚\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000010", "originalText": "दुःखानां त्रयं दुःखत्रयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000011", "originalText": "तत् खलु आध्यात्मिकम्, आधिभौतिकम्,\nआधिदैविकञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000012", "originalText": "तत्राध्यात्मिकं द्विविधम्, शारीरं मानसं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000013", "originalText": "शारीरं वातपित्तश्लेष्मणां\nवैषम्यनिमित्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000014", "originalText": "मानसं कामक्रोधलोभमोहभयेर्ष्याविषादविषयविशेषादर्शननिबन्धनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000015", "originalText": "सर्वञ्चैतदान्तरोपायसाध्यत्वादाध्यात्मिकं दुःखम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000016", "originalText": "बाह्योपायसाध्यं दुःखं द्वेधा, आधिभौतिकम्, आधिदैविकञ्च। तत्राधिभौतिकं मानुषपशुसरीसृपस्थावरनिमित्तम्, आधिदैविकं तु—\nयक्षराक्षसविनायकग्रहाद्यावेशनिबन्धनम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000017", "originalText": "तदेतत् प्रत्यात्मवेदनीयं दुःखं रजःपरिणामभेदो न\nशक्यते प्रत्याख्यातुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000018", "originalText": "तदनेन दुःखत्रयेणान्तःकरणवर्तिना\nचेतनाशक्तेः प्रतिकूलवेदनीयतयाऽभिसंबन्धोऽभिघात इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000019", "originalText": "एतावता\nप्रतिकूलवेदनीयत्वं जिहासाहेतुरुक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000020", "originalText": "यद्यपि न सन्निरुध्यते दुःखं,\nतथापि तदभिभवः शक्यः कर्तुमित्युपरिष्टादुपपादयिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000021", "originalText": "तस्मादुपपन्नम् ᳚तदपघातेके हेतौ᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000022", "originalText": "तस्य दुःखत्रयस्य अपघातकः\nतदपघातकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000023", "originalText": "उपसर्जनस्यापि बुद्ध्या सन्निकृष्टस्य तदा परामर्शः। अपघातकश्च हेतुः शास्त्रप्रतिपाद्यो, नान्य इत्याशयः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000024", "originalText": "अत्र शङ्कते— ᳚दृष्टे साऽपार्था चेत्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000025", "originalText": "अयमर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000026", "originalText": "अस्तु तर्हि दुःखत्रयं, जिहासितं च तद् भवतु, भवतु\nच तच्छक्यहानं, सहतां च शास्त्रगम्य उपायस्तदुच्छेत्तुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000027", "originalText": "तथाप्यत्र प्रेक्षावतां जिज्ञासा न युक्ता, दृष्टस्यैवोपायस्य\nतदुच्छेदकस्य सुकरस्य विद्यमानत्वात्, तच्छक्यहानम्, सहतां च\nशास्रगम्य उपायस्तदुच्छेत्तुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000028", "originalText": "तथाऽप्यत्र प्रेक्षावतां जिज्ञासा न\nयुक्ता, दृष्टस्यैवोपायस्य तदुच्छेदकस्य सुकरस्य विद्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000029", "originalText": "तत्त्वज्ञानस्य तु अनेकजन्माभ्यासपरम्पराऽऽयाससाध्यतयाऽतिदुष्करत्वात्। तथा च लौकिकानामाभाणकः—\n'अक्के चेन्मधु विन्देत किमर्थं पर्वतं व्रजेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000030", "originalText": "इष्टस्यार्थस्य संसिद्धौ कि विद्वान् यत्नमाचरेत्'॥", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000031", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000032", "originalText": "सन्ति चोपायाः शतशः शारीरदुःखप्रतीकारायेषत्करा\nभिषजां वरैरुपदिष्टाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000033", "originalText": "मानसस्यापि सन्तापस्य प्रतीकाराय\nमनोज्ञस्त्रीपानभोजनविलेपनवस्त्रालङ्कारादिविषयसम्प्राप्तिरुपायः\nसुकरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000034", "originalText": "एवमाधिभौतिकस्यापि दुःखस्य\nनीतिशास्त्राभ्यासकुशलतानिरत्ययस्थानाध्यासनादिः प्रतीकारहेतुरीषत्करः। तथाऽधिदैविकस्यापि मणिमन्त्रौषधाद्युपयोगः सुकरः प्रतीकारोपाय इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000035", "originalText": "निराकरोति— ᳚न᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000036", "originalText": "कुतः? ᳚एकान्तात्यन्ततोऽभावात्᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000037", "originalText": "एकान्तो—\nदुःखनिवृत्तेरवश्यम्भावः, अत्यन्तो— निवृत्तस्य दुःखस्य\nपुनरुत्पादः, तयोरेकान्तात्यन्तयोरभाव एकान्तात्यन्ततोऽभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000038", "originalText": "षष्ठीस्थाने सार्वविभक्तिकस्तसिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000039", "originalText": "एतदुक्तं भवति यथाविधि\nरसायनादिकामिनीनीतिशास्त्राभ्यासमन्त्राद्युपयोगेऽपि तस्य\nतस्याध्यात्मिकादेर्दुःखस्य निवृत्तेरदर्शनाद् अनैकान्तिकत्वम्,\nनिवृत्तस्यापि पुनरुत्पत्तिदर्शनाद् अनात्यन्तिकत्वम्, इति सुकरोऽपि\nऐकान्तिकात्यन्तिकदुःखनिवृत्तेर्न दृष्ट उपाय इति नापार्था\nजिज्ञासेत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000040", "originalText": "यद्यपि दुःखममङ्गलम्, तथापि तत्परिहारार्थत्वेन तदपघातो\nमङ्गलमेवेति युक्तं शास्त्रादौ तत्कीर्तनमिति॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000041", "originalText": "कारिका २\n\nस्यादेतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000042", "originalText": "मा भूद् दृष्ट उपायः, वैदिकस्तु ज्योतिष्टोमादिः\nसहस्रसंवत्सरपर्यन्तः कर्मकलापस्तापत्रयमेकान्तमत्यन्तञ्चापनेष्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000043", "originalText": "श्रुतिश्च— ᳚स्वर्गकामो यजेत᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000044", "originalText": "स्वर्गश्च—\n᳚यन्न दुःखेन सम्भिन्नं न च ग्रस्तमनन्तरम्। अभिलाषोपनीतं च तत् सुखं स्वःपदास्पदम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000045", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000046", "originalText": "(तन्त्रवार्तिकम्)\nदुःखविरोधी सुखविशेषश्च स्वर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000047", "originalText": "स च\nस्वसत्तया समूलघातमपहन्ति दुःखम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000048", "originalText": "न चैष\nक्षयी।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000049", "originalText": "तथा हि श्रूयते— 'अपाम सोमममृता अभूम᳚\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000050", "originalText": "तत्क्षये कुतोऽस्यामृतत्वसम्भवः? तस्माद्वैदिकस्योपायस्य\nतापत्रयप्रतीकारहेतोर्मुहूर्तयामाहोरात्रमाससंवत्सरनिर्वर्तनीयस्यानेकजन्मपरम्परायाससम्पादनीयात्\nविवेकज्ञानाद् ईषत्करत्वात् पुनरपि व्यर्था जिज्ञासा इत्याशङ्क्याह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000051", "originalText": "दृष्टवदानुश्रविकः, स ह्यविशुद्धिक्षयातिशययुक्तः। तद्विपरीतः श्रेयान् व्यक्ताव्यक्तज्ञविज्ञानात्॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000052", "originalText": "᳚दृष्ट᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000053", "originalText": "गुरुपाठादनुश्रूयते इत्यनुश्रवो वेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000054", "originalText": "एतदुक्तं भवति—\n'श्रूयत एव परं न केनापि क्रियते' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000055", "originalText": "तत्र भव आनुश्रविकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000056", "originalText": "तत्र प्राप्तो ज्ञात इति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000057", "originalText": "आनुश्रविकोऽपि कर्मकलापो दृष्टेन तुल्यो\nवर्तते, ऐकान्तिकात्यन्तिकदुःखप्रतीकारानुपायत्वस्योभयत्रापि तुल्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000058", "originalText": "यद्यपि च ᳚आनुश्रविकः᳚ इति सामान्याभिधानम्, तथापि कर्मकलापाभिप्रायं\nद्रष्टव्यम्, विवेकज्ञानस्याप्यानुश्रविकत्वात्। तथा च श्रूयते—\n᳚आत्मा वाऽरे ज्ञातव्यः प्रकृतितो विवेक्तव्यः᳚ (बृहदारण्यक २.४.५),\n᳚न स पुनरावर्तते᳚ (छान्दोग्य ८.१५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000059", "originalText": "अस्यां प्रतिज्ञायां हेतुमाह— ᳚स ह्यविशुद्धिक्षयातिशययुक्तः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000060", "originalText": "᳚अविशुद्धिः᳚ सोमादियागस्य पशुबीजादिवधसाधनता।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000061", "originalText": "यथाऽऽह\nस्म भगवान् पञ्चशिखाचार्यः— ᳚स्वल्पः सङ्करः सपरिहारः\nसप्रत्यवमर्षः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000062", "originalText": "'स्वल्पः सङ्करो' ज्योतिष्टामादिजन्मनः\nप्रधानापूर्वस्य स्वल्पेन पशुहिंसादिजन्मनाऽनर्थहेतुनाऽपूर्वेण सङ्करः।", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000063", "originalText": "'सपरिहारः' कियताऽपि प्रायश्चित्तेन परिहर्तुं शक्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000064", "originalText": "अथ च प्रमादतः प्रायश्चित्तमपि नाचरितम्, प्रधानकर्मविपाकसमये\nस पच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000065", "originalText": "तथाऽपि यावदसावनर्थं सूते तावत् प्रत्यवमर्षेण\nसहिष्णुतया सह वर्तत इति ᳚सप्रत्यवमर्षः᳚। मृष्यन्ते हि\nपुण्यसम्भारोपनीतस्वर्गसुधामहाहृदावगाहिनः कुशलाः पापमात्रोपसादितां\nदुःखवह्निकणिकाम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000066", "originalText": "न च— ᳚मा हिंस्यात् सर्वा भूतानि᳚ इति सामान्यशास्त्रं विशेषशास्त्रेण\n᳚अग्नीषोमीयं पशुमालभेत᳚ इत्यनेन बाध्यते— इति युक्तम्, विरोधाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000067", "originalText": "विरोधे हि बलीयसा दुर्बलो बाध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000068", "originalText": "न चेहास्ति कश्चिद्विरोधः,\nभिन्नविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000069", "originalText": "तथा हि— ᳚न हिंस्याद्᳚ इति निषेधेन हिंसाया अनर्थहेतुभावो ज्ञाप्यते, न\nत्वक्रत्वर्थत्वमपि, ᳚अग्नीषोमीयं पशुमालभेत᳚ इत्यनेन तु पशुहिंसायाः\nक्रत्वर्थमुच्यते, नानर्थहेतुत्वाभावः, तथा सति वाक्यभेदप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000070", "originalText": "न चानर्थहेतुत्वक्रतूपकारकत्वयोः कश्चिद्विरोधोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000071", "originalText": "हिंसा हि\nपुरुषस्य दोषमावक्ष्यति, क्रतोश्चोपकरिष्यतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000072", "originalText": "क्षयातिशयौ च फलगतावप्युपाये उपचरितौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000073", "originalText": "क्षयित्वं च स्वर्गादेः\n'सत्त्वे सति कार्यत्वात्' अनुमितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000074", "originalText": "ज्योतिष्टोमादयः स्वर्गमात्रस्य साधनम्,\nवाजपेयादयस्तु स्वाराज्यस्येत्यतिशययुक्तत्वम्। परसम्पदुत्कर्षो हि\nहीनसम्पदं पुरुषं दुःखाकरोति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000075", "originalText": "᳚अपाम सोमममृता अभूम᳚ इति चामृतत्वाभिधानम्\nचिरस्थेमानमुपलक्षयति। यदाहुः—\n\n᳚आभूतसम्प्लवं स्थानममृतत्वं हि भाष्यते᳚ इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000076", "originalText": "अत एव च श्रुतिः—\n᳚न कर्मणा न प्रजया धनेन त्यागेनैकेनामृतत्वमानशुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000077", "originalText": "परेण नाकं निहितं गुहायां विभ्राजते यद्यतयो विशन्ति᳚ इति (महानारायण,\n१०।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000078", "originalText": "५)।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000079", "originalText": "तथा ᳚कर्मणा मृत्युमृषयो निषेदुः प्रजावन्तो द्रविणमीहमानाः। तथा परे ऋषयो ये मनीषिणः परं कर्मभ्योऽमृतत्वमानशुः᳚ इति\nच॥", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000080", "originalText": "तदेतत् सर्वमभिप्रेत्याह— ᳚तद्विपरीतः श्रेयान्, व्यक्ताव्यक्तज्ञविज्ञानात्᳚\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000081", "originalText": "तस्मात्— आनुश्रविकात् दुःखपघातकोपायात् सोमपानादेरविशुद्धाद्\nअनित्यसातिशयफलात् विपरीतः विशुद्धः हिंसादिसङ्कराभावात्,\nनित्यनिरतिशयफलः, असकृत् पुनरावृत्तिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000082", "originalText": "न च\nकार्यत्वेनानित्यता फलस्य युक्ता, भावकार्यस्य तथात्वात्, दुःखप्रध्वंसस्य\nतु कार्यस्यापि तद्वैपरीत्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000083", "originalText": "न च दुःखान्तरोत्पादः, कारणाप्रवृत्तौ\nकार्यस्यानुत्पादात्, विवेकज्ञानोपजननपर्यन्तत्वाच्च कारणप्रवृत्तेः। एतच्चोपरिष्टादुपपादयिष्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000084", "originalText": "अक्षरार्थस्तु— तस्मात्— आनुश्रविकात् दुःखापघातकाद् हेतोः, विपरीतः—\nसत्त्वपुरुषान्यताप्रत्ययः साक्षात्कारो दुःखापघातको हेतुः, अत एव श्रेयान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000085", "originalText": "आनुश्रविको हि वेदविहितत्वात् मात्रया दुःखापघातकत्वाच्च प्रशस्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000086", "originalText": "सत्त्वपुरुषान्यताप्रत्ययोऽपि प्रशस्यः। तदनयोः प्रशस्ययोर्मध्ये\nसत्त्वपुरुषान्यताप्रत्ययः श्रेयान्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000087", "originalText": "कुतः पुनरस्योत्पत्तिः? इत्यत आह— ᳚व्यक्ताव्यक्तज्ञविज्ञानात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000088", "originalText": "व्यक्तं च अव्यक्तं च ज्ञश्च व्यक्ताव्यक्तज्ञाः, तेषां विज्ञानं\nविवेकेन ज्ञानम्, व्यक्ताव्यक्तज्ञविज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000089", "originalText": "व्यक्तज्ञानपूर्वकमव्यक्तस्य\nतत्कारणस्य ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000090", "originalText": "तयोः पारार्थ्येनात्मा परो ज्ञायते, इति\nज्ञानक्रमेणाभिधानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000091", "originalText": "एतदुक्तं भवति— श्रुतिस्मृतीतिहासपुराणेभ्यो व्यक्तादीन् विवेकेन श्रुत्वा,\nशास्त्रयुक्त्या च व्यवस्थाप्य, दीर्घकालादरनैरन्तर्यसत्कारसेवितात्\nभावनामयात् विज्ञानमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000092", "originalText": "तथा च वक्ष्यति—\nएवं तत्त्वाभ्यासान्नास्मि न मे नाहमित्यपरिशेषम्। अविपर्ययाद्विशुद्धं केवलमुत्पद्यते ज्ञानम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000093", "originalText": "इति(कारिका\n६४)॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000094", "originalText": "कारिका ३\n\nतदेवं प्रेक्षावदपेक्षितार्थत्वेन शास्त्रारम्भं समाधाय\nशास्त्रमारभमाणः श्रोतृबुद्धिसमवधानाय तदर्थं संक्षेपतः\nप्रतिजानीते—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000095", "originalText": "मूलप्रकृतिरविकृतिर्महदाद्याः प्रकृतिविकृतयः सप्त। षोडशकस्तु विकारो, न प्रकृतिर्न विकृतिः पुरुषः॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000096", "originalText": "संक्षेपतो हि शास्त्रार्थस्य चतस्रो विधाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000097", "originalText": "कश्चिदर्थः प्रकृतिरेव,\nकश्चिदर्थो विकृतिरेव, कश्चित्प्रकृतिविकृतिः, कश्चिदनुभयरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000098", "originalText": "तत्र का प्रकृतिः? इत्युक्तम्— ᳚मूलप्रकृतिरविकृतिः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000099", "originalText": "प्रकरोतीति प्रकृतिः प्रधानम्, सत्त्वरजस्तमसां साम्यावस्था, सा\nअविकृतिः, प्रकृतिरेवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000100", "originalText": "कुतः? इत्युक्तम्, ᳚मूलेति᳚ मूलञ्चासौ\nप्रकृतिश्चेति मूलप्रकृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000101", "originalText": "विश्वस्य कार्यसङ्घातस्य सा मूलम्, न\nत्वस्या मूलान्तरमस्ति, अनवस्थाप्रसङ्गात्। न चानवस्थायां प्रमाणमस्तीति\nभावः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000102", "originalText": "कतमाः पुनः प्रकृतिविकृतयः, कियत्यश्च? इत्यत उक्तम्— ᳚महदाद्याः\nप्रकृतिविकृतयः सप्त᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000103", "originalText": "प्रकृतयश्च विकृतयश्च ता इति\nप्रकृतिविकृतयः सप्त।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000104", "originalText": "तथा हि— महत्तत्त्वमहङ्कारस्य प्रकृतिः, विकृतिश्च मूलप्रकृतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000105", "originalText": "एवमहङ्कारतत्त्वं तन्मात्राणामिन्द्रियाणां च प्रकृतिः विकृतिश्च\nमहतः। एवं पञ्चतन्मात्राणि तत्त्वानि भूतानामाकाशादीनां प्रकृतयो\nविकृतयश्चाहङ्कारस्य॥", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000106", "originalText": "अथ का विकृतिरेव, कियती चेत्यत उक्तम्— ᳚षोडशकस्तु विकारः᳚\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000107", "originalText": "षोडशसंख्यापरिमितो गणः षोडशकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000108", "originalText": "तुशब्दोऽवधारणे\nभिन्नक्रमश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000109", "originalText": "पञ्चमहाभूतानि एकादश इन्द्रियाणि चेति षोडशको गणो\nविकार एव, न प्रकृतिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000110", "originalText": "यद्यपि च पृथिव्यादीनां गोघटवृक्षादयो\nविकाराः, एवं तद्विकारभेदानां पयोबीजादीनां दध्यङ्कुरादयः, तथाऽपि\nगवादयो बीजादयो वा न पृथिव्यादिभ्यस्तत्त्वान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000111", "originalText": "'तत्त्वान्तरोपादानत्वं\nच प्रकृतित्वम्' इहाभिप्रेतमिति न दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000112", "originalText": "सर्वेषां गोघटादीनां\nस्थूलतेन्द्रियग्राह्यता च समेति न तत्त्वान्तरत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000113", "originalText": "अनुभयरूपमुक्तं, तदाह— ᳚न प्रकृतिर्न विकृतिः पुरुषः᳚ इति। एतच्च सर्वमुपरिष्टादुपपादयिष्यते॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000114", "originalText": "कारिका ४\n\nतमिममर्थं प्रामाणिकं कर्तुमभिमताः प्रमाणभेदा लक्षणीयाः। न च\nसामान्यलक्षणमन्तरेण शक्यते विशेषलक्षणं कर्तुमिति प्रमाणसामान्यं\nतावल्लक्षयति—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000115", "originalText": "दृष्टमनुमानमाप्तवचनं च, सर्वप्रमाणसिद्धत्वात्। त्रिविधं प्रमाणमिष्टं प्रमेयसिद्धिः प्रमाणाद्धि॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000116", "originalText": "अत्र च 'प्रमाणम्' इति समाख्यया लक्ष्यपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000117", "originalText": "तन्निर्वचनं च\nलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000118", "originalText": "प्रमीयतेऽनेनेति निर्वचनात् प्रमां प्रति करणत्वमवगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000119", "originalText": "असन्दिग्धाविपरीतानधिगतविषया चित्तवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000120", "originalText": "बोधश्च\nपौरुषेयः फलं प्रमा।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000121", "originalText": "तत्साधनं प्रमाणमिति। एतेन\nसंशयविपर्ययस्मृतिसाधनेष्वप्रमाणेष्वप्रसङ्गः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000122", "originalText": "संख्याविप्रतिपत्तिं निराकरोति— ᳚त्रिविधम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000123", "originalText": "तिस्रो विधा अस्य\nप्रमाणसामान्यस्य तत् त्रिविधं, न न्यूनं, नाप्यधिकमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000124", "originalText": "विशेषलक्षणानन्तरं चैतदुपपादयिष्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000125", "originalText": "कतमाः पुनस्ता विधा? इत्यत आह— ᳚दृष्टमनुमानमाप्तवचनं च᳚\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000126", "originalText": "एतच्च लौकिकप्रमाणाभिप्रायम्, लोकव्युत्पादनार्थत्वाच्छास्त्रस्य,\nतस्यैवात्राधिकारात्। आर्षं तु विज्ञानं योगिनामूर्ध्वस्रोतसां न\nलोकव्युत्पादनायालमिति सदपि नाभिहितम्, अनधिकारात्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000127", "originalText": "स्यादेतत्— मा भून्न्यूनम्, अधिकं तु कस्मान्न भवति, सङ्गिरन्ते हि\nप्रतिवादिन उपमानादीन्यपि प्रमाणानि, इत्यत आह— ᳚सर्वप्रमाणसिद्धत्वात्᳚\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000128", "originalText": "एष्वेव दृष्टानुमानाप्तवचनेषु सर्वेषां प्रमाणानां सिद्धत्वात्—\nअन्तर्भावादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000129", "originalText": "एतच्चोपपादयिष्यत इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000130", "originalText": "अथ प्रमेयव्युत्पादनाय प्रवृत्तं शास्त्रं कस्मात् प्रमाणं सामान्यतो\nविशेषतश्च लक्षयति? इत्यत आह— ᳚प्रमेयसिद्धिः प्रमाणाद्धि᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000131", "originalText": "सिद्धिः प्रतीतिः। सेयमार्याऽर्थक्रमानुरोधेन पाठक्रममनादृत्यैव व्याख्याता॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000132", "originalText": "कारिका ५\n\nसम्प्रति प्रमाणविशेषलक्षणावसरे प्रत्यक्षस्य प्रमाणेषु ज्येष्ठत्वात्\nतदधीनत्वाच्चानुमानादीनां, सर्ववादिनामविप्रतिपत्तेश्च, तदेव\nतावल्लक्षयति—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000133", "originalText": "प्रतिविषयाध्यवसायो दृष्टं, त्रिविधमनुमानमाख्यातम्। तल्लिङ्गलिङ्गिपूर्वकमाप्तश्रुतिराप्तवचनं तु॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000134", "originalText": "᳚प्रतिविषयाध्यवसायो दृष्टम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000135", "originalText": "अत्र ᳚दृष्टम्᳚ इति\n लक्ष्यनिर्देशः, परिशिष्टं तु लक्षणम्। समानासमानजातीयव्यवच्छेदो\n लक्षणार्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000136", "originalText": "अवयवार्थस्तु— विसिन्वन्ति विषयिणमनुबध्नन्ति स्वेन रूपेण\nनिरूपणीयं कुर्वन्तीति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000137", "originalText": "᳚विषयाः᳚ पृथिव्यादयः सुखादयश्च,\nअस्मदादीनामविषयाः तन्मात्रलक्षणाः योगिनामूर्ध्वस्रोतसां च विषयाः,\nविषयं विषयं प्रति वर्तत इति प्रतिविषयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000138", "originalText": "वृत्तिश्च सन्निकर्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000139", "originalText": "अर्थसन्निकृष्टमिन्द्रियमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000140", "originalText": "तस्मिन् अध्यवसायः, तदाश्रित\nइत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000141", "originalText": "अध्यवसायश्च बुद्धिव्यापारो ज्ञानम्, उपात्तविषयाणामिन्द्रियाणां\nवृत्तौ सत्यां बुद्धेस्तमोऽभिभवे सति यः सत्त्वसमुद्रेकः,\nसोऽध्यवसाय इति वृत्तिरिति ज्ञानमिति चाख्यायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000142", "originalText": "इदं तत् प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000143", "originalText": "अनेन यश्चेतनाशक्तेरनुग्रहस्तत्फलं, प्रमा बोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000144", "originalText": "बुद्धितत्त्वं हि प्राकृतत्वादचेतनमिति तदीयोऽध्यवसायोऽप्यचेतनः\nघटादिवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000145", "originalText": "एवं बुद्धितत्त्वस्य सुखादयोऽपि परिणामभेदा अचेतनाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000146", "originalText": "पुरुषस्तु सुखाद्यननुषङ्गी चेतनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000147", "originalText": "सोऽयं बुद्धितत्त्ववर्तिना\nज्ञानसुखादिना तत्प्रतिबिम्बितस्तच्छायापत्त्या ज्ञानसुखादिमानिव\nभवतीति चेतनोऽनुगृह्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000148", "originalText": "चितिच्छायापत्त्या चाचेतनाऽपि\nबुद्धिस्तदध्यवसायोऽप्यचेतनश्चेतनवद् भवतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000149", "originalText": "तथा च वक्ष्यति—\nतस्मात्तत्संयोगादचेतनं चेतनावदिव लिङ्गम्। गुणकर्तृत्वेऽपि तथा कर्तेव भवत्युदासीनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000150", "originalText": "(का० २१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000151", "originalText": "अत्राध्यवसायग्रहणेन संशयं व्यवच्छिनत्ति,\nसंशयस्यानवस्थितग्रहणेनानिश्चितरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000152", "originalText": "निश्चयोऽध्यवसाय\nइति चानर्थान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000153", "originalText": "विषयग्रहणेन चासद्विषयं विपर्ययमपाकरोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000154", "originalText": "प्रतिग्रहणेन चेन्द्रियार्थसन्निकर्षसूचनादनुमानस्मृत्यादयः पराकृता\nभवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000155", "originalText": "तदेवं समानासमानजातीयव्यवच्छेदकत्वात् ᳚प्रतिविषयाध्यवसायः᳚ इति\nदृष्टस्य सम्पूर्णं लक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000156", "originalText": "तन्त्रान्तरेषु लक्षणान्तराणि तैर्थिकानां\nन दूषितानि, विस्तरभयादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000157", "originalText": "'नानुमानं प्रमाणम्'इति वदता लोकायतिकेनाप्रतिपन्नः सन्दिग्धो विपर्यस्तो वा\nपुरुषः कथं प्रतिपद्येत? न च पुरुषान्तरगता अज्ञानसन्देहविपर्ययाः\nशक्या अर्वाग्दृशा प्रत्यक्षेण प्रतिपत्तुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000158", "originalText": "नापि प्रमाणान्तरेण,\nअनभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000159", "originalText": "अनवधृताज्ञानसंशयविपर्ययस्तु यं कञ्चन पुरुषं\nप्रति वर्तमानोऽनवधेयवचनतया प्रेक्षावद्भिरुन्मत्तवदुपेक्ष्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000160", "originalText": "तदनेनाज्ञानादयः परपुरुषवर्तिनोऽभिप्रायभेदाद्वचनभेदाद् वा\nलिङ्गादनुमातव्याः, इत्यकामेनाप्यनुमानं प्रमाणमभ्युपेयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000161", "originalText": "तत्र प्रत्यक्षकार्यत्वादनुमानं प्रत्यक्षानन्तरं लक्षणीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000162", "originalText": "तत्रापि सामान्यलक्षणपूर्वकत्वाद्विशेषलक्षणस्येत्यनुमानसामान्यं\nतावल्लक्षयति— ᳚तल्लिङ्गलिङ्गिपूर्वकम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000163", "originalText": "लिङ्गं व्याप्यं, लिङ्गि\nव्यापकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000164", "originalText": "शङ्कितसमारोपितोपाधिनिराकरणेन च वस्तुस्वभावप्रतिबद्धं\nव्याप्यम्, येन च प्रतिबद्धं, तद्व्यापकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000165", "originalText": "लिङ्गलिङ्गिग्रहणेन\nच विषयवाचिना विषयिणं प्रत्ययमुपलक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000166", "originalText": "'धूमादिर्व्याप्यो\nवह्न्यादिर्व्यापकः' इति यः प्रत्ययस्तत्पूर्वकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000167", "originalText": "लिङ्गिग्रहणं चावर्तनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000168", "originalText": "तेन च लिङ्गमस्यास्तीति पक्षधर्मताज्ञानमपि दर्शितं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000169", "originalText": "तत्\n'व्याप्यव्यापकभावपक्षधर्मताज्ञानपूर्वकमनुमानम्'इति— अनुमानसामान्यं\nलक्षितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000170", "originalText": "अनुमानविशेषान् तन्त्रान्तरलक्षितान् अभिमतान् स्मारयति—\n᳚त्रिविधमनुमानमाख्यातम्᳚ इति, तत् सामान्यतो लक्षितमनुमानं\nविशेषतस्त्रिविधं, पूर्ववत्, शेषवत्, सामान्यतो दृष्टञ्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000171", "originalText": "तत्र प्रथमं तावत् द्विविधं— वीतमवीतं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000172", "originalText": "अन्वयमुखेन प्रवर्तमानं\nविधायकं वीतम्, व्यतिरेकमुखेन प्रवर्तमानं निषेधकमवीतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000173", "originalText": "तत्रावीतं शेषवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000174", "originalText": "शिष्यते परिशिष्या इति शेषः, स एव विषयतया\nयस्यास्त्यनुमानज्ञानस्य तच्छेषवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000175", "originalText": "यदाहुः— 'प्रसक्तप्रतिषेधे,\nअन्यत्राप्रसङ्गात् शिष्यमाणे सम्प्रत्ययः परिशेषः' इति (न्यायभाष्यम्)।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000176", "originalText": "अस्य चावीतस्य व्यतिरेकिण उदाहरणमग्रेऽभिधास्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000177", "originalText": "वीतं च द्वेधा— पूर्ववत्, सामान्यतो दृष्टं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000178", "originalText": "तत्रैकं\nदृष्टस्वलक्षणसामान्यविषयं यत् तत्पूर्ववत्, पूर्वं प्रसिद्धं\nदृष्टस्वलक्षणसामान्यमिति यावत्, तदस्य विषयत्वेनास्त्यनुमानस्येति\nपूर्ववत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000179", "originalText": "यथा धूमात् वह्नित्वसामान्यविशेषः पर्वतेऽनुमीयते, तस्य\nवह्नित्वसामान्यविशेषस्य स्वलक्षणं वह्निविशेषो दृष्टो रसवत्थाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000180", "originalText": "अपरं च वीतं सामान्यतो दृष्टम्— अदृष्टस्वलक्षणसामान्यविषयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000181", "originalText": "यथेन्द्रियविषयमनुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000182", "originalText": "अत्र हि रूपादिविज्ञानानां क्रियात्वेन\nकरणवत्त्वमनुमीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000183", "originalText": "यद्यपि करणत्वसामान्यस्य छिदादौ\nवास्यादि स्वलक्षणमुपलब्धम्, तथाऽपि यज्जातीयं रूपादिज्ञाने\nकरणवत्त्वमनुमीयते तज्जातीयस्य करणस्य न दृष्टं स्वलक्षणं\nप्रत्यक्षेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000184", "originalText": "इन्द्रियजातीयं हि तत्करणम्, नचेन्द्रियत्वसामान्यस्य\nस्वलक्षणमिन्द्रियविशेषः प्रत्यक्षगोचरोऽर्वाग्दृशाम्, यथा\nवह्नित्वसामान्यस्य स्वलक्षणं वह्निः।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000185", "originalText": "सोऽयं पूर्ववतः सामान्यतोदृष्टात्\nसत्यपि वीतत्वेन तुल्यत्वे विशेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000186", "originalText": "अत्र च दृष्टं दर्शनम्,\nसामान्यत इति सामान्यस्य, सार्वविभक्तिकस्तसिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000187", "originalText": "अदृष्टस्वलक्षणस्य\nसामान्यविशेषस्य दर्शनं सामान्यतोदृष्टमनुमानमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000188", "originalText": "सर्वं चैतदस्माभिर्न्यायवार्तिकतात्पर्यटीकायां व्युत्पादितमिति नेहोक्तं\nविस्तरभयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000189", "originalText": "प्रयोजकवृद्धशब्दश्रवणसमनन्तरं\nप्रयोज्यवृद्धप्रवृत्तिहेतुज्ञानानुमानपूर्वकत्वाच्छब्दार्थसम्बन्धग्रहणस्य,\nस्वार्थसम्बन्धज्ञानसहकारिणश्च\nशब्दस्यार्थप्रत्यायकत्वादनुमानपूर्वकत्वमित्यनुमानान्तरं\nशब्दं लक्षयति— ᳚आप्तश्रुतिराप्तवचनं तु᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000190", "originalText": "आप्तवचनमिति\nलक्ष्यनिर्देशः, परिशिष्टं लक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000191", "originalText": "आप्ता प्राप्ता युक्तेति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000192", "originalText": "आप्ता\nचासौ श्रुतिश्चेति आप्तश्रुतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000193", "originalText": "श्रुतिः— वाक्यजनितं वाक्यार्थज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000194", "originalText": "तच्च स्वतःप्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000195", "originalText": "अपौरुषेयवेदवाक्यजनितत्वेन\nसकलदोषाशङ्काविनिर्मुक्तेर्युक्तं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000196", "originalText": "एवं\nवेदमूलस्मृतीतिहासपुराणवाक्यजनितमपि ज्ञानं युक्तं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000197", "originalText": "आदिविदुषश्च कपिलस्य कल्पादौ कल्पान्तराधीतश्रुतिविस्मरणसम्भवः,\nसुप्तप्रबुद्धस्येव पूर्वेद्युरवगतानामर्थानामपरेद्युः।", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000198", "originalText": "तथा च आवट्यजैगीषव्यसंवादे भगवान् जैगीषव्यो\nदशमहाकल्पवर्तिजन्मस्मरणमात्मन उवाच ᳚ दशसु महाकल्पेषु\nविपरिवर्तमानेन मया᳚ इत्यादिना ग्रन्थसन्दर्भेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000199", "originalText": "आप्तग्रहणेनायुक्ताः शाक्यभिक्षुनिर्ग्रन्थकसंसारमोचकादिनामागमाभासाः\nपरिहृता भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000200", "originalText": "अयुक्तत्वं चैतेषां विगानात् विच्छिन्नमूलत्वात्\nप्रमाणविरुद्धार्थाभिधानाच्च, कैश्चिदेव म्लेच्छादिभिः पुरुषापसदैः\nपशुप्रायैः परिग्रहाद्बोद्धव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000201", "originalText": "तुशब्देनानुमानाद्व्यवच्छिनत्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000202", "originalText": "वाक्यार्थो हि प्रमेयः, न\nतु तद्धर्मो वाक्यम्, येन तत्र लिङ्गं भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000203", "originalText": "न च वाक्यं\nवाक्यार्थं बोधयत् सम्बन्धग्रहणमपेक्षते, अभिनवकविरचितस्य\nवाक्यस्यादृष्टपूर्वस्याननुभूतचरवाक्यार्थबोधकत्वादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000204", "originalText": "एवं प्रमाणसामान्यलक्षणेषु तद्विशेषलक्षणेषु च सत्सु, यानि\nप्रमाणान्तराण्युपमानादीनि प्रतिवादिभिरभ्युपेयन्ते तान्युक्तलक्षणेष्वेव\nप्रमाणेष्वन्तर्भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000205", "originalText": "तथा हि— उपमानं तावत् 'यथा गौस्तथा गवयः' इति वाक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000206", "originalText": "तज्जनिता\nधीरागम एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000207", "originalText": "योऽप्ययं 'गवयशब्दो गोसदृशस्य वाचकः' इति\nप्रत्ययः, सोऽप्यनुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000208", "originalText": "यो हि शब्दो यत्र वृद्धैः प्रयुज्यते,\nसोऽसति वृत्त्यन्तरे, तस्य वाचकः, यथा गोशब्दो गोत्वस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000209", "originalText": "प्रयुज्यते चैवं गवयशब्दो गोसदृशे, इति तस्यैव वाचक\nइति तत् ज्ञानमनुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000210", "originalText": "यत्तु गवयस्य चक्षुःसन्निकृष्टस्य\nगोसादृश्यज्ञानं तत् प्रत्यक्षमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000211", "originalText": "अत एव स्मर्यमाणायां गवि\nगवयसादृश्यज्ञानं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000212", "originalText": "न त्वन्यद्गवि सादृश्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000213", "originalText": "अन्यच्च गवये।", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000214", "originalText": "भूयोऽवयवसामान्ययोगो हि जात्यन्तरवर्ती जात्यन्तरे\nसादृश्यमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000215", "originalText": "सामान्ययोगश्चैकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000216", "originalText": "स चेद्गवये प्रत्यक्षः,\nगव्यपि तथेति नोपमानस्य प्रमेयान्तरमस्ति, यत्र प्रमाणान्तरमुपमानं\nभवेत्, इति न प्रमाणान्तरमुपमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000217", "originalText": "एवमर्थापत्तिरपि न प्रमाणान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000218", "originalText": "तथा हि— जीवतश्चैत्रस्य गृहाभावदर्शनेन बहिर्भावस्यादृष्टस्य\nकल्पनमर्थापत्तिरभिमता वृद्धानाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000219", "originalText": "साऽप्यनुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000220", "originalText": "यदा\nखल्वव्यापकः सन्नेकत्र नास्ति तदाऽन्यन्नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000221", "originalText": "यदाऽव्यापक एकत्रास्ति\nतदाऽन्यत्र नास्ति, इति सुकरः स्वशरीरे व्याप्तिग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000222", "originalText": "तथा च\nसतो गृहाभावदर्शनेन लिङ्गेन बहिर्भावदर्शनमनुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000223", "originalText": "न च चैत्रस्य क्वचित्सत्त्वेन गृहाभावः शक्योऽपह्नोतुम्,\nयेनासिद्धो गृहाभावो बहिर्भावे न हेतुः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000224", "originalText": "न च गृहाभावेन वा\nसत्त्वमपह्नूयते, येन सत्त्वमेवानुपपद्यमानमात्मानं न बहिरवस्थापयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000225", "originalText": "तथा हि— चैत्रस्य गृहासत्त्वेन सत्त्वमात्रं विरुध्यते, गृहसत्त्वं\nवा? न तावद्यत्र क्वचन सत्त्वस्यास्ति विरोधो गृहासत्त्वेन,\nभिन्नविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000226", "originalText": "देशसामान्येन गृहविशेषाक्षेपिऽपि पाक्षिक इति\nसामान्यविषयतया विरोध इति चेत्, प्रमाणविनिश्चितस्य गृहेऽसत्त्वस्य\nपाक्षिकतया सांशयिकेन गृहसत्त्वेन प्रतिक्षपायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000227", "originalText": "नापि\nप्रमाणनिश्चितो गृहाभावः पाक्षिकमस्य गृहसत्त्वं प्रतिक्षिपन्\nसत्त्वमपि प्रतिक्षेप्तुं सांशयिकत्वं च व्यपनेतुर्महतीति युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000228", "originalText": "गृहावच्छिन्नेन चैत्राभावेन गृहसत्त्वं विरुद्ध्यते, न तु\nसत्त्वमात्रम्, तस्य तत्रौदासीन्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000229", "originalText": "तस्माद्गृहाभावेन लिङ्गेन सिद्धेन\nसतो बहिर्भावोऽनुमीयत इति युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000230", "originalText": "एतेन— 'विरुद्धयोः\nप्रमाणयोर्विषयव्यवस्थयाऽविरोधापादनमर्थापत्तेर्विषयः'\nइति निरस्तम्, अवच्छिन्नानवच्छिन्नयोर्विरोधाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000231", "originalText": "उदाहरणान्तराणि चार्थापत्तेरेवमेवानुमानेऽन्तर्भावनीयानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000232", "originalText": "तस्मान्नानुमानात्प्रमाणान्तरमर्थापत्तिरिति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000233", "originalText": "एवमभावोऽपि प्रत्यक्षमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000234", "originalText": "न हि भूतलस्य परिणामविशेषात्\nकैवल्यलक्षणादन्यो घटाभावो नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000235", "originalText": "प्रतिक्षणपरिणामिनो हि सर्वे\nएव भावाः, ऋते चितिशक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000236", "originalText": "स च परिणामभेद ऐन्द्रियक इति नास्ति\nप्रत्यक्षानवरुद्धो विषयो यत्राऽभावाह्वयं प्रमाणान्तरमभ्युपेयेतेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000237", "originalText": "सम्भवस्तु, यथा खार्यां द्रोणाढकप्रस्त्याद्यवगमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000238", "originalText": "स चानुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000239", "originalText": "खारीत्वं हि द्रोणाद्यविनाभूतं प्रतीतं खार्यां द्रोणादिसत्त्वमवगमयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000240", "originalText": "यच्चानिर्दिष्टप्रवक्तृकं प्रवादपारम्पर्यमात्रम्— 'इति होचुर्वृद्धाः'\nइत्यैतिह्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000241", "originalText": "यथा 'इह वटे यक्षः प्रतिवसति' इति, न तत् प्रमाणान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000242", "originalText": "अनिर्दिष्टप्रवक्तृकत्वेन सांशयिकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000243", "originalText": "आप्तवक्तृकत्वनिश्चये\nत्वागम एव, इत्युपपन्नं ᳚त्रिविधम्प्रमाणम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000244", "originalText": "कारिका ६\n\nएवं तावद्व्यक्ताव्यक्तज्ञलक्षणप्रमेयसिद्ध्यर्थं प्रमाणानि लक्षितानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000245", "originalText": "तत्र व्यक्तं पृथिव्यादि स्वरूपतः पांसुलपादो हालिकोऽपि प्रत्यक्षतः\nप्रतिपद्यते, पूर्ववता चानुमानेन धूमादिदर्शनात् वह्न्यादीनि चेति,\nतद्व्युत्पादनाय मन्दप्रयोजनं शास्त्रमिति दुरधिगममनेन व्युत्पाद्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000246", "originalText": "तत्र यत् प्रमाणं यत्र शक्तं तदुक्तलक्षणेभ्यः प्रमाणेभ्यो निष्कृष्य\nदर्शयति—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000247", "originalText": "सामान्यतस्तु दृष्टात् अतीन्द्रियाणां प्रतीतिरनुमानात्। तस्मादपि चासिद्धम् परोक्षाप्तागमात् सिद्धम्॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000248", "originalText": "᳚सामान्यतः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000249", "originalText": "तुशब्दः प्रत्यक्षपूर्ववद्भ्यां विशिनष्टि।", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000250", "originalText": "सामान्यतोदृष्टादनुमानादतीन्द्रियाणां प्रधानपुरुषादीनां प्रतीतिः— चितिच्छायापत्तिर्बुद्धेरध्यवसाय इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000251", "originalText": "उपलक्षणं\nचैतत्, शेषवत इत्यपि द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000252", "originalText": "तत्किं सर्वेष्वतीन्द्रियेषु\nसामान्यतोदृष्टमेव प्रवर्त्तते? तथा च यत्र तन्नासि,\nमहदाद्यारम्भक्रमे स्वर्गापूर्वदेवतादौ च, तत्र तेषामभावः प्राप्त\nइत्यत आह— ᳚तस्मादपि᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000253", "originalText": "तस्मादपीत्येतावतैव सिद्धे चकारेण\nशेषवत् इत्यपि समुच्चितम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000254", "originalText": "कारिका ७\n\nस्यादेतत्, यथा गगनकुसुमकूर्मरोमशशविषाणाद्षु\nप्रत्यक्षमप्रवर्तमानं तदभावमवगमयति, एवं प्रधानादिष्वपि। तत्कथं तेषां सामान्यतोदृष्टादिभ्यः सिद्धिरित्यत आह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000255", "originalText": "अतिदूरात् सामीप्यात् इन्द्रियघातान्मनोऽनवस्थानात्। सौक्ष्म्याद्व्यवधानात् अभिभवात् समानाभिहाराच्च॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000256", "originalText": "᳚अतिदूरात्᳚ इति अनुपलब्धिरिति वक्ष्यमाणं सिंहावलोकनन्यायेनानुषञ्जनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000256.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000257", "originalText": "यथा उत्पतन् वियति अतिदूरतया सन्नपि प्रत्यक्षेण नोपलभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000257.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000258", "originalText": "सामीप्यादित्यत्राप्यतिरनुवर्तनीयः, यथा लोचनस्थमञ्जनमतिसामीप्यान्न\nदृश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000258.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000259", "originalText": "इन्द्रियघातोऽन्धत्वबधिरत्वादिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000259.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000260", "originalText": "᳚मनोऽवस्थानात्᳚ यथा\nकामाद्युपहतमनाः स्फीतालोकमध्यवर्तिनमिन्द्रियसन्निकृष्टमर्थं न\nपश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000260.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000261", "originalText": "᳚सौक्ष्म्यात्᳚ यथेन्द्रियसन्निकृष्टं परमाण्वादि प्रणिहितमना अपि\nन पश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000261.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000262", "originalText": "व्यवधानात्— यथा कुड्यादिव्यवहितं राजदारादिकं न पश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000262.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000263", "originalText": "अभिभवात्— यथाऽहनि सौराभिर्भाभिरभिभूतं ग्रहनक्षत्रमण्डलं\nन पश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000263.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000264", "originalText": "समानाभिहारात्— यथा तोयदविमुक्तानुदबिन्दून् जलाशये न\nपश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000264.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000265", "originalText": "चकारोऽनुक्तसमुच्चयार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000265.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000266", "originalText": "तेनानुद्भवोऽपि सङ्गृहीतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000266.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000267", "originalText": "तद्यथा\nक्षीराद्यवस्थायां दध्याद्यनुद्भवान्न पश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000267.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000268", "originalText": "एतदुक्तं भवति न प्रत्यक्षनिवृत्तिमात्राद्वस्त्वभावो भवति,\nअतिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000268.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000269", "originalText": "तथा हि— गृहाद्विनिर्गतो गृहजनमपश्यंस्तदभावं\nविनिश्चिनुयात्, न त्वेवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000269.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000270", "originalText": "अपि तु योग्यप्रत्यक्षनिवृत्तेरयमभावं\nविनिश्चिनोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000270.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000271", "originalText": "न च प्रधानपुरुषादीनामस्ति प्रत्यक्षयोग्यता, इति न\nतन्निवृत्तिमात्रात्तदभावनिश्चयो युक्तः प्रामाणिकानामिति। कारिका ८\n\nकतमत्पुनरेतेषु कारणं प्रधानादीनामनुपलब्धौ? इत्यत आह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000271.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000272", "originalText": "सौक्ष्म्यात्तदनुपलब्धिर्नाभावात्, कार्यतस्तदुपलब्धेः। महदादि तच्च कार्यं प्रकृतिसरूपं विरूपं च॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000272.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000273", "originalText": "᳚सौक्ष्म्यात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000273.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000274", "originalText": "अथाभावादेव सप्तमरसवदेतेषामनुपलब्धिः कस्मान्न\nभवति? इत्यत आह— ᳚नाभावात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000274.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000275", "originalText": "कुतः? ᳚कार्यतस्तदुपलब्धेः᳚,\n'तत्' इति प्रधानं परामृशति।", "padacchedaText": "", "audioFile": "PB_hear2read_000275.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000276", "originalText": "पुरुषोपलब्धौ तु प्रमाणं वक्ष्यति,\n᳚सङ्घातपरार्थत्वात्᳚—(का० १७) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000276.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000277", "originalText": "दृढतरप्रमाणावधारिते\nहि प्रत्यक्षमप्रवर्तमानमयोग्यत्वान्न प्रवर्तते इति कल्प्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000277.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000278", "originalText": "सप्तमस्तु रसो न प्रमाणेनावधारित इति न तत्र प्रत्यक्षस्यायोग्यता\nशक्याऽध्यवसातुमित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000278.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000279", "originalText": "किं पुनस्तत्कार्यं यतः प्रधानानुमानम्? इत्यत आह— ᳚महदादि तच्च\nकार्यम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000279.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000280", "originalText": "एतच्च यथा गमकं तथोपरिष्टादुपपादयिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000280.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000281", "originalText": "तस्य\nच कार्यस्य विवेकज्ञानोपयोगिनी सारूप्यवैरूप्ये आह— ᳚प्रकृतिसरूपं\nविरूपं च᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000281.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000282", "originalText": "एते तूपरिष्टाद्विभजनीये इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000282.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000283", "originalText": "कारिका ९\n\nकार्यात् कारणमात्रं गम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000283.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000284", "originalText": "सन्ति चात्र वादिनां विप्रतिपत्तयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000284.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000285", "originalText": "तथा\nहि केचिदाहुः— 'असतः सत् जातते' इति, 'एकस्य सतो विवर्तः कार्यजातं\nन वस्तुसत्' इत्यपरे, अन्ये तु 'सतः असत् जायते' इति, 'सतः सत् जायते'\nइति वृद्धाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000285.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000286", "originalText": "तत्र पूर्वस्मिन् कल्पत्रये प्रधानं न सिद्ध्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000286.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000287", "originalText": "सुखदुःखमोहभेदस्वरूपपरिणामशब्दाद्यात्मकं हि जगत्कारणस्य\nप्रधानत्वं सत्त्वरजस्तमःस्वभावत्वमवगमयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000287.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000288", "originalText": "यदि पुनरसतः सज्जायेत असत् निरूपाख्यं कारणं सुखादिरूपशब्दाद्यात्मकं\nकथं स्यात्? सदसतोस्तादात्म्यानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000288.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000289", "originalText": "अथैकरूपस्य सतो विवर्तः शब्दादिप्रपञ्चः, तथाऽपि सतः सज्जायत\nइति न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000289.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000290", "originalText": "न चास्याद्वयस्य प्रपञ्चात्मकत्वम्, अपि त्वप्रपञ्चस्य\nप्रपञ्चात्मकतया प्रतीतिर्भ्रम एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000290.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000291", "originalText": "येषामपि कणभक्षाक्षचरणादीनां सत एव कारणादसतो जन्म, तेषामपि\nसदसतोरेकत्वानुपपत्तेर्न कार्यात्मकं कारणमिति न तन्मते प्रधानसिद्धिः। अतः प्रधानसिद्ध्यर्थं प्रथमं तावत्सत्कार्यं प्रतिजानीते।॥", "padacchedaText": "", "audioFile": "PB_hear2read_000291.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000292", "originalText": "असदकरणादुपादानग्रहणात् सर्वसम्भवाभावात्। शक्तस्य शक्यकरणात् कारणभावाच्च सत् कार्यम्॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000292.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000293", "originalText": "᳚असदकरणात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000293.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000294", "originalText": "᳚सत् कार्यम्᳚ कारणव्यापारात् प्रागपीति शेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000294.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000295", "originalText": "तथा\nच न सिद्धसाधनं नैयायिकतनयैरुद्भावनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000295.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000296", "originalText": "यद्यपि बीजमृत्पिण्डादिप्रध्वंसानन्तरमङ्कुरघटाद्युत्पत्तिरुपलभ्यते,\nतथाऽपि न प्रध्वंसस्य कारणत्वम्, अपि तु भावस्यैव\nबीजाद्यवयवस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000296.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000297", "originalText": "अभावात्तु भावोत्पत्तौ तस्य सर्वत्र सुलभत्वात्\nसर्वदा सर्वकार्योत्पादप्रसङ्ग इत्यादि न्यायवार्तिकतात्पर्यटीकायामस्माभिः\nप्रतिपादितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000297.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000298", "originalText": "प्रपञ्चप्रत्ययश्चासति बाधके न शक्यो मिथ्येति वदितुमिति\nकणभक्षाक्षचारणमतमवशिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000298.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000299", "originalText": "तत्रेदं प्रतिज्ञातम्, ᳚सत् कार्यम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000299.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000300", "originalText": "अत्र हेतुमाह ᳚असदकरणात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000300.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000301", "originalText": "असत् चेत् कारणव्यापारात् पूर्वं कार्यम्, नास्य सत्त्वं कर्तुं केनापि शक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000301.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000302", "originalText": "न हि नीलं शिल्पिसहस्रेणापि पीतं कर्तुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000302.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000303", "originalText": "'सदसत्त्वे घटस्य\nधर्मौ' इति चेत्, तथापि असति धर्मिणि न तस्य धर्म इति सत्त्वं\nतदवस्थमेव, तथा च नात्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000303.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000304", "originalText": "असम्बद्धेनातदात्मना चासत्त्वेन\nकथमसन् घटः? तस्मात् कारणव्यापारादूर्ध्वमिव ततः प्रागपि सदेव\nकार्यमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000304.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000305", "originalText": "कारणाच्चास्य सतोऽभिव्यक्तिरेवावशिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000305.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000306", "originalText": "सतश्चाभिव्यक्तिरुपपन्ना।", "padacchedaText": "", "audioFile": "PB_hear2read_000306.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000307", "originalText": "यथा पीडनेन तिलेषु तैलरूप, अवघातेन धान्येषु तण्डुलानाम्, दोहनेन\nसौरभेयीषु पयसः।", "padacchedaText": "", "audioFile": "PB_hear2read_000307.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000308", "originalText": "असतः करणे तु न निदर्शनं किञ्चिदस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000308.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000309", "originalText": "न खल्वभिव्यज्यमानं चोत्पद्यमानं वा क्वचिदसत् दृष्टम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000309.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000310", "originalText": "इतश्च कारणव्यापारात् प्राक् सदेव कार्यम्— ᳚उपादानग्रहणात्᳚, उपादानानि—\nकारणानि, तेषां ग्रहणं— कार्येण सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000310.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000311", "originalText": "उपादानैः कार्यस्य\nसम्बन्धादिति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000311.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000312", "originalText": "एतदुक्तं भवति— कार्येण सम्बद्धं कारणं कार्यस्य जनकम्, सम्बन्धश्च\nकार्यस्यासतो न सम्भवति, तस्मादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000312.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000313", "originalText": "स्यादेतत्— असम्बद्धमेव कारणैः कार्यं कस्मान्न जन्यते? तथा\nचासदेवोत्पस्येत इत्यत आह— ᳚सर्वसम्बवाभावात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000313.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000314", "originalText": "असम्बद्धस्य\nजन्यत्वे असम्बद्धत्वाविशेषेण सर्वं कार्यजातं सर्वस्माद्भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000314.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000315", "originalText": "न\nचैतदस्ति, तस्मान्नासम्बद्धमसम्बद्धेन जन्यते, अपि तु सम्बद्धं\nसम्बद्धेन जन्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000315.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000316", "originalText": "यथाऽऽहुः सांख्यवृद्धाः—\n᳚असत्त्वे नास्ति सम्बन्धः कारणैः सत्त्वसङ्गिभिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000316.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000317", "originalText": "असम्बद्धस्य चोत्पत्तिमिच्छतो न व्यवस्थितिः—᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000317.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000318", "originalText": "स्यादेतत्— असम्बद्धमपि सत् तदेव करोति यत्र यत् कारणं शक्तं,\nशक्तिश्च कार्यदर्शनादवगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000318.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000319", "originalText": "तेन नाव्यवस्थेत्यत आह— ᳚शक्तस्य\nशक्यकरणात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000319.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000320", "originalText": "सा शक्तिः शक्तकारणाश्रया, सर्वत्र वा स्यात्, शक्ये\nएव वा? सर्वत्र चेत्, तदवस्थैवाव्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000320.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000321", "originalText": "शक्ये चेत्, कथमसति\nशक्ये तत्र? इति वक्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000321.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000322", "originalText": "शक्तिभेद एव एतादृशो यतः किञ्चिदेव\nकार्यं जनयेत् न सर्वमिति चेत्, हन्त भोः ! शक्तिविशेषः कार्यसम्बद्धो\nवाऽसम्बद्धो वा? सम्बद्धत्वे नासता सम्बन्ध इति सत् कार्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000322.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000323", "originalText": "असम्बद्धत्वे\nसैवाव्यवस्था, इति सुष्ठूक्तं ᳚शक्तस्य शक्यकरणात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000323.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000324", "originalText": "इतश्च सत् कार्यमित्याह— ᳚कारणभावाच्च᳚, कार्यस्य कारणात्मकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000324.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000325", "originalText": "न हि कारणाद्भिन्नं कार्यम्, कारणं च सदिति कथं तदभिन्नं\nकार्यमसद्भवेत्?\nकार्यस्य कारणाभेदसाधनानि च प्रमाणानि—\n(१) न पटस्तन्तुभ्यो भिद्यते, तन्तुधर्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000325.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000326", "originalText": "इह यद्यतो भिद्यते तत्\nतस्य धर्मो न भवति, यथा गौरश्वस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000326.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000327", "originalText": "धर्मश्च पटस्तन्तूनां,\nतस्मान्नार्थान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000327.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000328", "originalText": "(२) उपादानोपादेयभावाच्च नार्थान्तरत्वं तन्तुपटयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000328.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000329", "originalText": "ययोरर्थान्तरत्वं\nन तयोरुपादानोपादेयभावः, यथा घटपटयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000329.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000330", "originalText": "उपादानोपादेयभावश्च\nतन्तुपटयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000330.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000331", "originalText": "तस्मान्नार्थान्तरत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000331.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000332", "originalText": "(३) इतश्च नार्थान्तरत्वं तन्तुपटयोः, संयोगाप्राप्त्यभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000332.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000333", "originalText": "अर्थान्तरत्वे\nहि संयोगो दृष्टो यथा कुण्डबदरयोः, अप्राप्तिर्वा यथा हिमवद्विन्ध्ययोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000333.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000334", "originalText": "न चेह संयोगाप्राप्ती, तस्मान्नार्थान्तरत्वमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000334.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000335", "originalText": "(४) इतश्च पटस्तन्तुभ्यो न भिद्यते, गुरुत्वान्तरकार्याग्रहणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000335.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000336", "originalText": "इह यद्यस्माद्भिन्नम्, तस्मात् तस्य गुरुत्वान्तरं\nकार्यं गृह्यते, यथैकपलिकस्य स्वस्तिकस्य यो\nगुरुत्वकार्योऽवनतिविशेषस्तस्माद्द्विपलिकस्य स्वस्तिकस्य\nगुरुत्वकार्योऽवनतिभेदोऽधिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000336.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000337", "originalText": "न च तथा तन्तुगुरुत्वकार्यात्\nपटगुरुत्वकार्यान्तरं दृश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000337.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000338", "originalText": "तस्मादभिन्नस्तन्तुभ्यः पट इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000338.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000339", "originalText": "तान्येतान्यभेदसाधनान्यवीतानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000339.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000340", "originalText": "एवमभेदे सिद्धे, तन्तव एव तेन संस्थानभेदेन परिणताः पटः, न\nतन्तुभ्योऽर्थान्तरं पटः।", "padacchedaText": "", "audioFile": "PB_hear2read_000340.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000341", "originalText": "स्वात्मनि क्रियानिरोधबुद्धिव्यपदेशार्थक्रियाभेदाश्च\nनैकान्तिकं भेदं साधयितुमर्हन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000341.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000342", "originalText": "एकस्मिन्नपि\nतत्तद्विशेषाविर्भावतिरोभावाभ्यामेतेषामविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000342.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000343", "originalText": "यथा हि कूर्मस्याङ्गानि\nकूर्मशरीरे निविशमानानि तिरोभवन्ति, निःसरन्ति चाविर्भवन्ति, न तु\nकूर्मतस्तदङ्गान्युत्पद्यन्ते प्रध्वंसन्ते वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000343.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000344", "originalText": "एवमेकस्या मृदः सुवर्णस्य\nवा घटमुकुटादयो विशेषा निःसरन्त आविर्भवन्त उत्पद्यन्त इत्युच्यन्ते,\nनिविशमानास्तिरोभवन्ति विनश्यन्तीत्युच्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000344.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000345", "originalText": "न पुनरसतामुत्पादः सतां\nवा निरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000345.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000346", "originalText": "यथाऽऽह भगवान् कृष्णद्वैपायनः—\n᳚नासतो विद्यते भावो नाभावो विद्यते सतः ᳚ (गीता २—१६ इति)।", "padacchedaText": "", "audioFile": "PB_hear2read_000346.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000347", "originalText": "यथा कूर्मः स्वावयवेभ्यः सङ्कोचविकासिभ्यो न भिन्नः, एवं\nघटमुकुटादयोऽपि मृत्सुवर्णादिभ्यो न भिन्नाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000347.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000348", "originalText": "एवञ्च 'इह तन्तुषु पटः' इति व्यपदेशो यथा 'इह वने तिलकाः'\nइत्युपपन्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000348.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000349", "originalText": "न चार्थक्रियाभेदोऽपि भेदमापादयति, एकस्यापि नानार्थक्रियादर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000349.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000350", "originalText": "यथैक एव वह्निर्दाहकः पाचकः प्रकाशकश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000350.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000351", "originalText": "नाप्यर्थक्रियाव्यवस्था\nवस्तुभेदे हेतुः, तेषामेव समस्तव्यस्तानामर्थक्रियाव्यवस्थादर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000351.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000352", "originalText": "यथा प्रत्येकं विष्टयो वर्त्मदर्शनलक्षणामर्थक्रियां कुर्वन्ति, न\nतु शिबिकावहनम्, मिलितास्तु शिबिकामुद्वहन्ति, एवं तन्तवः प्रत्येकं\nप्रावरणमकुर्वाणा अपि मिलिता आविर्भूतपटभावाः प्रावरिष्यन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000352.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000353", "originalText": "स्यादेतत्— आविर्भावः पटस्य कारणव्यापारात् प्राक् सन् असन् वा? असंश्चेत्\nप्राप्तं तर्ह्यसदुत्पादनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000353.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000354", "originalText": "अथ सन्, कृतं तर्हि कारणव्यापारेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000354.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000355", "originalText": "न हि सति कार्ये कारणव्यापारप्रयोजनं पश्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000355.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000356", "originalText": "आविर्भावे\nचाविर्भावान्तरकल्पनेऽनवस्थाप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000356.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000357", "originalText": "तस्मादाविर्भूतपटभावास्तन्तवः\nक्रियन्त इति रिक्तं वचः।", "pada
