cchedaText": "", "audioFile": "PB_hear2read_000357.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000358", "originalText": "मैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000358.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000359", "originalText": "अथासदुत्पद्यत इति मते केयमसदुत्पत्तिः? सती, असती वा? सती\nचेत्, कृतं तर्हि कारणैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000359.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000360", "originalText": "असती चेत्, तस्या अप्युत्पत्त्यन्तरमित्यनवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000360.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000361", "originalText": "अथ— उत्पत्तिः पटान्नार्थान्तरम्, अपि तु पट एवासौ, तथापि यावदुक्तं\nभवति 'पटः' इति, तावदुक्तं भवति 'उत्पद्यते' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000361.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000362", "originalText": "ततश्च 'पटः'\nइत्युक्ते 'उत्पद्यते' इति न वाच्यम्, पौनरुक्त्यात्, 'विनश्यति' इत्यपि न\nवाच्यम्, उत्पत्तिविनाशयोर्युगपदेकत्र विरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000362.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000363", "originalText": "तस्मादियं पटोत्पत्तिः स्वकारणसमवायो वा, स्वसत्तासमवायो वा? उभयथाऽपि नोत्पद्यते, अथ च तदर्थानि कारणानि व्यापार्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000363.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000364", "originalText": "एवं सत एव पटादेराविर्भावाय कारणापेक्षेत्युपपन्नम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000364.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000365", "originalText": "न च पटरूपेण कारणानां सम्बन्धः, तद्रूपस्याक्रियात्वात्,\nक्रियासम्बन्धित्वाच्च कारकाणाम्, अन्यथा कारणत्वाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000365.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000366", "originalText": "तस्मात् सत् कार्यमिति पुष्कलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000366.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000367", "originalText": "कारिका १०\n\nतदेवं प्रधानसाधनानुगुणं सत्कार्यमुपपाद्य यादृशं तत्\nप्रधानं साधनीयं तादृशमादर्शयितुं विवेकज्ञानोपयोगिनी\nव्यक्ताव्यक्तसारूप्यवैरूप्ये तावदाह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000367.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000368", "originalText": "हेतुमदनित्यमव्यापि सक्रियमनेकमाश्रितं लिङ्गम्। सावयवं परतन्त्रं व्यक्तं, विपरीतमव्यक्तम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000368.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000369", "originalText": "᳚हेतुमत्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000369.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000370", "originalText": "व्यक्तं हेतुमत्, हेतुः कारणम्, तद्वत्, यस्य च यो\nहेतुस्तमुपरिष्टाद्वक्ष्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000370.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000371", "originalText": "᳚अनित्यम्᳚ विनाशि, तिरोभावीति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000371.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000372", "originalText": "᳚अव्यापि᳚ सर्वं परिणामिनं न व्याप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000372.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000373", "originalText": "कारणेन हि कार्यमाविष्टम्, न\nकार्येण कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000373.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000374", "originalText": "न च बुद्ध्यादयः प्रधानं वेविषतीत्यव्यापकाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000374.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000375", "originalText": "᳚सक्रियम्᳚ परिस्पन्दवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000375.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000376", "originalText": "तथा हि बुद्ध्यादयः उपात्तमुपात्तं देहं त्यजन्ति,\nदेहान्तरं चोपाददते, इति तेषां परिस्पन्दः।", "padacchedaText": "", "audioFile": "PB_hear2read_000376.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000377", "originalText": "शरीरपृथिव्यादीनां च\nपरिस्पन्दः प्रसिद्ध एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000377.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000378", "originalText": "᳚अनेकम्᳚ प्रतिपुरुषं बुद्ध्यादीनां भेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000378.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000379", "originalText": "पृथिव्याद्यपि\nशरीरघटादिभेदेनानेकमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000379.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000380", "originalText": "᳚आश्रितम्᳚ स्वकारणमाश्रितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000380.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000381", "originalText": "बुद्ध्यादिकार्याणामभेदेऽपि\nकथञ्चिद्भेदविवक्षयाऽऽश्रयाश्रयिभावः, यथा 'इह वने तिलकाः'\nइत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000381.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000382", "originalText": "᳚लिङ्गम्᳚ प्रधानस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000382.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000383", "originalText": "यथा चैते बुद्ध्यादयः प्रधानस्य लिङ्गम्,\nतथोपरिष्टाद्वक्ष्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000383.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000384", "originalText": "प्रधानं तु न प्रधानस्य लिङ्गं पुरुषस्य\nलिङ्गं भवदपीति भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000384.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000385", "originalText": "᳚सावयवम्᳚ अवयनमवयवः, अवयवानामवयविनां मिथः संश्लेषो मिश्रणं\nसंयोग इति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000385.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000386", "originalText": "अप्राप्तिपूर्विका प्राप्तिः संयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000386.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000387", "originalText": "तेन सह वर्तत इति\nसावयवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000387.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000388", "originalText": "तथा हि— पृथिव्यादयः परस्परं संयुज्यन्ते, एवमन्येऽपि, न तु\nप्रधानस्य बुद्ध्यादिभिः संयोगः, तादात्म्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000388.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000389", "originalText": "नापि सत्त्वरजस्तमसां\nपरस्परं संयोगः, अप्राप्तेरभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000389.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000390", "originalText": "᳚परतन्त्रम्᳚ बुद्ध्यादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000390.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000391", "originalText": "बुद्ध्या स्वकार्येऽहङ्कारे जनयितव्ये\nप्रकृत्यापूरोऽपेक्ष्यते, अन्यथा क्षीणा सती नालमहङ्कारं जनयितुमिति\nस्थितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000391.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000392", "originalText": "एवमहङ्कारादिभिरपि स्वकार्यजनने इति सर्वं स्वकार्येषु\nप्रकृत्याऽऽपूरमपेक्षते।", "padacchedaText": "", "audioFile": "PB_hear2read_000392.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000393", "originalText": "तेन परां प्रकृतिमपेक्षमाणं कारणमपि\nस्वकार्यजनने परतन्त्रं व्यक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000393.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000394", "originalText": "᳚विपरीतमव्यक्तम्᳚ व्यक्तात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000394.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000395", "originalText": "अहेतुमत्, नित्यं, व्यापि, निष्क्रियम्,\nयद्यप्यव्यक्तस्यास्ति परिणामलक्षणा क्रिया, तथाऽपि परिस्पन्दो नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000395.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000396", "originalText": "एकम्, अनाश्रितम्, अलिङ्गम्, अनवयवम्, स्वतन्त्रम्, अव्यक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000396.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000397", "originalText": "कारिका ११\n\nतदनेन प्रबन्धेन व्यक्ताव्यक्तयोर्वैधर्म्यमुक्तम्। सम्प्रति तयोः\nसाधर्म्यम्, पुरुषाच्च वैधर्म्यमाह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000397.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000398", "originalText": "त्रिगुणमविवेकि विषयः सामान्यमचेतनं प्रसवधर्मि। व्यक्तं तथा प्रधानम्, तद्विपरीतस्तथा च पुमान्॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000398.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000399", "originalText": "᳚त्रिगुणम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000399.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000400", "originalText": "त्रयो गुणाः सुखदुःखमोहा अस्येति त्रिगुणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000400.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000401", "originalText": "तदनेन\nसुखादीनामात्मगुणत्वं पराभिमतमपाकृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000401.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000402", "originalText": "᳚अविवेकि᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000402.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000403", "originalText": "यथा प्रधानं न स्वतो विविच्यते, एवम्महदादयोऽपि न\nप्रधानाद्विविच्यन्ते, तदात्मकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000403.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000404", "originalText": "अथ वा सम्भूयकारिताऽत्राविवेकिता।", "padacchedaText": "", "audioFile": "PB_hear2read_000404.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000405", "originalText": "न हि किञ्चिदेकं पर्याप्तं स्वकार्ये, अपि तु सम्भूय। तत्र नैकस्मात्\nयस्य कस्यचित् केनचित्सम्भव इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000405.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000406", "originalText": "ये त्वाहुः— 'विज्ञानमेव हर्षविषादमोहशब्दाद्यात्मकम्, न\nपुनरितोऽन्यस्तद्धर्मा' इति— तान् प्रत्याह— ᳚विषय᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000406.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000407", "originalText": "'विषयो'\nग्राह्यः, विज्ञानाद्बहिरिति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000407.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000408", "originalText": "अत एव ᳚सामान्यम्᳚ साधारणम्, घटादिवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000408.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000409", "originalText": "अनेकैः पुरुषैर्गृहीतमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000409.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000410", "originalText": "विज्ञानाकारत्वे तु असाधारण्याद्विज्ञानानां वृत्तिरूपाणां,\nतेऽप्यसाधारणाः स्युः, विज्ञानं यथा परेण न गृह्यते,\nपरबुद्धेरप्रत्यक्षत्वादित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000410.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000411", "originalText": "तथा च नर्तकीभ्रूलताभङ्गे\nएकस्मिन् बहूनां प्रतिसन्धानं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000411.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000412", "originalText": "अन्यथा तन्न स्यादिति भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000412.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000413", "originalText": "᳚अचेतनम्᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000413.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000414", "originalText": "सर्वे एव प्रधानबुद्ध्यादयोऽचेतनाः, न तु वैनाशिकवत्—\nचैतन्यं बुद्धेरित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000414.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000415", "originalText": "᳚प्रसवधर्मि᳚— प्रसवरूपो धर्मो यः सोऽस्याऽस्तीति प्रसवधर्मि।", "padacchedaText": "", "audioFile": "PB_hear2read_000415.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000416", "originalText": "प्रसवधर्मेति वक्तव्ये मत्वर्थीयः प्रसवधर्मस्य नित्ययोगमाख्यातुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000416.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000417", "originalText": "सरूपविरूपपरिणामाभ्यां न कदाचिदपि वियुज्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000417.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000418", "originalText": "व्यक्तवृत्तमव्यक्तेऽतिदिशति— ᳚तथा प्रधानम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000418.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000419", "originalText": "यथा व्यक्तं\nतथाऽव्यक्तमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000419.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000420", "originalText": "ताभ्यां वैधर्म्यं पुरुषस्याह— ᳚तद्विपरीतः पुमान्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000420.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000421", "originalText": "स्यादेतत्— अहेतुमत्त्वनित्यत्वादि प्रधानसाधर्म्यमस्ति पुरुषस्य,\nएवमनेकत्वं व्यक्तसाधर्म्यम्, तत्कथमुच्यते 'तद्विपरीतः पुमान्' इति? अत आह— ᳚तथा च᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000421.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000422", "originalText": "चकारोऽप्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000422.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000423", "originalText": "यद्यप्यहेतुमत्त्वादिकं\nसाधर्म्यम्, तथाऽप्यत्रैगुण्यादिवैपरीत्यमस्त्येवेत्यर्थः। कारिका १२\n\nत्रिगुणमित्युक्तम्, तत्र के ते त्रयो गुणाः? किं च तल्लक्षणम्? इत्यत\nआह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000423.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000424", "originalText": "प्रीत्यप्रीतिविषादात्मकाः प्रकाशप्रवृत्तिनियमार्थाः। अन्योन्याभिभवाश्रयजननमिथुनवृत्तयश्च गुणाः॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000424.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000425", "originalText": "᳚गुणाः᳚ इति परार्थाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000425.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000426", "originalText": "᳚सत्त्वं लघु प्रकाशकम्᳚ इत्यत्र च सत्त्वादयः\nक्रमेण निर्देक्ष्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000426.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000427", "originalText": "तदनागतावेक्षणेन तन्त्रयुक्त्या वा प्रीत्यादीनां\nयथासङ्ख्यं वेदितव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000427.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000428", "originalText": "एतदुक्तं भवति— प्रीतिः सुखम्, प्रीत्यात्मकः सत्त्वगुणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000428.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000429", "originalText": "अप्रीतिः दुःखम्,\nअप्रीत्यात्मको रजोगुणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000429.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000430", "originalText": "विषादः मोहः, विषादात्मकस्तमोगुण इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000430.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000431", "originalText": "ये तु मन्यन्ते ᳚ न प्रीतिर्दुःखाभावादतिरिच्यते, एवं दुःखमपि न\nप्रीत्यभावादन्यदिति, तान् प्रति ᳚आत्म᳚ग्रहणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000431.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000432", "originalText": "नेतरेतराभावाः सुखादयः, अपि तु भावाः, आत्मशब्दस्य भाववचनत्वात्,\nप्रीतिरात्माभावो येषां ते प्रीत्यात्मानः।", "padacchedaText": "", "audioFile": "PB_hear2read_000432.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000433", "originalText": "एवमन्यदपि व्याख्येयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000433.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000434", "originalText": "भावरूपता चैषामनुभवसिद्धा।", "padacchedaText": "", "audioFile": "PB_hear2read_000434.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000435", "originalText": "परस्पराभावात्मकत्वे तु\nपरस्पराश्रयापत्तेरेकस्याप्यसिद्धेरुभयासिद्धिरिति भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000435.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000436", "originalText": "स्वरूपमेषामुक्त्वा प्रयोजनमाह— ᳚प्रकाशप्रवृत्तिनियमार्थाः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000436.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000437", "originalText": "अत्रापि यथासङ्ख्यमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000437.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000438", "originalText": "रजः प्रवर्तकत्वात् सर्वत्र लघु सत्त्वं\nप्रवर्तयेत्, यदि तमसा गुरुणा न नियम्येत, तमोनियतं तु क्वचिदेव\nप्रवर्ततीति भवति तमो नियमार्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000438.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000439", "originalText": "प्रयोजनमुक्त्वा क्रियामाह— ᳚अन्योन्याभिभवाश्रयजननमिथुनवृत्तयश्च᳚\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000439.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000440", "originalText": "वृत्तिः— क्रिया, सा च प्रत्येकमभिसम्बध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000440.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000441", "originalText": "᳚अन्योन्याभिभववृत्तयः᳚ एषामन्यतमेनार्थवशादुद्भूतेनान्यदभिभूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000441.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000442", "originalText": "तथा हि— सत्त्वं रजस्तमसी अभिभूय शान्तामात्मनो वृत्तिं प्रतिलभते,\nएवं रजः सत्त्वतमसी अभिभूय घोराम्, एवं तमः सत्त्वरजसी अभिभूय\nमूढामिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000442.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000443", "originalText": "᳚अन्योन्याश्रयवृत्तयः᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000443.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000444", "originalText": "यद्यप्याधाराधेयभावेन नायमर्थो घटते,\nतथाऽपि यदपेक्षया यस्य क्रिया स तस्याश्रयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000444.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000445", "originalText": "तथा हि— सत्त्वं प्रवृत्तिनियमावाश्रित्य रजस्तमसोः प्रकाशेनोपकरोति,\nरजः प्रकाशनियमावाश्रित्य प्रवृत्त्या इतरयोः, तमः प्रकाशप्रवृत्ती\nआश्रित्य नियमेनेतरयोरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000445.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000446", "originalText": "᳚अन्योन्यजननवृत्तयः᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000446.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000447", "originalText": "अन्यतमोऽन्यतमं जनयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000447.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000448", "originalText": "जननं च\nपरिणामः, स च गुणानां सदृशरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000448.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000449", "originalText": "अत एव न हेतुमत्त्वम्,\nतत्त्वान्तरस्य हेतोरभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000449.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000450", "originalText": "नाप्यनित्यत्वम्, तत्त्वान्तरे लयाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000450.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000451", "originalText": "᳚अन्योन्यमिथुनवृत्तयः᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000451.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000452", "originalText": "अन्योन्यसहचराः अविनाभाववृत्तय इति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000452.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000453", "originalText": "᳚चः᳚ समुच्चये।", "padacchedaText": "", "audioFile": "PB_hear2read_000453.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000454", "originalText": "भवति चात्रागमः—\n᳚अन्योन्यमिथुनाः सर्वे सर्वे सर्वत्र गामिनः। रजसो मिथुनं सत्त्वं सत्त्वस्य मिथुनं रजः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000454.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000455", "originalText": "तमसश्चापि मिथुने ते सत्त्वरजसी उभे। उभयोः सत्त्वरजसोर्मिथुनं तम उच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000455.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000456", "originalText": "नैषामादिः सम्प्रयोगो वियोगो वोपलभ्यते ᳚ इति (दे. भा. ३/८)। कारिका १३\n\n᳚प्रकाशप्रवृत्तिनियमार्थाः᳚ इत्युक्तम्, तत्र के ते इत्थम्भूताः\nकुतश्चेत्यत आह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000456.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000457", "originalText": "सत्त्वं लघु प्रकाशकमिष्टमुपष्टम्भकं चलं च रजः। गुरु वरणकमेव तमः, प्रदीपवच्चार्थतो वृत्तिः॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000457.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000458", "originalText": "᳚सत्त्वम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000458.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000459", "originalText": "सत्त्वमेव लघु प्रकाशकमिष्टं साङ्ख्याचार्यैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000459.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000460", "originalText": "तत्र\nकार्योद्गमने हेतुर्धर्मो लाघवं गौरवप्रतिद्वन्द्वि, यतोऽग्नेरूर्ध्वज्वलनं\nभवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000460.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000461", "originalText": "तदेव लाघवं कस्यचित्तिर्यग्गमने हेतुर्भवति, यथा वायोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000461.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000462", "originalText": "एवं करणानां वृत्तिपटुत्वहेतुर्लाघवम्, गुरुत्वे हि मन्दानि स्युरिति\nसत्त्वस्य प्रकाशात्मकत्वमुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000462.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000463", "originalText": "सत्त्वतमसी स्वयमक्रियतया स्वकार्यप्रवृत्तिं प्रत्यवसीदन्ती\nरजसोपष्टभ्येते— अवसादात् प्रच्याव्य स्वकार्ये उत्साहं प्रयत्नं कार्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_000463.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000464", "originalText": "तदिदमुक्तम्— ᳚उपष्टम्भकम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000464.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000465", "originalText": "कस्मादित्यत उक्तम्— ᳚चलम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000465.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000466", "originalText": "तदनेन रजसः प्रवृत्त्यर्थत्वं दर्शितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000466.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000467", "originalText": "रजस्तु चलतया परितस्त्रैगुण्यं चालयत् गुरुणाऽऽवृण्वता च तमसा\nतत्र तत्र प्रवृत्तिप्रतिबन्धकेन क्वचिदेव प्रवर्त्यत इति ततस्ततो\nव्यावृत्त्या तमो नियामकमुक्तम्— ᳚गुरु वरणकमेव तमः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000467.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000468", "originalText": "एवकारः\nप्रत्येकं भिन्नक्रमः सम्बध्यते, सत्त्वमेव, रज एव, तम एवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000468.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000469", "originalText": "ननु एते परस्परविरोधशीला गुणाः सुन्दोपसुन्दवत् परस्परं\nध्वंसन्त इत्येव युक्तं प्रागेव तेषामेकक्रियाकर्तृताया इत्यत\nआह— ᳚प्रदीपवच्चार्थतो वृत्तिः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000469.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000470", "originalText": "दृष्टमेतत्, यथा\nवर्त्तितैलेऽनलविरोधिनी, अथ मिलिते सहानलेन रूपप्रकाशलक्षणं\nकार्यं कुरुतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000470.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000471", "originalText": "यथा च वातपित्तश्लेष्माणः परस्परविरोधिनः\nशरीरधारणलक्षणकार्यकारिणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000471.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000472", "originalText": "एवं सत्त्वरजस्तमांसि मिथो\nविरुद्ध्यान्यप्यनुवर्त्स्यन्ति स्वकार्यं करिष्यन्ति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000472.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000473", "originalText": "᳚अर्थतः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000473.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000474", "originalText": "पुरुषार्थत इति यावत्, यथा च वक्ष्यति—\n᳚पुरुषार्थ एव हेतुर्न केनचित् कार्यते करणम्᳚ इति (का० ३१)\nअत्र च सुखदुःखमोहाः परस्परविरोधिनः स्वस्वानुरूपाणि\nसुखदुःखमोहात्मकान्येव निमित्तानि कल्पयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000474.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000475", "originalText": "तेषां च\nपरस्परमभिभाव्याभिभावकभावान्नानात्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000475.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000476", "originalText": "तद्यथा— एकैव स्त्री रूपयौवनकुलशीलसम्पन्ना स्वामिनं सुखाकरोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000476.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000477", "originalText": "तत्कस्य हेतोः? स्वामिनं प्रति तस्याः सुखरूपसमुद्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000477.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000478", "originalText": "सैव स्त्री\nसपत्नीर्दुःखाकरोति, तत् कस्य हेतोः? ताः प्रति तस्या दुःखरूपसमुद्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000478.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000479", "originalText": "एवं पुरुषान्तरं तामविन्दमानं सैव मोहयति, तत् कस्य हेतोः? तत्\nप्रति तस्या मोहरूपसमुद्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000479.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000480", "originalText": "अनया च स्त्रिया सर्वे भावा व्याख्याताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000480.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000481", "originalText": "तत्र यत् सुखहेतुः तत् सुखात्मकं सत्त्वम्, यत् दुःखहेतुस्तत् दुःखात्मकं\nरजः, यन्मोहहेतुस्तन्मोहात्मकं तमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000481.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000482", "originalText": "सुखप्रकाशलाघवानां त्वेकस्मिन्\nयुगपदुद्भूतावविरोधः, सहदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000482.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000483", "originalText": "तस्मात् सुखदुःखमोहैरिव\nविरोधिभिः अविरोधिभिरेकैकगुणवृत्तिभिः सुखप्रकाशलाघवैर्न\nनिमित्तभेदा उन्नीयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000483.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000484", "originalText": "एवं दुःखोपष्टम्भकत्वप्रवर्तकत्वैः, एवं\nमोहगुरुत्वावरणैः— इति सिद्धं त्रैगुण्यमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000484.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000485", "originalText": "कारिका १४\n\nस्यादेतत्— अनुभूयमानेषु पृथिव्यादिष्वनुभवसिद्धा\nभवन्त्यविवेकित्वादयः। ये पुनः सत्त्वादयो नान्युभवपथमधिरोहन्ति,\nतेषां कुतस्त्यमविवेकित्वं विषयत्वमचेतनत्वं प्रसवधर्मित्वं च? इत्यत आह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000485.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000486", "originalText": "अविवेक्यादेः सिद्धिस्त्रैगुण्यातद्विपर्ययाभावात्। कारणगुणात्मकत्वात्कार्यस्याव्यक्तमपि सिद्धम्॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000486.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000487", "originalText": "᳚अविवेक्यादेः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000487.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000488", "originalText": "अविवेकित्वमविवेकि।", "padacchedaText": "", "audioFile": "PB_hear2read_000488.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000489", "originalText": "यथा 'द्व्येकयोर्द्विवचनैकवचने'\n(पा. सू. १.४.२२) इत्यत्र द्वित्वैकत्वयोरिति, अन्यथा द्व्येकेष्विति स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000489.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000490", "originalText": "कुतः पुनरविवेकित्वादेः सिद्धिरित्यत्र आह— ᳚त्रैगुण्यात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000490.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000491", "originalText": "᳚यद्यत्\nसुखदुःखमोहात्मकं तत्तदविवेकित्वादियोगि, यथेदमनुभूयमानं व्यक्तम्᳚\nइति स्फुटत्वादन्वयो नोक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000491.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000492", "originalText": "व्यतिरेकमाह— ᳚तद्विपर्ययाभावात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000492.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000493", "originalText": "अविवेक्यादिविपर्यये पुरुषे\nत्रैगुण्याभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000493.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000494", "originalText": "अथ वा व्यक्ताव्यक्ते पक्षीकृत्यान्वयाभावेनावीत एव हेतुस्त्रैगुण्यादिति\nवक्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000494.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000495", "originalText": "स्यादेतत्— अव्यक्तसिद्धौ सत्यां तस्याविवेकित्वादयो धर्माः सिध्यन्ति,\nअव्यक्तमेव त्वद्यापि न सिध्यति, तत्कथमविवेकित्वादिसिद्धिरत आह—\n᳚कारणगुणात्मकत्वात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000495.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000496", "originalText": "अयमभिसन्धिः— कार्यं हि कारणगुणात्मकं दृष्टम्, यथा\nतन्त्वादिगुणात्मकं पटादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000496.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000497", "originalText": "तथा महदादिलक्षणेनापि कार्येण\nसुखदुःखमोहरूपेण स्वकारणं सुखदुःखमोहात्मकं प्रधानमव्यक्तं\nसिद्धं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000497.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000498", "originalText": "कारिका १५—१६\n\nस्यादेतत्— 'व्यक्तात् व्यक्तमुत्पद्यते' इति कणभक्षाक्षचरणतनयाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000498.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000499", "originalText": "परमाणवो हि व्यक्ताः, तेभ्यो द्व्यणुकादिक्रमेण पृथिव्यादिलक्षणं\nकार्यं व्यक्तमारभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000499.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000500", "originalText": "पृथिव्यादिषु च कारणगुणक्रमेण\nरूपाद्युत्पत्तिः। तस्मात् व्यक्तात् व्यक्तस्य तद्गुणस्य चोत्पत्तेः\nकृतमदृष्टचरेणाव्यक्तेनेत्यत आह—॥", "padacchedaText": "", "audioFile": "PB_hear2read_000500.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000501", "originalText": "भेदानां परिमाणात् समन्वयात् शक्तितः प्रवृत्तेश्च। कारणकार्यविभागादविभागाद्वैश्वरूप्यस्य॥ १५॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000501.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000502", "originalText": "कारणमस्त्यव्यक्तम्, प्रवर्तते त्रिगुणतः समुदयाच्च। परिणामतः सलिलवत् प्रतिप्रतिगुणाश्रयविशेषात्॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000502.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000503", "originalText": "᳚भेदानाम्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000503.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000504", "originalText": "भेदानां— विशेषाणां महदादीनां\nभूम्यन्तानां कार्याणां कारणं— मूलकारणमस्त्यव्यक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000504.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000505", "originalText": "कुतः? ᳚कारणकार्यविभागादविभागाद्वैश्वरूप्यस्य᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000505.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000506", "originalText": "कारणे सत् कार्यमिति स्थितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000506.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000507", "originalText": "तथा च यथा कूर्मशरीरे सन्त्येवाऽङ्गानि निःसरन्ति विभज्यन्ते—\n'इदं कूर्मशरीरं, एतान्येतस्याङ्गानि'— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000507.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000508", "originalText": "एवं निविशमानानि\nतस्मिन् अव्यक्तीभवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000508.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000509", "originalText": "एवं कारणामृत्पिण्डाद्धेमपिण्डाद्वा कार्याणि\nघटमुकुटादीनि सन्त्येवाविर्भवन्ति विभज्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000509.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000510", "originalText": "सन्त्येव पृथिव्यादीनि\nकारणात्तन्मात्रादाविर्भवन्ति विभज्यन्ते, सन्त्येव च तन्मात्राण्यहङ्कारात्\nकारणात्, सन्त्येवाहङ्कारः कारणान्महतः, सन्नेव च महान् परमाव्यक्तात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000510.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000511", "originalText": "सोऽयं कारणात् परमाव्यक्तात् साक्षात् पारम्पर्येणान्वितस्य विश्वस्य कार्यस्य\nविभागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000511.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000512", "originalText": "प्रतिसर्गे तु मृत्पिण्डं सुवर्णपिङ्गं वा घटमुकुटादयो\nविशन्तोऽव्यक्तीभवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000512.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000513", "originalText": "तत्कारणरूपमेवानभिव्यक्तं\nकार्यमपेक्ष्याव्यक्तं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000513.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000514", "originalText": "एवं पृथिव्यादयस्तन्मात्राणि विशन्तः\nस्वापेक्षया तन्मात्राण्यव्यक्तयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000514.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000515", "originalText": "एवं तन्मात्राण्यहङ्कारं\nविशन्त्यहङ्कारमव्यक्तयन्ति, एवमहङ्कारो महान्तमाविशन्\nमहान्तमव्यक्तयति, महान् प्रकृतिं स्वकारणं विशन् प्रकृतिमव्यक्तयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000515.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000516", "originalText": "प्रकृतेस्तु न क्वचिन्निवेश इति सा सर्वकार्याणामव्यक्तमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000516.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000517", "originalText": "सोऽयमविभागः प्रकृतौ वैश्वरूप्यस्य— नानारूपस्य कार्यस्य,\nस्वार्थिकः ष्यञ्, तस्मात् कारणे कार्यस्य सत एव विभागाविभागाभ्यामव्यक्तं\nकारणमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000517.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000518", "originalText": "इतश्चाव्यक्तमस्तीत्यत आह— ᳚शक्तितः प्रवृत्तेश्च᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000518.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000519", "originalText": "कारणशक्तितः कार्यं प्रवर्तत इति सिद्धम्, अशक्तात् कारणात्\nकार्यस्यानुपपत्तेः, शक्तिश्च कारणगतो न कार्यस्याव्यक्तत्वादन्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000519.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000520", "originalText": "न हि\nसत्कार्यपक्षे कार्यस्याव्याव्यक्तताया अन्यस्यां शक्तौ प्रमाणमस्ति, अयमेव हि\nसिकताभ्यस्तिलानां तैलोपादानानां भेदो यदेतेष्वेवे तैलमस्त्यनागतावस्थं\nन सिकतास्विति।", "padacchedaText": "", "audioFile": "PB_hear2read_000520.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000521", "originalText": "स्यादेतत्— शक्तितः प्रवृत्तिः कारणकार्यविभागाविभागौ च महत एव\nपरमाव्यक्तत्वं साधयिष्यतः, कृतं ततः परेणाव्यक्तेनेत्यत आह—\n᳚परिमाणात्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000521.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000522", "originalText": "परिमितत्वात्, अव्यापित्वादिति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000522.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000523", "originalText": "विवादाध्यासिता\nमहदादिभेदा अव्यक्तकारणवन्तः, परिमितत्वात्, घटादिवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000523.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000524", "originalText": "घटादयो\nहि परिमिताः मृदाद्यव्यक्तकारणका दृष्टाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000524.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000525", "originalText": "उक्तमेतद्यथा\nकार्यस्याव्यक्तावस्था कारणमेवेति, यन्महतः कारणं यत् परमाव्यक्तम्,\nततः परतराव्यक्तकल्पनायां प्रमाणाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000525.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000526", "originalText": "इतश्च विवादाध्यासिता भेदाः अव्यक्तकारणवन्तः, ᳚समन्वयात्᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000526.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000527", "originalText": "भिन्नानां समानरूपता समन्वयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000527.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000528", "originalText": "सुखदुःखमोहसमन्विता हि\nबुद्ध्यादयोऽध्यवसायादिलक्षणाः प्रतीयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000528.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000529", "originalText": "यानि च यद्रूपसमनुगतानि,\nतानि तत्स्वभावाव्यक्तकारणानि, यथा मृद्धेमपिण्डसमनुगता घटमुकुटादयो\nमृद्धेमपिण्डाव्यक्तकारणका इति कारणमस्त्यव्यक्तं भेदानामिति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000529.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000530", "originalText": "अव्यक्तं साधयित्वा अस्य प्रवृत्तिप्रकारमाह— ᳚प्रवर्तने त्रिगुणतः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000530.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000531", "originalText": "प्रतिसर्गावस्थायां सत्त्वं रजस्तमश्च सदृशपरिणामानि भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000531.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000532", "originalText": "परिणामस्वभावा हि गुणा नापरिणम्य क्षणमप्यवतिष्ठन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000532.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000533", "originalText": "तस्मात् सत्त्वं\nसत्त्वरूपतया, रजो रजोरूपतया, तमस्तमोरूपतया प्रतिसर्गावस्थायामपि\nप्रवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000533.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000534", "originalText": "तदिदमुक्तं— ᳚त्रिगुणतः᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000534.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000535", "originalText": "प्रवृत्त्यन्तरमाह— ᳚समुदयाच्च᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000535.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000536", "originalText": "समेत्य उदयः— 'समुदयः'\nसमवायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000536.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000537", "originalText": "समुदयश्च गुणानां न गुणप्रधानभावमन्तरेण\nसम्भवति, न च गुणप्रधानभावो वैषम्यं विना, न\nच वैषम्यमुपमर्द्योपमर्दकभावादृते, इति महदादिभावेन\nप्रवृत्तिर्द्वितीया।", "padacchedaText": "", "audioFile": "PB_hear2read_000537.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000538", "originalText": "स्यादेतत्— कथमेकरूपाणां गुणानामनेकरूपा\nप्रवृत्तिरित्यत आह— ᳚परिणामतः सलिलवत्᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000538.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000539", "originalText": "यथा हि वारिदविमुक्तमुदकमेकरसमपि तत्त्द्भूविकारानासाद्य\nनारिकेलतालतालीबिल्वचिरबिल्वतिन्दुकामलकप्राचीनामलककपित्थफलरसतया\nपरिणमन्मधुराम्ललवणतिक्तकषायकटुतया विकल्पते,\nएवमेकैकगुणसमुद्भवात् प्रधानं गुणमाश्रित्याप्रधानगुणाः परिणामभेदान्\nप्रवर्तयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000539.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000540", "originalText": "तदिदमुक्तम्— ᳚प्रतिप्रतिगुणाश्रयविशेषात्᳚।", "padacchedaText": "", "audioFile": "PB_hear2read_000540.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000541", "originalText": "एकैकगुणाश्रयेण यो विशेषस्तस्मादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000541.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}, {"id": "B_000542", "originalText": "कारिका १६", "padacchedaText": "", "audioFile": "PB_hear2read_000542.mp3", "zipFile": "SankhyaTattvaKaumudi.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
