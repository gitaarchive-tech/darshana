    <script>
        const WORKER_URL = "https://bhashya-audio-worker.anantachaitanya108.workers.dev";
        const BUCKET_NAME = "darshana";

        const manifest = [{"id": "B_000000", "originalText": "तर्कसंग्रह अध्याय १— ८ \nअथ प्रथमोऽध्याय।", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000001", "originalText": "निधाय हृदि विश्वेशं विधाय गुरुवन्दनम्। बालानां सुखबोधाय क्रियते तर्कसंग्रह॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000002", "originalText": "दीपिका\nविश्वेश्वरं साम्बमूर्तिं प्रणिपत्य गिरां गुरुम्। टीकां शिशुहितां कुर्वे तर्कसंग्रहदीपिकाम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000003", "originalText": "चिकीर्षितस्य ग्रनथस्य निर्विघ्नपरिसमाप्त्यर्थं\nशिष्टाचारानुमितश्रुतिबोधितकर्तव्यताक्—इष्टदेवतानमस्कारात्मकं\nमङ्गलं शिष्यशिक्षायै ग्रन्थतो निबध्नंश्चिकीर्षितं प्रतिजानीते।", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000004", "originalText": "निधायेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000005", "originalText": "ननु मङ्गलस्य समाप्तिसाधनत्वं नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000006", "originalText": "मङ्गले कृतेऽपि\nकिरणवल्यादौ समाप्त्यदर्शनात्, मङ्गलाभावेऽपि कादम्बर्मादौ\nसमाप्तिदर्शनाच्च अन्वयव्यतिरेकाभ्यां व्यभिचारादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000007", "originalText": "किरणावल्यादौ विघ्नबाहुल्यात्समाप्त्यभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000008", "originalText": "कादम्बर्यादौ ग्रन्थाद्वहिरेव\n\nमङ्गलं कृत्मतो न व्यभिचारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000009", "originalText": "ननु मङ्गलस्य (ग्रन्थादौ)\nकर्तव्यत्वे किं प्रमाणमिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000010", "originalText": "शिष्टाचारानुमितश्रुतेरेव्\nप्रमाणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000011", "originalText": "तथा हि मङ्गलं\nवेद—बोधित्कर्तव्यताकमलौकिकाविगीतशिष्टाचारविषयत्वाद्दर्शादिवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000012", "originalText": "भोजनादौ व्यभिचार वारणाय अलौकिकेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000013", "originalText": "रात्रिश्राद्धादौ\nव्यभिचारवारणाय अविगीतेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000014", "originalText": "शिष्टपदं स्पष्टार्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000015", "originalText": "न\nकुर्यान्निष्फलं कर्म इति जलताडनादेरपि निषिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000016", "originalText": "तर्क्यन्ते\nप्रतिपाद्यन्ते इति तर्काः द्रव्यादिपदार्थास्तेषां संग्रहः संक्षेपेण\nस्वरूपकथनं क्रियत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000017", "originalText": "कस्मै प्रयोजनायेत्यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000018", "originalText": "सुखबोधायेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000019", "originalText": "सुखेनानायासेन यो बोधः पदार्थज्ञानं तस्मा इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000020", "originalText": "ननु बहुषु तर्कग्रथेषु सत्सु किमर्थम्पूर्वोऽयं ग्रन्थः क्रियत\nइत्यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000021", "originalText": "बालानामिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000022", "originalText": "तेषामतिविस्तृतत्वाद्वालानां बोधो न जायत\nइत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000023", "originalText": "ग्रहणधारणपुटुर्बालः न तु स्तनन्धयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000024", "originalText": "किं कृत्वा\nक्रियत इत्यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000025", "originalText": "निधायेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000026", "originalText": "विश्वेशं जगन्नियन्तारम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000027", "originalText": "हृदि निधाय\n\nनितरां स्थापयित्वा सदा तद्धयानपरो भूत्वेत्यर्थः। गुरूणां\nविद्यागुरूणां,वन्दनं नम्स्कारं, विधाय कृत्वेत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000028", "originalText": "द्रव्यगुणकर्मसामान्यविशेषसमवायाऽभावाः सप्तपदार्थाः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000029", "originalText": "दीपिका\nपदार्थान् विभ्जते।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000030", "originalText": "द्रव्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000031", "originalText": "पदस्यार्थः पदार्थः इति\nव्युत्पत्त्याभिधेयत्वं पदार्थसामान्यलक्षणम् (लभ्यते)।", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000032", "originalText": "ननु\nविभागादेव सप्तत्वे सिद्धे सप्त (पद) ग्रहणं व्यर्थमिति चेत्,\nन अधिकसंख्याव्यवच्छेदार्थकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000033", "originalText": "नन्वतिरिक्तः पदार्थः\nप्रमितो वा न वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000034", "originalText": "नाऽद्यः प्रमितस्य निषेधायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000035", "originalText": "न द्वितीयः\nप्रतियोगिप्रमितिं विना निषेधानुपपत्तेरिति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000036", "originalText": "पदार्थत्वं\nद्रव्यादिसप्तान्यतमत्वव्याप्यमिति व्यवच्छेदार्थकत्वात्\n(सप्तग्रहणम्)।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000037", "originalText": "ननु सप्तान्यतमत्वं सप्तभिन्नभिन्नत्वमिति\nवक्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000038", "originalText": "सप्तभिन्नस्याप्रसिद्धया कथं सप्तान्यतमत्वव्याप्तिनिश्चय\nइति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000039", "originalText": "द्रव्यादिसप्तान्यतमत्वं नाम\nद्रव्यादिभेदसप्तकाभाववत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000040", "originalText": "अतो दोषविरहात्। एवमग्रेऽपि\nद्रष्टव्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000041", "originalText": "तत्र द्रव्याणी पृथिव्यप्तेजोवाय्वाकाशकालदिगात्ममनांसि नवैव॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000042", "originalText": "दीपिका\nदव्यं (द्रव्याणि) विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000043", "originalText": "तत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000044", "originalText": "तत्र द्रव्यादिमध्ये।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000045", "originalText": "द्रव्याणि नवैवेत्यन्वयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000046", "originalText": "कानि तानि इत्यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000047", "originalText": "पृथिवीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000048", "originalText": "ननु तमसो\n\nदशमद्रव्यस्य विद्यमानत्वात्कथं नवैव द्रव्याणीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000049", "originalText": "तथा हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000050", "originalText": "नीलं\nतमश्चलतीत्यबाधितप्रतीतिबलान्नीलरूपाधारतया क्रियाधारतया च\nतमसो द्रव्यत्वं ताव्त् सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000051", "originalText": "तत्र तमसो नाकाशादिपञ्चकेऽन्तर्भावः\nरूपवत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000052", "originalText": "अत एव न वायौ, स्पर्शाभावात् सदागतिमत्त्वाभावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000053", "originalText": "नापि तेजसि, भास्वरूपाभावात् उष्णस्पर्शाभावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000054", "originalText": "नापि जले,\nशीतस्पर्शाभावात् नीलरूपवत्त्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000055", "originalText": "नापि पृथिव्यां, गन्धाभावात्\nस्पर्शरहितत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000056", "originalText": "तस्मात्तमो दशमद्रव्यमिति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000057", "originalText": "तमसस्तेजोऽभावरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000058", "originalText": "तथा हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000059", "originalText": "तमो न\nरूपिद्रव्यमालोकासहकृतचक्षुर्ग्राह्यत्वादालोकाभाववत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000060", "originalText": "रूपिद्रव्यचाक्षुषप्रमायामालोकस्य कारणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000061", "originalText": "तस्मात्\nप्रौढप्रकाशकतेजस्सामान्याभावस्तमः, तत्र नीलं तमश्चलति इति\nप्रत्ययो भ्रमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000062", "originalText": "अतो नव द्रव्याणीति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000063", "originalText": "द्रव्यत्वजातिमत्त्वं\nगुणवत्त्वं वा द्रव्यसामान्यलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000064", "originalText": "लक्ष्यैकदेशावृत्तित्वमव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000065", "originalText": "यथा गोः कपिलत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000066", "originalText": "अलक्ष्ये लक्षणस्य वर्तनमतिव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000067", "originalText": "यथा गोः\nश‍ृङ्गित्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000068", "originalText": "लक्ष्यमात्रावृत्तित्वमसंभवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000069", "originalText": "यथा\nगोरेकशफवत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000070", "originalText": "एतद्दूषणत्रयरहितधर्मो लक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000071", "originalText": "स\nएवासाधारणधर्म इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000072", "originalText": "लक्षयतावच्छेदकसमनियतत्वमसाधारणत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000073", "originalText": "व्यावर्तकस्यैव\nलक्षणत्वे व्यावृत्तावभिदेयत्वादौ चातिव्याप्तिरतस्तद्वारणाय\nतद्भिन्नत्वं धर्मविशेषणं देयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000074", "originalText": "व्यवहारस्यापि लक्षणप्रयोजनत्वे\nतन्न देयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000075", "originalText": "व्यावृत्तेरपि व्यवहारसाधनत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000076", "originalText": "ननु गुणवत्त्वं न\nद्रव्यलक्षणम्, आद्यक्षणावच्छिन्नघटे उत्पन्नविनिष्टघटे\nचाव्याप्तेरिति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000077", "originalText": "गुणसमानाधिकरणसत्ताभिन्नजातिमत्त्वस्य\nविवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000078", "originalText": "नन्वेवमपि एकं रूपं रसात्पृथक् इति\nव्यवहाराद्रूपादावतिव्याप्तिरिति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000079", "originalText": "एकार्थसमवायादेव\nतादृशव्यवहारोपपत्तौ गुणे गुणानङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000080", "originalText": "रूप—रस—गन्ध—स्पर्श—संख्या—परिमाण—पृथक्त्व—संयोग—विभाग—पर्\nअत्वा—ऽपरत्व—गुरूत्व—द्रवत्व—स्नेह—शब्द—बुद्धि—सुख—दुःखेच्छा\nद्वेष—प्रयत्न—धर्माधर्म—संस्काराः चतुर्विंशतिर्गुणाः॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000081", "originalText": "दीपिका\nगुणान्विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000082", "originalText": "रूपेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000083", "originalText": "द्रव्यकर्मभिन्नत्वे सति सामान्यवान् गुणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000084", "originalText": "गुणत्वजातिमान्वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000085", "originalText": "ननु लघुत्वकठिनत्वमृदुत्वादीनां विद्यमानत्वात्\nकथं चतुर्विंशतिर्गुणा इति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000086", "originalText": "लघुत्वस्य\nगुरूत्वाभावरूपत्वान्मृदुत्वकठिनत्वयोः अवयवसंयोगविशेषत्वात्। उत्क्षेपणापक्षेपणाकुञ्चनप्रसारणगमनानि पञ्च कर्माणि॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000087", "originalText": "दीपिका\nकर्म विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000088", "originalText": "उत्क्षेपणेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000089", "originalText": "संयोगभिन्नत्वे सति\nसंयोगासमवायिकारणं कर्म कर्मत्वजातिमद्वा। भ्रमणादीनामपि गमने\nअन्तर्भावान्न पञ्चत्वविरोधः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000090", "originalText": "परमपरं चेति द्विविधं सामान्यम्॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000091", "originalText": "दीपिका\nसामान्यं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000092", "originalText": "परमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000093", "originalText": "परमधिकदेशवृत्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000094", "originalText": "अपरं\nन्यूनदेशवृत्ति। सामान्यादिचतुष्टये जातिर्नास्ति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000095", "originalText": "नित्यद्रव्यवृत्तयो विशेषास्त्वनन्ता एव॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000096", "originalText": "दीपिका\nविशेषं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000097", "originalText": "नित्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000098", "originalText": "पृथिव्यादिचतुष्टयपरमाणवः\nआकाशादिपञ्चकं च नित्यद्रव्याणि। समवायस्त्वेक एव॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000099", "originalText": "दीपिका\nसमवायस्य भेदो नास्तीत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000100", "originalText": "समवायस्त्विति। अभावश्चतुर्विधः— प्रागभावः, प्रध्वंसाभावः,\nअत्यन्ताभावः, अन्योन्याभावश्चेति॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000101", "originalText": "दीपिका\nअभावं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000102", "originalText": "प्रागभावेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000103", "originalText": "अथ द्वितीयोऽध्याय।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000104", "originalText": "तत्र गन्धवती पृथिवी।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000105", "originalText": "सा द्विविधा—नित्याऽनित्या च।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000106", "originalText": "नित्याः\nपरमाणुरूपाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000107", "originalText": "अनित्याः कार्यरूपाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000108", "originalText": "पुनस्त्रिविधाः शरीरेन्द्रिय विषयभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000109", "originalText": "शरीरमस्मदादीनाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000110", "originalText": "इन्द्रियं गन्धग्राहकं घ्राणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000111", "originalText": "तच्च नासाग्रवर्ति। विषयो मृत्पाषाणादिः॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000112", "originalText": "दीपिका\nतत्रोद्देशक्रमानुसारात् प्रथमं पृथिव्या लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000113", "originalText": "तत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000114", "originalText": "नाना\nपदार्थसंकीर्तनमुद्देशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000115", "originalText": "उद्देशक्रमे च सरवत्रेच्छैवं नियामिका।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000116", "originalText": "ननु सुरभ्यसुरभ्यवयवाख्धे द्रव्ये परस्परविरोधेन\nगन्धानुत्पादादव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000117", "originalText": "न च तत्र गन्धप्रतीत्यनुपपत्तिरिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000118", "originalText": "अवयवगन्धस्यैव तत्र प्रतीतिसंभवेन चित्रगन्धानङ्गीकारात् किं\nचोत्पन्नविनष्टघटादावव्याप्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000119", "originalText": "गन्धसमानाधिकरणद्रव्यत्वापरजातिमत्त्वस्य विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000120", "originalText": "ननु\nजलादावपि गन्धप्रतीतिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000121", "originalText": "अन्वयव्यतिरेकाभ्यां\nपृथिवीगन्धस्यैव तत्र भानाङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000122", "originalText": "ननु कालस्य सर्वाधारतया\nसर्वेषां लक्षणानां कालेऽतिव्याप्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000123", "originalText": "सर्वाधारताप्रयोजकभिन्नसंबन्धेन लक्षणत्वस्य विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000124", "originalText": "पृथिवीं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000125", "originalText": "सा द्विविधेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000126", "originalText": "नित्यत्वं ध्वंसाप्रतियोगित्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000127", "originalText": "अनित्यत्वं ध्वंसप्रतियोगित्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000128", "originalText": "प्रकारान्तरेण विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000129", "originalText": "पुनरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000130", "originalText": "आत्मनो\n\nभोगायतनं शरीरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000131", "originalText": "यदवच्छिन्नात्मनि भोगो जायते तद्भोगायतनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000132", "originalText": "सुखदुःखसाक्षात्कारो भोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000133", "originalText": "शब्देतरोद्भूतविशेषगुणानाश्रयत्वे सति\nज्ञानकारणमनः संयोगाश्रयत्वमिन्द्रियत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000134", "originalText": "शरीरेन्द्रियभिन्नो\nविषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000135", "originalText": "एवं च गन्धवच्छरीरं पार्थिवशरीरम्,\nगन्धवदिन्द्रियं पार्थिवेन्द्रियम्, गन्धवान् विषयः पार्थिवविषय\nइति तत्तल्लक्षणं बोध्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000136", "originalText": "पार्थिवशरीरं दर्शयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000137", "originalText": "शरीरमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000138", "originalText": "इन्द्रियं दर्शयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000139", "originalText": "इन्द्रियमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000140", "originalText": "गन्धग्राहकमिति प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000141", "originalText": "घ्राणमिति\nसंज्ञा।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000142", "originalText": "नासाग्रेत्याश्रयोक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000143", "originalText": "एवमुत्तरत्र ज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000144", "originalText": "पार्थिवविषयं\nदर्शयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000145", "originalText": "मृतपाषाणादीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000146", "originalText": "शीतस्पर्शवत्यः आपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000147", "originalText": "ता द्विविधाः नित्या अनित्याश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000148", "originalText": "नित्याः\nपरमाणुरूपाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000149", "originalText": "अनित्याः कार्यरूपाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000150", "originalText": "पुनः त्रिविधाः\nशरीरेन्द्रियविषयभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000151", "originalText": "शरीरं वरूणलोके।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000152", "originalText": "इन्द्रियं रसग्राहकं\nरसनं जिह्वाग्रवर्ति। विषयः सरित् समुद्रादिः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000153", "originalText": "दीपिका\nअपां लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000154", "originalText": "शीतेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000155", "originalText": "उतपन्नविनिष्टजलेऽव्याप्तिवारणाय\nशीतस्पर्शसमानाधिकरणद्रव्यत्वापरजातिमत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000156", "originalText": "``शीतं\nशिलातलम्᳚ इत्यादौ जलसंबन्धादेव शीतस्पर्शभानमिति\nनातिव्याप्तिः। अन्यत्सर्वं पूर्वरीत्या व्याख्येयम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000157", "originalText": "उष्णस्पर्शवत् तेजः।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000158", "originalText": "तच्च द्विविधं, नित्यमनित्यं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000159", "originalText": "नित्यं\nपरमाणुरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000160", "originalText": "अनित्यं कार्यरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000161", "originalText": "पुनः त्रिविधं\nशरीरेन्द्रियविषयभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000162", "originalText": "शरीरं आदित्यलोके प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000163", "originalText": "इन्द्रियं\nरूपग्राहकं चक्षुः कृष्णताराग्रवर्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000164", "originalText": "विषयः चतुर्विधः,\nभौम—दिव्य—औदर्य—आकरजभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000165", "originalText": "भौमं वह्नयादिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000166", "originalText": "अबिन्धनं\nदिव्यं विद्युदादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000167", "originalText": "भुक्तस्य परिणामहेतुरौदर्यम्। आकरजं सुवर्णादि॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000168", "originalText": "दीपिका\nतेजसो लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000169", "originalText": "उष्णस्पर्शवदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000170", "originalText": "`उष्णं जलम्' इति\nप्रतीतेस्तेजः संयोगानुविधायित्वान्नातिव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000171", "originalText": "विषयं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000172", "originalText": "भौमेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000173", "originalText": "ननु `सुवणं पार्थिवं' पीतत्वाद्गुरूत्वात् हरिद्रावत् इति\nचेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000174", "originalText": "अत्यन्तानलसंयोगे सति घृतादौ द्रव्त्वनाशदर्शनेन,\nजलमध्यस्थघृतादौ तन्नाशादर्शनेन च असति प्रतिबन्धके\nपार्थिवद्रवत्वनाशाग्निसंयोगयोः कार्यकारणभावावधारणात्सुवर्णस्य\nअत्यन्तानलसंयोगे सत्यनुच्छिद्यमानद्रवत्वाधिकरणत्वेन\nपार्थिवत्वाऽनुपपत्तेः पीतद्रव्यद्रवत्वनाशप्रतिबन्धकतया\nद्रवद्रव्यान्तरसिद्धौ नैमित्तिकद्रवत्वाधिकरणतया जलत्वानुपपत्तेः\nरूपवत्तया वाय्वादिष्वनन्तर्भावात्तेजसत्वसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000175", "originalText": "तस्योष्णस्पर्शभास्वररूपयोरूपष्टम्भक पार्थिवरूपस्पर्शाभ्यां\nप्रतिबन्धादनुपलब्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000176", "originalText": "तस्मात् सुवर्णं तैजसमिति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000177", "originalText": "रूपरहितः स्पर्शवान् वायुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000178", "originalText": "स द्विविधः नित्यः अनित्यश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000179", "originalText": "नित्यः\nपरमाणुरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000180", "originalText": "अनित्यः कार्यरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000181", "originalText": "पुनः त्रिविधः शरीरेन्द्रियविषय\nभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000182", "originalText": "शरीरं वायुलोके।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000183", "originalText": "इन्द्रियं स्पर्शग्राहकं त्वक् सर्वशरीरवर्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000184", "originalText": "विषयो वृक्षादिकम्पनहेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000185", "originalText": "शरीरान्तःसंचारी वायुः प्राणः। स च\nएकोऽपि उपाधिभेदात् प्राणापानादिसंज्ञां लभते॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000186", "originalText": "दीपिका\nवायुं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000187", "originalText": "रूपरहितेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000188", "originalText": "आकाशादावतिव्याप्तिवारणाय स्पर्शवानिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000189", "originalText": "पृथिव्यादावतिव्याप्तिवारणाय रूपरहितेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000190", "originalText": "प्राणस्य कुत्रान्तर्भाव इत्यत\nआह।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000191", "originalText": "शरीरेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000192", "originalText": "स चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000193", "originalText": "एक एवः प्राणः स्थानभेदात्प्राणापानादिशब्दैः\nव्यवह्रियत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000194", "originalText": "स्पर्शानुमेयो वायुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000195", "originalText": "तथा हि— योऽयं वायौ\nवाति सति अनुष्णाशीतस्पर्श उपलभ्यते स क्कचिदाश्रितः\nगुणत्वाद्रूपवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000196", "originalText": "न चास्य आश्रयः पृथिवी\nउद्भूतस्पर्शवत्पार्थिवस्योद्भूतरूपत्त्वनियमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000197", "originalText": "न जल तेजसि\nअनुष्णाशीतस्पर्शवत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000198", "originalText": "न विभुचतुष्टयम् सर्वत्रोपलब्धिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000199", "originalText": "न मनः परमाणुस्पर्शस्यातीन्द्रियत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000200", "originalText": "तस्माद्यः प्रतीयमानस्पर्शाश्रयः\n\nस वायुः (एव)।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000201", "originalText": "ननु वायुः प्रत्यक्षः प्रत्यक्षाश्रयत्वात् घटवत्\n\nइति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000202", "originalText": "उद्भूतरूपस्योपाधित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000203", "originalText": "``यत्र द्रव्यत्वे सति\nबहिरिन्द्रियजन्यप्रत्यक्षत्वं, तत्र उद्भूतरूपवत्त्वम्'' इति\nसाध्यव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000204", "originalText": "पक्षे साधनाव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000205", "originalText": "न चैवं\nतप्तवारिस्थतेजसोऽपि अप्रत्यक्षत्वापत्तिः इष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000206", "originalText": "तस्माद्रूपरहितत्वाद्वायुरप्रत्यक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000207", "originalText": "इदानीं\nकार्यरूपपृथिव्यादिचतुष्टयस्योत्पत्तिविनाशक्रमः कथ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000208", "originalText": "ईश्वरस्य\nचिकीर्षावशात्परमाणुषु क्रिया जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000209", "originalText": "ततः परमाणुद्वयसंयोगे\nद्वयणुकमुत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000210", "originalText": "त्रिभिरेव द्वयणुकैस्त्रयणुकमुत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000211", "originalText": "एवं\nचतुरणुकादिक्रमेण महती पृथिवीः, महत्य आपः, महत्तेजः,\n\nमहान्वायुरूत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000212", "originalText": "एवमुत्पन्नस्य कार्यद्रव्यस्य संजिहीर्षावशात्\nक्रियया परमाणुद्वयविभागे द्वयणुकनाशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000213", "originalText": "इत्येवं पृथिव्यादिनाशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000214", "originalText": "असमवायिकारणाशात् द्वयणुकनाशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000215", "originalText": "समवायिकारणाशात् त्र्यणुकनाश इति\nसंप्रदायः सर्वत्रासमवायिकारणनाशात् द्रव्यनाश इति नवीनाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000216", "originalText": "किं पुनः\n\nपरमाणुसद्भावे प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000217", "originalText": "उच्यते—— जालसूर्यमरीचिस्थं सर्वतः\nसूक्षमतमं यत् द्रव्यं उपलभ्यते तत्सावयवं\nचाक्षुषद्रव्यत्वाद्धटवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000218", "originalText": "त्र्यणुकावयवोऽपि सावयवः\nमहदारम्भकत्वात्कपालवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000219", "originalText": "यो द्वयणुकावयवः स परमाणुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000220", "originalText": "स च\nनित्यं, तस्यापि कार्यत्वे अनवस्थाप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000221", "originalText": "सृष्टिप्रलयसद्भावे\n``धाता यथापूर्वमकल्पयत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000222", "originalText": "'' इति श्रुतिरेव प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000223", "originalText": "`सर्वकार्यद्रव्यध्वंसोऽवान्तरप्रलयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000224", "originalText": "सर्वभावकार्यध्वंसो\nमहाप्रलयः' इति विवेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000225", "originalText": "शब्दगुणकमाकाशम्। तच्चैकं नित्यञ्च॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000226", "originalText": "दीपिका\nआकाशं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000227", "originalText": "शब्दगुणकमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000228", "originalText": "नन्वाकाशमपि\nपृथिव्यादिवन्नाना, किं नेत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000229", "originalText": "तच्चैकमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000230", "originalText": "भेदे\nप्रमाणाभावादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000231", "originalText": "एकत्वादेव सर्वत्र\nशब्दोपलब्धेर्विभुत्वमङ्गीकर्तव्यमित्याह विभ्विति।", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000232", "originalText": "सर्वमूर्तद्रव्यसंयोगित्वं विभुत्वं, मूर्तत्वं\nपरिच्छिन्नपरिमाणवत्त्वं क्रियावत्त्वं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000233", "originalText": "विभुत्वादेव\nआत्मवन्नित्यमित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000234", "originalText": "नित्यं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000235", "originalText": "अतीतादिव्यवहारहेतुः कालः। स चैको विभुर्नित्यश्च॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000236", "originalText": "दीपिका\nकालं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000237", "originalText": "अतीतेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000238", "originalText": "सर्वाधारः कालः सर्वकार्यनिमित्तकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000239", "originalText": "प्राच्यादिव्यवहारहेतुर्दिक्। सा चैका विभ्वी नित्या च॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000240", "originalText": "दीपिका\nदिशो लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000241", "originalText": "प्राचीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000242", "originalText": "दिगपि कार्यमात्रनिमित्तकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000243", "originalText": "ज्ञानाधिकरणमात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000244", "originalText": "स द्विविधः परमात्मा जीवात्मा च।", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000245", "originalText": "तत्रेश्वरः\nसर्वज्ञः परमात्मैक एव। जीवात्मा प्रतिशरीरं भिन्नो विभुर्नित्यश्च॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000246", "originalText": "दीपिका\nआत्मनो लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000247", "originalText": "ज्ञानेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000248", "originalText": "आत्मानं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000249", "originalText": "स द्विविध इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000250", "originalText": "परमात्मनो लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000251", "originalText": "तत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000252", "originalText": "नित्यज्ञानाधिकरणत्वमीश्वरत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000253", "originalText": "नन्वीश्वरसद्भावे किं प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000254", "originalText": "न तावत्प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000255", "originalText": "तद्धि बाह्यामान्तरं\nवा।", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000256", "originalText": "नाद्यः अरूपिद्रव्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000256.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000257", "originalText": "न द्वितीयः आत्मसुखदुःखादिव्यतिरिक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000257.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000258", "originalText": "नाप्यनुमानं लिङ्गाभावादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000258.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000259", "originalText": "अङ्कुरादिकं सकर्तृकं\nकार्यत्वाद्धटवत् इत्यनुमानस्यैव प्रमाणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000259.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000260", "originalText": "उपादानगोचरापरोक्षज्ञानचिकीर्षाकृतिमत्त्वं कर्तृत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000260.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000261", "originalText": "उपादानं\nसमवायिकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000261.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000262", "originalText": "सकलपरमाण्वादिसूक्ष्मदर्शित्वात्सर्वज्ञत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000262.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000263", "originalText": "यः\nसर्वज्ञः स सर्ववित् इत्यागमोऽपि तत्र प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000263.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000264", "originalText": "जीवस्य लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000264.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000265", "originalText": "जीव इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000265.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000266", "originalText": "सुखाद्याश्रयत्वं जीवलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000266.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000267", "originalText": "ननु मनुष्योऽहं ब्राह्मणोऽहम्\n\nइत्यादौ सर्वत्राहंप्रत्यये शरीरस्यैव विषयत्वाच्छरीरमेवात्मेति\nचेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000267.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000268", "originalText": "शरीरस्यात्मवे करपादिनाशे शरीरनाशादात्मनोऽपि\nनाशप्रसंगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000268.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000269", "originalText": "नापीन्द्रियाणामात्मत्वम्, `योऽहं घटमद्राक्षं\nसोऽहमिदानीं स्पृशामि' इत्यनुसन्धानाभावप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000269.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000270", "originalText": "अन्यानुभूतेऽर्थे अन्यस्यानुसंधानायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000270.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000271", "originalText": "तस्माद्देहेइन्द्रियव्यतिरिक्तो जीवः\n\nसुखदुःखादिवैचित्र्यात्प्रतिशरीरं भिन्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000271.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000272", "originalText": "स च न परमाणुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000272.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000273", "originalText": "सर्वशरीरव्यापिसुखाद्यनुपलब्धिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000273.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000274", "originalText": "न मध्यमपरिमाणवान् तथा\nसति अनित्यत्वप्रसङ्गेन कृथानाकृताभ्यागमप्रसङ्गात्। तस्मान्नित्यो\nविभुर्जीवः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000274.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000275", "originalText": "सुखाद्युपलब्धिसाधनमिन्द्रियं मनः। तच्च प्रत्यात्मनियतत्वादनन्तं\nपरमाणुरूपं नित्यं च॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000275.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000276", "originalText": "दीपिका\nमनसो लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000276.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000277", "originalText": "सुखेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000277.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000278", "originalText": "स्पर्शरहित्वे सति क्रियावत्वं मनसो\nलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000278.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000279", "originalText": "तद्विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000279.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000280", "originalText": "तच्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000280.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000281", "originalText": "एकैकस्यात्मन एकैकं मन\nइत्यात्मनामनेकत्वान् मसोऽप्यनेकत्वमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000281.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000282", "originalText": "परमाणुरूपमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000282.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000283", "originalText": "मध्यमपरिमाणवत्त्वे अनित्यत्वप्रसङ्गादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000283.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000284", "originalText": "ननु मनो विभु\nस्पर्शरहित्वे सति द्रव्यत्वादाकाशादिवदिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000284.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000285", "originalText": "मनसो विभुत्वे\nआत्ममनः संयोगस्याऽसमवायिकारणस्याभावाज्ज्ञानानुत्पत्तिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000285.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000286", "originalText": "न\nच विभुद्वयसंयोगोऽस्त्विति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000286.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000287", "originalText": "तत्संयोगस्य नित्यत्वेन\nसुषुप्त्यभावप्रसङ्गात, पुरीतद्रव्यतिरिक्तस्थले आत्ममनः\nसंयोगस्य सर्वदा विद्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000287.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000288", "originalText": "अणुत्वे तु यदा मनः पुरीतत् प्रविंशति\n\nतदा सुषुप्तिः यदा निस्सरति तदा ज्ञानोत्पत्तिरित्यणुत्वसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000288.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000289", "originalText": "अथ तृतीयोऽध्याय।", "padacchedaText": "", "audioFile": "PB_hear2read_000289.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000290", "originalText": "चक्षुर्मात्रग्राह्यो गुणो रूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000290.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000291", "originalText": "तच्च\nशुक्लनीलपीतरक्तहरितकपिशचित्र भेदात्सप्तविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000291.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000292", "originalText": "पृथिवीजलतेजोवृत्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000292.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000293", "originalText": "तत्र पृथिव्यां सप्तविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000293.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000294", "originalText": "अभावस्वरशुक्लं\nजले। भावस्वरशुक्लं तेजसि॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000294.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000295", "originalText": "दीपिका\nरूपं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000295.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000296", "originalText": "चक्षुरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000296.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000297", "originalText": "संख्यादावतिव्याप्तिवारणाय मात्रपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000297.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000298", "originalText": "रूपत्वेऽतिव्याप्तिवारणाय गुणपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000298.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000299", "originalText": "नन्वव्याप्यवृत्तिनीलादिसमुदाय एव\nचित्ररूपमिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000299.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000300", "originalText": "रूपस्य व्याप्यवृत्तित्वनियमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000300.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000301", "originalText": "ननु चित्रपटे\nअवयवरूपस्यैव प्रतीतिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000301.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000302", "originalText": "रूपरहितत्वेन\nपटस्याप्रत्यक्षत्वप्रसंगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000302.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000303", "originalText": "न च रूपवत्समवेतत्वं\nप्रत्यक्षत्वप्रयोजकं गौरवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000303.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000304", "originalText": "तस्मात्पटस्य\nप्रत्यक्षत्वान्यथानुपपत्त्या चित्ररूपसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000304.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000305", "originalText": "रूपस्याश्रयमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000305.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000306", "originalText": "पृथिवीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000306.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000307", "originalText": "आश्रयं विभज्य दर्शयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000307.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000308", "originalText": "तत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000308.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000309", "originalText": "रसनग्राह्यो गुणो रसः।", "padacchedaText": "", "audioFile": "PB_hear2read_000309.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000310", "originalText": "स च मधुराम्ललवणकतुकषायतिक्तभेदात्\nषड्विधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000310.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000311", "originalText": "पृथिवीजलवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000311.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000312", "originalText": "तत्र पृथिव्यां षड्विधः। जले\nमधुर एव॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000312.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000313", "originalText": "दीपिका\nरसं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000313.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000314", "originalText": "रसनेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000314.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000315", "originalText": "रसत्वेऽतिव्याप्तिवारणाय गुणपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000315.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000316", "originalText": "रसस्याश्रयमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000316.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000317", "originalText": "पृथिवीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000317.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000318", "originalText": "आश्रयं विभज्य दर्शयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000318.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000319", "originalText": "तत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000319.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000320", "originalText": "घ्राणाग्राह्यो गुणो गन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000320.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000321", "originalText": "स द्विविधः सुरभिरसुरभिश्च। पृथिवीमात्रव्रित्तिः॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000321.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000322", "originalText": "दीपिका\nगन्धं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000322.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000323", "originalText": "घ्राणेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000323.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000324", "originalText": "गन्धत्वेऽतिव्याप्तिवारणाय गुणपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000324.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000325", "originalText": "त्वगिन्द्रियमात्रग्राह्यो गुणः स्पर्शः।", "padacchedaText": "", "audioFile": "PB_hear2read_000325.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000326", "originalText": "स च त्रिविधः\nशीतोष्णानुष्णाशीतभेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000326.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000327", "originalText": "पृथिव्यप्तेजोवायुवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000327.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000328", "originalText": "तत्र शीतो जले।", "padacchedaText": "", "audioFile": "PB_hear2read_000328.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000329", "originalText": "उष्णस्तेजसि। अनुष्णाशीतः पृथिवीवायव्योः॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000329.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000330", "originalText": "दीपिका\nस्पर्शं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000330.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000331", "originalText": "त्वगिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000331.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000332", "originalText": "स्पर्शत्वेऽतिव्याप्तिवारणाय गुणपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000332.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000333", "originalText": "संयोगादावतिव्याप्तिवारणाय मात्रपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000333.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000334", "originalText": "रूपादिचतुष्टयं पृथिव्यां पाकजमनित्यं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000334.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000335", "originalText": "अन्यत्र अपाकजं\nनित्यमनित्यम् च। नित्यगतं नित्यम् अनित्यगतमनित्यम्॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000335.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000336", "originalText": "दीपिका\nपाकजमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000336.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000337", "originalText": "पाकस्तेजः संयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000337.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000338", "originalText": "तेन पूर्वरूपं नश्यति\nरूपान्तरमुत्पद्यत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000338.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000339", "originalText": "तत्र परमाणुष्वेव पाको न द्वयणुकादौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000339.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000340", "originalText": "आमनिक्षिप्ते घटे परमाणुषु रूपान्तरोत्पत्तौ श्यामघटनाशे\nपुनद्वर्यणुकादिक्रमेण रक्तघटोत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000340.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000341", "originalText": "तत्र परमाणवः\nसमवायिकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000341.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000342", "originalText": "तेजः संयोगोऽसमवायिकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000342.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000343", "originalText": "अदृष्टादिकं\nनिमित्तकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000343.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000344", "originalText": "द्वयणुकादिरूपे कारणरूपसमवायिकारणमिति पीलुपाकवादिनो\nवैशेषिकाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000344.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000345", "originalText": "पूर्वघटस्य नाशं विनैव् अवयविनि अवयवेषु च\nपरमाणुपर्यन्तेषु युगपद्रूपान्तरोत्पत्तिरिति पिठरपाकवादिनो नैयायिकाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000345.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000346", "originalText": "अत एव पार्थिवपरमाणुरूपादिकमनित्यमनित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000346.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000347", "originalText": "अन्यत्र\nजलादावित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000347.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000348", "originalText": "नित्यगतमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000348.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000349", "originalText": "परमाणुगतमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000349.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000350", "originalText": "अनित्यगतमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000350.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000351", "originalText": "द्वयणुकादिगतभित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000351.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000352", "originalText": "रूपादिचतुष्टयम् उद्भूतं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000352.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000353", "originalText": "अनुद्भूतमप्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2re daText": "", "audioFile": "PB_hear2read_000412.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000413", "originalText": "तद्द्विविधं\nसांसिद्धिकं नैमित्तिकं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000413.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000414", "originalText": "सांसिद्धिकं जले।", "padacchedaText": "", "audioFile": "PB_hear2read_000414.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000415", "originalText": "नैमित्तिकं\nपृथिवीतेजसोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000415.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000416", "originalText": "पृथिव्यां घृतादावग्नि संयोगजं द्रवत्वम्। तेजसि\nसुवर्णादौ॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000416.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000417", "originalText": "दीपिका\nद्रवत्वं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000417.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000418", "originalText": "आद्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000418.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000419", "originalText": "स्यन्दनं प्रस्रवणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000419.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000420", "originalText": "तेजःसंयोगजं\nनैमित्तिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000420.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000421", "originalText": "तद्भिन्नं सांसिद्धिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000421.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000422", "originalText": "पृथिव्यां नैमित्तिकमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000422.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000423", "originalText": "घृतादाविति।", "padacchedaText": "", "audioFile": "PB_hear2read_000423.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000424", "originalText": "तेजसि तदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000424.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000425", "originalText": "सुवर्णादाविति।", "padacchedaText": "", "audioFile": "PB_hear2read_000425.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000426", "originalText": "चूर्णादिपिण्डीभावहेतुर्गुणः स्नेहः। जलमात्रवृत्तिः॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000426.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000427", "originalText": "दीपिका\nस्नेहं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000427.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000428", "originalText": "चूर्णेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000428.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000429", "originalText": "कालादावतिव्याप्तिवारणाय गुणपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000429.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000430", "originalText": "रूपादावतिव्याप्तिवारणाय पिण्डीभावेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000430.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000431", "originalText": "श्रोत्रग्राह्यो गुणः शब्दः, आकाशमात्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000431.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000432", "originalText": "स द्विविधः,\nध्वन्यात्मकः वर्णात्मकश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000432.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000433", "originalText": "तत्र ध्वन्यात्मकः भेर्यादौ। वर्णात्मकः\nसंस्कृतभाषादिरूपः॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000433.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000434", "originalText": "शब्दं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000434.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000435", "originalText": "श्रोत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000435.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000436", "originalText": "शब्दत्वेऽतिव्याप्तिवारणाय गुणपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000436.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000437", "originalText": "रूपादावतिव्याप्तिवारणाय श्रोत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000437.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000438", "originalText": "शब्दास्त्रिविधः संयोगजः,\nविभागजः, शब्दजश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000438.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000439", "originalText": "तत्र आद्यो भेरीदण्डसंयोगजन्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000439.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000440", "originalText": "द्वितीयो वंशे पाटयमाने दळद्वयविभागजन्यश्चटाशब्दः।", "padacchedaText": "", "audioFile": "PB_hear2read_000440.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000441", "originalText": "भेर्यादिदेशमारभ्य श्रोत्रदेशपर्यन्तं द्वितीयादिशब्दाः शब्दजाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000441.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000442", "originalText": "सर्वेव्यवहारहेतुर्गुणो बुद्धिर्ज्ञानम्। सा द्विविधा स्मृतिरनुभवश्च॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000442.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000443", "originalText": "दीपिका\nबुद्धेर्लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000443.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000444", "originalText": "सर्वव्यवहारेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000444.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000445", "originalText": "कालादावतिव्याप्तिवारणाय गुण इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000445.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000446", "originalText": "रूपादावतिव्याप्तिवारणाय सर्वव्यवहार इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000446.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000447", "originalText": "जानामीत्यनुव्यवसायगम्यं\nज्ञानमेव लक्षणमिति भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000447.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000448", "originalText": "बुद्धिं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000448.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000449", "originalText": "सेति। संस्कारमात्रजन्यं ज्ञानं स्मृतिः॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000449.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000450", "originalText": "दीपिका\nस्मृतेर्लक्षणमाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000450.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000451", "originalText": "संस्कारेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000451.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000452", "originalText": "भावनाख्यः संस्कारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000452.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000453", "originalText": "संस्कारध्वंसेऽतिव्याप्तिवारणाय ज्ञानमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000453.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000454", "originalText": "घटादिप्रत्यक्षेऽतिव्याप्तिवारणाय संस्कारजन्यमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000454.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000455", "originalText": "प्रत्यभिज्ञायाम्\nअतिव्याप्तिवारणाय मात्रपदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000455.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000456", "originalText": "तद्भिन्नं ज्ञानमनुभवः। स द्विविधः, यथार्थोऽयथार्थश्च॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000456.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000457", "originalText": "दीपिका\nअनुभवं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000457.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000458", "originalText": "तद्भिन्नमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000458.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000459", "originalText": "स्मृतिभिन्नं ज्ञानमनुभव\nइत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000459.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000460", "originalText": "अनुभवं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000460.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000461", "originalText": "स द्विविध इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000461.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000462", "originalText": "तद्वति तत्प्रकारकोऽनुभवो यथार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000462.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000463", "originalText": "यथा रजते इदं रजतमिति\nज्ञानम्। सैव प्रमेत्युच्यते॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000463.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000464", "originalText": "दीपिका\nयथार्थानुभवस्य लक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000464.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000465", "originalText": "तद्वतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000465.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000466", "originalText": "ननु घटे घटत्वम् इति\nप्रमायामव्याप्तिः, घटत्वे घटाभावादिति चेत् न, यत्र\nयत्संबन्धोऽस्ति तत्र तत्संबन्धानुभवः इत्यर्थाद्धटत्वे\nघटसंबन्धोऽस्तीति नाव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000466.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000467", "originalText": "सैवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000467.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000468", "originalText": "यथार्थानुभव एव शास्त्रे\nप्रमेत्युच्यत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000468.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000469", "originalText": "तदभाववति तत्प्रकारकोऽनुभवोऽयथार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000469.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000470", "originalText": "यथा\nशुक्ताविदंरजतमिति ज्ञानम्। सैव अप्रमा इत्युच्यते॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000470.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000471", "originalText": "दीपिका\nअयथार्थानुभवं लक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000471.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000472", "originalText": "तदभाववतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000472.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000473", "originalText": "नन्विदं संयोगीति\nप्रमायामतिव्याप्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000473.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000474", "originalText": "यदवच्छेदेन\nयत्संबन्धाभावस्तदवच्छेदेन तत्संबन्धज्ञानस्य विविक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000474.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000475", "originalText": "संयोगाभावावच्छेदेन संयोगज्ञानस्य भ्रमत्वात्संयोगावच्छेदेन\nसंयोगसंबन्धस्य सत्त्वान्नातिव्याप्तिः। यथार्थानुभवः चतुर्विधः प्रत्यक्षानुमित्युपमितिशब्दाभेदात्॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000475.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000476", "originalText": "दीपिका\nयथार्थानुभवं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000476.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000477", "originalText": "यथार्थेति। तत् करणमपि चतुर्विधं प्रत्यक्षानुमानोपशब्द भेदात्॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000477.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000478", "originalText": "दीपिका\nप्रसङ्गात्प्रमाकरणं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000478.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000479", "originalText": "तत्करणमपीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000479.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000480", "originalText": "प्रमाकरणमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000480.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000481", "originalText": "प्रमाकरणं प्रमाणमिति प्रमाणसामान्यलक्षणम्। असाधरणं कारणं करणम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000481.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000482", "originalText": "दीपिका\nकरणलक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000482.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000483", "originalText": "असाधारणेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000483.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000484", "originalText": "दिक्कालादावतिव्याप्तिवारणाय असाधारणेति। कार्यनियतपूर्ववृत्ति कारणम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000484.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000485", "originalText": "दीपिका\nकारणलक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000485.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000486", "originalText": "कार्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000486.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000487", "originalText": "पूर्ववृत्ति कारणमित्युक्ते\nरासभादावतिव्याप्तिः स्यादतो नियतेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000487.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000488", "originalText": "तावन्मात्रे कृते\nकार्येऽतिव्याप्तिरतः पूर्ववृत्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000488.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000489", "originalText": "ननु तन्तुरूपमपि पटं प्रति कारणं\nस्यादति चेत् न, अनन्यथासिद्धत्वे सतीति विशेषणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000489.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000490", "originalText": "अनन्यथासिद्धत्वमन्यथासिद्धिरहितत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000490.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000491", "originalText": "अन्यथासिद्धिः त्रिविधा—\nयेन सहैव यस्य यं प्रति पूर्ववृत्तित्वमवगम्यते तं प्रत
