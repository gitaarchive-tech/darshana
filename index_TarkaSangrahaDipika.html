ि तेन\nतदन्यथासिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000491.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000492", "originalText": "यथा तन्तुनां तन्तुरूपं तन्तुत्वं च पटं प्रति।", "padacchedaText": "", "audioFile": "PB_hear2read_000492.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000493", "originalText": "तं\nप्रति तदन्यथासिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000493.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000494", "originalText": "यथा शब्दं प्रति पूर्ववृतित्त्वे ज्ञात एव\nपटं प्रत्याकाशस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000494.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000495", "originalText": "अन्यत्र कॢप्तनियतपूर्ववतिर्न एव कार्यसंभवे\nतत्सहभूतमन्यथासिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000495.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000496", "originalText": "यथा पाकजस्थले गन्धं प्रति\nरूपप्रागभावस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000496.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000497", "originalText": "एवञ्च अनन्यथासिद्धनियतपूर्ववृत्तित्वं\nकारणत्वम्। कार्यं प्रागभावप्रतियोगि॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000497.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000498", "originalText": "दीपिका\nकार्यलक्षणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000498.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000499", "originalText": "कार्यमिति। कारणं त्रिविधम्— समवाय्यसमवायिनिमित्तभेदात्॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000499.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000500", "originalText": "यत् समवेतं कार्यं उत्पद्यते तत् समवायिकारणम्। यथा तंतवः पटस्य, पटश्च स्वगतरूपादेः॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000500.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000501", "originalText": "दीपिका\nकारणं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000501.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000502", "originalText": "कारणमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000502.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000503", "originalText": "समवायिकारणस्य लक्षणमाह——————\nयत्समवेतमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000503.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000504", "originalText": "यस्मिन् समवेतमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000504.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000505", "originalText": "असमवायिकारणं लक्षयति———— कार्यणेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000505.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000506", "originalText": "कार्येणेत्येतदुदाहरति————— तन्तुसंयोग इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000506.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000507", "originalText": "कार्येण कारणेन वा सह एकस्मिन्नर्थे समवेतत्वे सति यत्कारणं\nतदसमवायिकारणम्। यथा तंतुसंयोगः पटस्य, तन्तुरूपं पटरूपस्य॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000507.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000508", "originalText": "दीपिका\nकार्येण पटेन सह एकस्मिंस्तन्तौ समवेतत्वात्तन्तुसंयोगः\nपटस्यासमवायिकारणमियर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000508.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000509", "originalText": "कारणेनेत्येतदुदाहरति————\nतन्तुरूपमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000509.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000510", "originalText": "कारणेन पटेन सह एकस्मिंस्तन्तौ समवेतत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000510.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000511", "originalText": "तदुभयभिन्नं कारणं निमित्तकारणम्। यथा तुरीवेमादिकं पटस्य॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000511.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000512", "originalText": "दीपिका\nतन्तुरूपं पटरूपस्यासमवायिकारणमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000512.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000513", "originalText": "निमित्तकारणं लक्षयति——— तदुभयेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000513.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000514", "originalText": "समवाय्यसमवायिभिन्नकारणं निमित्तकारणमित्यर्थः। तदेतत्त्रिविधकारणमध्ये यदसाधारणं कारणं तदेव करणम्॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000514.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000515", "originalText": "दीपिका\nकरणलक्षणमुपसंहरति———— तदेतदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000515.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000516", "originalText": "अथ चतुर्थोऽध्याय। तत्र प्रत्यक्षज्ञानकरणं प्रत्यक्षम्॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000516.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000517", "originalText": "दीपिका\nप्रत्यक्षलक्षणमाह—————— तत्रेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000517.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000518", "originalText": "प्रमाणचतुष्टयमध्ये\nइत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000518.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000519", "originalText": "इन्द्रियार्थसन्निकर्षजन्यं ज्ञानं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000519.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000520", "originalText": "तद्द्विविधं निर्विकल्पकं\nसविकल्पकं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000520.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000521", "originalText": "तत्र निष्प्रकारकं ज्ञानं निर्विकल्पकं यथेदं\nकिञ्चित्। सप्रकारकं ज्ञानं सविकल्पकं यथा डित्थोऽयं,\nब्राह्मणोऽयं, श्यामोऽयं, पाचकोऽयमिति॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000521.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000522", "originalText": "दीपिका\nप्रत्यक्षज्ञानस्य लक्षणमाह———————— इन्द्रियेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000522.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000523", "originalText": "इन्द्र्यियं\nचक्षुरादिकम्, अर्थो घटादिः, तयोः संनिकर्षः संयोगादिः,\nतज्जन्यं ज्ञानमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000523.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000524", "originalText": "तद्विभजते तद्द्विविधमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000524.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000525", "originalText": "निर्विकल्पस्य\nलक्षणमाह——————— निष्प्रकारकमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000525.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000526", "originalText": "विशेषणविशेष्यसंबन्धानवगाहि ज्ञानमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000526.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000527", "originalText": "ननु निर्विकल्पके\nकिं प्रमाणमिति चेत् न, गौरिति विशिष्टज्ञानं\nविशेषणज्ञानजन्यं, विशिष्टज्ञानत्वात्, दण्डीति ज्ञानवत्\nइत्यनुमानस्य प्रमाणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000527.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000528", "originalText": "विशेषणज्ञानस्यापि\nसविकल्पकत्वेऽनवस्थाप्रसङ्गान्निर्विकल्पकसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000528.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000529", "originalText": "सविकल्पकं\nलक्षयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000529.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000530", "originalText": "सप्रकारकमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000530.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000531", "originalText": "नामजात्यादिविशेष्यविशेषणसंबन्धावगाहि\nज्ञानमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000531.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000532", "originalText": "सविकल्पकमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000532.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000533", "originalText": "यथेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000533.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000534", "originalText": "प्रत्यक्षज्ञानहेतुरिन्द्रियार्थसंनिकर्षः षड्विधः। सन्योगः,\nसंयुक्तसमवायः, संयुक्तसमवेतसमवायः, समवायः,\nसमवेतसमवायः, विशेषणविशेष्यभावश्चेति॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000534.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000535", "originalText": "दीपिका\nइन्द्रियार्थसंनिकर्षं विभजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000535.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000536", "originalText": "प्रत्यक्षेति। चक्षुषा घटप्रत्यक्षजनने संयोगः सन्निकर्षः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000536.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000537", "originalText": "दीपिका\nसंयोगसंनिकर्षमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000537.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000538", "originalText": "चक्षुषेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000538.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000539", "originalText": "द्रव्यप्रत्यक्षे सर्वत्र\nसंयोगः संनिकर्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000539.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000540", "originalText": "आत्मा मनसा संयुज्यते, मन इन्द्रियेण,\nइन्द्रियमर्थेन, ततः प्रत्यक्षज्ञानमुत्पद्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000540.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000541", "originalText": "घटरूपप्रत्यक्षजनने संयुक्त समवायः संनिकर्षः। चक्षुः संयुक्ते घटे रूपस्य समवायात्॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000541.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000542", "originalText": "दीपिका\nसंयुक्तसमवायमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000542.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000543", "originalText": "घटरूपेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000543.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000544", "originalText": "तत्र युक्तिमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000544.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000545", "originalText": "चक्षुःसंयुक्त\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000545.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000546", "originalText": "रूपत्वसामान्यप्रत्यक्षे संयुक्तसमवेतसमवायः सन्निकर्षः। चक्षुः संयुक्ते घटे रूपं समवेतं, तत्र रूपत्वस्य समवायात्॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000546.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000547", "originalText": "दीपिका\nसंयुक्तसमवेतसमवायमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000547.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000548", "originalText": "रूपत्वेति। श्रोत्रेण शब्दसाक्षात्कारे समवायः सन्निकर्षः कर्णविवरवर्त्याकाशस्य\nश्रोत्रत्वात् शब्दस्याकाशगुणत्वात् गुणगुणिनोश्च समवायात्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000548.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000549", "originalText": "दीपिका\nसमवायमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000549.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000550", "originalText": "श्रोत्रेणेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000550.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000551", "originalText": "तदुपपादयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000551.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000552", "originalText": "कर्णेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000552.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000553", "originalText": "ननु\nदूरस्थशब्दस्य कथं श्रोत्रसम्बन्ध इति चेत् न,\nवीचीतरङ्गन्यायेन वा शब्दान्तरोत्पत्तिक्रमेण श्रोत्रदेशे जातस्य\nश्रोत्रेण संबन्धात्प्रत्यक्षसंभवः। शब्दत्वसाक्षात्कारे समवेतसमवायः सन्निकर्षः श्रोत्रसमवेते शब्दे\nशबत्वस्य समवायात्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000553.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000554", "originalText": "दीपिका\nसमवेतसमवायमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000554.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000555", "originalText": "शब्दत्वेति। अभावप्रत्यक्षे विशेषणविशेष्यभावः सन्निकर्षः,\nघटाभाववद्भूतलमित्यत्र चक्षुः संयुक्ते भूतले घटाभावस्य\nविशेषणत्वात्॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000555.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000556", "originalText": "दीपिका\nविशेषणविशेष्याभावमुदाहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000556.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000557", "originalText": "अभावेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000557.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000558", "originalText": "तदुपपादयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000558.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000559", "originalText": "घटाभाववदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000559.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000560", "originalText": "भूतले घटो नास्तीत्यत्र अभावस्य विशेष्यत्वं\nद्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000560.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000561", "originalText": "एतेन अनुपलब्धेः प्रमाणान्तरत्वं निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000561.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000562", "originalText": "यद्यत्र\nघटोऽभविष्यत्तर्हि भूतलमिवाद्रक्ष्यत, दर्शनाभावान्नास्तीति\nतर्कितप्रतियोगिसत्वविरोध्यनुपलब्धिसहकृतेन्द्रियेणैव\nअभावज्ञानोत्पत्तौ अनुपलब्धेः प्रमाणान्तरत्वासंभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000562.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000563", "originalText": "अधिकरणज्ञानार्थमपेक्षणीयेन्द्रियस्यैव करणत्वोपपत्तावनुपलब्धेः\nकरणत्वयोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000563.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000564", "originalText": "विशेषणविशेष्यभावो विशेषणविशेष्यस्वरूपमेव,\nनातिरिक्तः संबन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000564.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000565", "originalText": "प्रत्यक्षज्ञानमुपसंहरस्तस्य करणमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000565.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000566", "originalText": "एवमिति। एवं सन्निकर्षषट्कजन्यं ज्ञानं प्रत्यक्षं, तत्करणमिन्द्रियम्,\nतस्मादिन्द्रियं प्रत्यक्षप्रमाणमिति सिद्धम्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000566.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000567", "originalText": "दीपिका\nअसाधारणकारणत्वादिन्द्रियं प्रत्यक्षज्ञानकरणमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000567.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000568", "originalText": "प्रत्यक्षप्रमाणमुपसंहरति।", "padacchedaText": "", "audioFile": "PB_hear2read_000568.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000569", "originalText": "अथ पंचमोऽध्याय। अनुमितिकरणमनुमानम्॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000569.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000570", "originalText": "दीपिका\nअनुमानं लक्षयति—————— अनुमितिकरणमिति। परामर्शजन्यं ज्ञानमनुमितिः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000570.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000571", "originalText": "दीपिका\nअनुमितिं लक्षयति——— परामर्शेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000571.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000572", "originalText": "ननु\nसंशयोत्तरप्रत्यक्षेऽतिव्याप्तिः स्थाणुपुरूषसंशयानन्तरं\nपुरूषत्वव्याप्यकरादिमानयम् इति परामर्शे सति पुरूष एव इति\nप्रत्यक्षजननात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000572.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000573", "originalText": "न च तत्रानुमितिरेवेति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000573.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000574", "originalText": "पुरूषं साक्षात्करोमि\nइत्यनुव्यवसायविरोधादिति चेत् न,\nपक्षतासहकृतपरामर्शजन्यत्वस्य विविक्षित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000574.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000575", "originalText": "सिषाधयिषाविरहविशिष्टसिद्धयभावः पक्षता।", "padacchedaText": "", "audioFile": "PB_hear2read_000575.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000576", "originalText": "साध्यसिद्धिरनुमितिप्रतिबन्धिका।", "padacchedaText": "", "audioFile": "PB_hear2read_000576.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000577", "originalText": "सिद्धिसत्त्वेऽपि अनुमियुयाम्\nइतीच्छायामनुमितिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000577.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000578", "originalText": "सिषाधयिषोत्तेजिका।", "padacchedaText": "", "audioFile": "PB_hear2read_000578.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000579", "originalText": "तत्श्चोत्तेजकाभावविशिष्टमण्यभावस्य\nदाहकारणत्ववत्सिषाधयिषाविरहविशिष्टसिद्धयभावस्याप्यनुमितिकारणत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000579.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000580", "originalText": "व्याप्तिविशिष्टपक्षधर्मताज्ञानं परामर्शः।", "padacchedaText": "", "audioFile": "PB_hear2read_000580.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000581", "originalText": "यथा\nवह्निव्याप्यधूमवानयं पर्वत इति ज्ञानं परामर्शः। तज्जन्यं पर्वतो\nवह्निमानिति ज्ञानमनुमितिः॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000581.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000582", "originalText": "दीपिका\nपरामर्शं लक्षयति————— व्याप्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000582.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000583", "originalText": "व्याप्तिविषयकं\nयत्पक्षधर्मताज्ञानं स परामर्श इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000583.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000584", "originalText": "परामर्शमभिनीय\nदर्शयति—————— यथेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000584.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000585", "originalText": "अनुमितिमभिनीय दर्शयति———————\nतज्जन्यमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000585.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000586", "originalText": "परामर्शजन्यमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000586.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000587", "originalText": "व्याप्तिलक्षणमाह————\nयत्रेति। यत्र यत्र धूमस्तत्र तत्राग्निरिति साहचर्यनियमो व्याप्तिः॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000587.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000588", "originalText": "दीपिका\nयत्र धूमस्तत्राग्निः इति व्याप्तेरभिनयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000588.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000589", "originalText": "साहचर्यनियमः इति लक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000589.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000590", "originalText": "साहचर्यं सामानाधिकरण्यं, तस्य नियमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000590.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000591", "originalText": "हेतुसमानाधिकरणात्यन्ताभावाप्रतियोगिसाध्यसामानाधिकरण्यं\nव्यापाप्तिरित्यर्थः। व्याप्यस्य पर्वतादिवृत्तित्वं पक्षधर्मता॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000591.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000592", "originalText": "दीपिका\nपक्षधर्मतारूपमाह———————— व्याप्यस्येति। अनुमानं द्विविधं—— स्वार्थं परार्थं च॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000592.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000593", "originalText": "तत्र स्वार्थं स्वानुमितिहेतुः, तथाहि, स्वयमेव भूयोदर्शनेन\nयत्र यत्र धूमस्तत्र तत्राग्निरिति महानसादौ व्याप्तिं गृहीत्वा\nपर्वतसमीपं गतः, तद्गते चाग्नौ सन्दिहानः पर्वते धूमं पश्यन्\nव्याप्तिं स्मरति यत्र यत्र धूमस्तत्र तत्राग्निः इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000593.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000594", "originalText": "तदन्तरं\nवह्निव्याप्यधूमवानयं पर्वत इति ज्ञानमुत्पद्यते, अयमेव\nलिङ्गपरामर्श इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000594.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000595", "originalText": "तस्मात् पर्वतो वह्निमानिति ज्ञानमनुमितिः\nउत्पद्यते। तदेतत् स्वार्थानुमानम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000595.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000596", "originalText": "दीपिका\nअनुमानं विभजते———————— अनुमानमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000596.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000597", "originalText": "स्वार्थानुमानं दर्शयति\nस्वयमेवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000597.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000598", "originalText": "ननु पार्थिवत्वलोहलेख्यत्वादौ शतशः\nसहचारदर्शनेऽपि वज्रमणौ व्यभिचारोपलब्धेर्भूयोदर्शनेन कथं\nव्याप्तिग्रह इति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000598.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000599", "originalText": "व्यभिचारज्ञानविरहसहकृतसहचारज्ञानस्य\nव्याप्तिग्राहकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000599.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000600", "originalText": "व्यभिचारज्ञानं निश्चयः शङ्का च।", "padacchedaText": "", "audioFile": "PB_hear2read_000600.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000601", "originalText": "तद्विरहः\nक्वचित्तर्कात्, क्वचित्स्वतः सिद्ध एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000601.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000602", "originalText": "धूमाग्न्योर्व्याप्तिग्रहे\nकार्यकारणभावभङ्गप्रसङ्गलक्षणस्तर्को व्यभिचारशङ्कानिवर्तकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000602.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000603", "originalText": "ननु सकलवह्निधूमयोरसन्निकर्षात्कथं व्याप्तिग्रह इति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000603.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000604", "originalText": "वह्नित्वधूमत्वरूपसामान्यप्रत्यासत्त्यासकलवह्निधूमज्ञानसंभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000604.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000605", "originalText": "तस्मादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000605.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000606", "originalText": "लिङ्गपरामर्शादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000606.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000607", "originalText": "यत्तु स्वयं धूमादग्निमनुमाय परंप्रतिबोधयितुं पञ्चावयव वाक्यं\nप्रयुज्यते तत् परार्थानुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000607.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000608", "originalText": "यथा पर्वतो वह्निमान्, धूमत्वात्,\nयो यो धूमवान् स वह्निमान् यथा महानसः, तथा चायं,\nतस्मात्तथेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000608.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000609", "originalText": "अनेन प्रतिपादितात् लिङ्गात् परोऽप्यग्निं प्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000609.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000610", "originalText": "दीपिका\nपरार्थानुमानमाह—————————— यत्त्विति।", "padacchedaText": "", "audioFile": "PB_hear2read_000610.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000611", "originalText": "यच्छब्दस्य `\nतत्परार्थानुमानम्'' इति तच्छब्देनान्वयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000611.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000612", "originalText": "पञ्चावयववाक्यमुदाहरति————— यथेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000612.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000613", "originalText": "प्रतिज्ञा— हेतु— उदाहरण— उपनय— निगमनानि\nपञ्चावयवाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000613.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000614", "originalText": "पर्वतो वह्निमानिति प्रतिज्ञा।", "padacchedaText": "", "audioFile": "PB_hear2read_000614.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000615", "originalText": "धूमवत्वात् इति हेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000615.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000616", "originalText": "यो यो\nधूमवान् स वह्निमान् यथा महानस इत्युदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000616.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000617", "originalText": "तथा च अयमिति\nउपनयः। तस्मात्तथेति निगमनम्॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000617.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000618", "originalText": "दीपिका\nअवयवस्वरूपमाह————————— प्रतिज्ञेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000618.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000619", "originalText": "उदाहृत्वाक्ये\nप्रतिज्ञादिविभागमाह——————— पर्वतो वह्निमानिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000619.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000620", "originalText": "साध्यवत्तया\nपक्षवचनं प्रतिज्ञा।", "padacchedaText": "", "audioFile": "PB_hear2read_000620.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000621", "originalText": "पञ्चम्यन्तं लिङ्गप्रतिपादकं हेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000621.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000622", "originalText": "व्याप्तिप्रतिपादकं उदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000622.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000623", "originalText": "व्याप्तिविशिष्टलिङ्गप्रतिपादकं\nवचनमुपनयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000623.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000624", "originalText": "हेतुसाध्यवत्तया पक्षप्रतिपादकं वचनं निगमनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000624.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000625", "originalText": "अबाधितत्वादिकं निगमनप्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000625.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000626", "originalText": "स्वार्थानुमितिपरार्थानुमित्योः लिङ्गपरामर्श एव करणम्। तस्मात्\nलिङ्गपरामर्शोऽनुमानम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000626.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000627", "originalText": "दीपिका\nअनुमितिकरणमाह——— स्वार्थेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000627.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000628", "originalText": "ननु\nव्याप्तिस्मृतिपक्षधर्मताज्ञानाभ्यामेव अनुमितिसंभवे\nविशिष्टपरामर्शः किमर्थमङ्गीकर्तव्य इति चेत् न, `\nवह्निव्याप्यवानयम्'' इति शाब्दपरामर्शस्थले\nपरामर्शस्यावश्यकतया लाघवेन सर्वत्र परामर्शस्यैव कारणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000628.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000629", "originalText": "लिङ्गं न करणम्, अतीतादौ व्यभिचारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000629.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000630", "originalText": "``व्यापारवत्वकारणं\nकरणम्'' इति मते परामर्शद्वारा व्याप्तिज्ञानं करणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000630.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000631", "originalText": "तज्जन्यत्वे\nसति तज्जन्यजनको व्यापारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000631.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000632", "originalText": "अनुमानमुपसंहरति— तस्मादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000632.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000633", "originalText": "लिङ्गं त्रिविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000633.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000634", "originalText": "अन्वयव्यतिरेकि, केवलान्वयि, केवलव्यतिरेकि\nचेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000634.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000635", "originalText": "अन्वयेन व्यतिरेकेण च व्याप्तिमदन्वयव्यतिरेकि।", "padacchedaText": "", "audioFile": "PB_hear2read_000635.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000636", "originalText": "यथा वह्नौ\nसाध्ये धूमवत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000636.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000637", "originalText": "यत्र धूमस्तत्राग्नियर्था महानस इत्यन्वयव्याप्तिः। यत्र वह्निर्नास्ति तत्र धूमोऽपि नास्ति यथा महाहृद इति\nव्याप्तिरेकव्याप्तिः॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000637.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000638", "originalText": "दीपिका\nलिङ्गं विभजते——— लिङ्गमिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000638.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000639", "originalText": "अन्वयव्यतिरेकिणं लक्षयति———\nअन्वयेनेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000639.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000640", "originalText": "हेतुसाध्ययोर्व्याप्तिरन्वयव्याप्तिः,\nतदभावयोर्व्याप्तिर्व्यतिरेकव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000640.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000641", "originalText": "अन्वयमात्रव्याप्तिकं केवलान्वयि।", "padacchedaText": "", "audioFile": "PB_hear2read_000641.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000642", "originalText": "यथा घटः अभिधेयः प्रमेयत्वात्\nपटवत्। अत्र प्रमेयत्वाभिधेयत्वयोः व्यतिरेकव्याप्तिर्नास्ति, सर्वस्यापि\nप्रमेयत्वात् अभिधेयत्वाच्च॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000642.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000643", "originalText": "दीपिका\nकेवलान्वयिनो लक्षणमाह———————— अन्वयेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000643.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000644", "originalText": "केवलान्वयिसाध्यकं\nलिङ्गं केवलान्वयि।", "padacchedaText": "", "audioFile": "PB_hear2read_000644.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000645", "originalText": "(वृत्तिमत्) अत्यन्ताभावाप्रतियोगित्वं\nकेवलान्वयित्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000645.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000646", "originalText": "ईश्वरप्रमाविषयत्वं सर्वपदाभिधेयत्वं च\nसर्वत्रास्तीति व्यतिरेकाभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000646.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000647", "originalText": "व्यतिरेकमात्रव्याप्तिकं केवलव्यतिरेकि, यथा पृथिवीतरेभ्यो\nभिद्यते गन्धवत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000647.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000648", "originalText": "यदितरेभ्यो न भिद्यते न तद्गन्धवत् यथा\nजलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000648.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000649", "originalText": "न चेयं तथा।", "padacchedaText": "", "audioFile": "PB_hear2read_000649.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000650", "originalText": "तस्मान्न तथेति। अत्र यद्गन्धवत् तदितरभिन्नम्\nइत्यन्वयदृष्टान्तो नास्ति, पृथिवीमात्रस्य पक्षत्वात्॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000650.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000651", "originalText": "दीपिका\nकेवलव्यतिरेकिणो लक्षणमाह——— व्यतिरेकेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000651.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000652", "originalText": "तदुदाहरति—यथेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000652.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000653", "originalText": "नन्वितरभेदः प्रसिद्धो वा न वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000653.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000654", "originalText": "आद्ये यत्र\nप्रसिद्धस्तत्र हेतुसत्त्वे अन्वयित्वम्, असत्त्वे असाधारण्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000654.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000655", "originalText": "द्वितीये\nसाध्यज्ञानाभावात्कथं तद्विशिष्टानुमितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000655.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000656", "originalText": "विशेषणज्ञानाभावे\nविशिष्टज्ञानानुदयात्प्रतियोगिज्ञानाभावाद्वयतिरेकव्याप्तिज्ञानमपि न\nस्यादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000656.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000657", "originalText": "जलादित्रयोदशान्योन्याभावानां त्रयोदशसु प्रत्येकं\nप्रसिद्धानां मेलनं पृथिव्यां साध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000657.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000658", "originalText": "तत्र\nत्रयोधत्वावच्छिन्नभेदात्मक—\nसाध्यस्यैकाधिकरणवृत्तित्वाभावान्नान्वयित्वासाधारण्ये।", "padacchedaText": "", "audioFile": "PB_hear2read_000658.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000659", "originalText": "प्रत्येकाधिकरणप्रसिद्धया साध्यविशिष्टानुमितिः व्यतिरेकव्याप्तिनिरूपणं\nचेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000659.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000660", "originalText": "सन्दिग्धसाध्यवान् पक्षः। यता धूमवत्त्वे हेतौ पर्वतः॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000660.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000661", "originalText": "दीपिका\nपक्षलक्षणमाह——————— सन्दिग्धेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000661.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000662", "originalText": "ननु\nश्रवणान्तरभाविमननस्थले अव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000662.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000663", "originalText": "तत्र वेदवाक्यैरात्मनो\nनिश्चित्वेन सन्देहाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000663.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000664", "originalText": "किञ्च प्रत्यक्षेऽपि वह्नौ\nयत्रेच्छयानुमितिस्तत्राव्याप्तिरिति चेत् न, उक्तपक्षताश्रयत्वस्य\nपक्षलक्षणत्वात्। निश्चितसाध्यवान् सपक्षः, यथा तत्रैव महानसम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000664.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000665", "originalText": "दीपिका\nसपक्षलक्षणमाह———————— निश्चितेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000665.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000666", "originalText": "निश्चितसाध्याऽभाववान् विपक्षः। यथा तत्रैव महाह्रदः॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000666.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000667", "originalText": "दीपिका\nविपक्षलक्षणमाह————— निश्चितेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000667.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000668", "originalText": "सव्यभिचारविरुद्धसत्प्रतिपक्षासिद्धबाधिताः पञ्च हेत्वाभासाः॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000668.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000669", "originalText": "दीपिका\nएवं सद्धेतून्निरूप्य असद्धेतून्निरूपयितुं विभजते——————\nसव्यभिचारेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000669.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000670", "originalText": "अनुमितिप्रतिबन्धकयथार्थज्ञानविषयत्वं\nहेत्वाभासत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000670.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000671", "originalText": "सव्यभिचारः अनैकान्तिकः। स त्रिविधः\nसाधारणासाधारणानुपसंहारिभेदात्॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000671.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000672", "originalText": "दीपिका\nसव्यभिचारं विभजते———— स त्रिविध इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000672.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000673", "originalText": "तत्र साध्याभाववद्वृत्तिः साधारणः अनैकान्तिकः, यथा पर्वतो\nवह्निमान् प्रमेयत्वात् इति। प्रमेयत्वस्य वह्नयभाववति ह्रदे विद्यमानत्वात्॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000673.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000674", "originalText": "दीपिका\nसाधारणं लक्षयति————— तत्रेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000674.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000675", "originalText": "उदाहरति———— यथेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000675.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000676", "originalText": "सर्वसपक्षविपक्षव्यावृत्तः पक्षमात्रवृत्तिः असाधारणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000676.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000677", "originalText": "यथा\nशब्दो नित्यः शब्दत्वात् इति। शब्दत्वं हि सर्वेभ्यो\nनित्येभ्योऽनित्येभ्यश्च व्यावृत्तं शब्दमात्रवृत्तिः॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000677.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000678", "originalText": "दीपिका\nअसाधारणं लक्षयति————— सर्वेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000678.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000679", "originalText": "अन्वयव्यतिरेकदृष्टान्तरहितोऽनुपसंहारी।", "padacchedaText": "", "audioFile": "PB_hear2read_000679.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000680", "originalText": "यथा सर्वमनित्यं\nप्रमेयत्वादिति। अत्र सर्वस्यापि पक्षत्वात् दृष्टान्तो नास्ति॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000680.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000681", "originalText": "दीपिका\nअनुपसंहारिणो लक्षणमाह———————— अन्वयेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000681.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000682", "originalText": "साध्याभावव्याप्तो हेतुर्विरूद्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000682.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000683", "originalText": "यथा शब्दो नित्यः कृतकत्वादिति। कृतकत्वं हि नित्यत्वाभावेनाऽनित्यत्वेन व्याप्तम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000683.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000684", "originalText": "दीपिका\nविरूद्धं लक्षयति————— साध्येति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000684.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000685", "originalText": "यस्य साध्याभावसाधकं हेत्वन्तरं विद्यते स सत्प्रतिपक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000685.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000686", "originalText": "यथा\nशब्दो नित्यः श्रावणत्वात् शब्दत्ववत्। शब्दोऽनित्यः कार्यत्वात् घटवत्॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000686.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000687", "originalText": "दीपिका\nसत्प्रतिपक्षं लक्षयति———— यस्येति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000687.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000688", "originalText": "असिद्धस्त्रिविधः———— आश्रयासिद्धः, स्वरूपासिद्धो\nव्याप्यत्वासिद्धश्चेति॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000688.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000689", "originalText": "दीपिका\nअसिद्धं विभजते——— असिद्ध इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000689.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000690", "originalText": "आश्रयासिद्धो यथा गगनारविन्दं सुरभि अरविन्दत्वात् सरोजारविन्दत्। अत्र\nगगनारविन्दमाश्रयः स च नास्त्येव॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000690.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000691", "originalText": "दीपिका\nआश्रयासिद्धमुदाहरति——— गगनेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000691.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000692", "originalText": "स्वरूपासिद्धो यथा शब्दो गुणश्चाक्षुषत्वात्। अत्र चाक्षुषत्वं शब्दं\nनास्ति शब्दस्य श्रावणत्वात्॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000692.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000693", "originalText": "दीपिका\nस्वरूपासिद्धमुदाहरति——— यथेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000693.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000694", "originalText": "सोपाधिको हेतुः व्याप्यत्वासिद्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000694.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000695", "originalText": "साध्यव्यापकत्वे सति साधनाव्यापकत्वं\nउपाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000695.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000696", "originalText": "साध्यसमानाधिकरणात्यन्ताभावाप्रतियोगित्वं साध्यव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000696.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000697", "originalText": "साधनवन्निष्ठात्यन्ताभावप्रतियोगित्वं साधनाव्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000697.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000698", "originalText": "पर्वतो\nधूमवान्वह्निमत्वादित्यत्र आर्द्रेन्धनसंयोग उपाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000698.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000699", "originalText": "तथाहि।", "padacchedaText": "", "audioFile": "PB_hear2read_000699.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000700", "originalText": "यत्र\nधूमस्तत्रार्द्रेन्धनसंयोग इति साध्यव्यापकता।", "padacchedaText": "", "audioFile": "PB_hear2read_000700.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000701", "originalText": "यत्र\nवह्निस्तत्रार्द्रेन्धनसंयोगो नास्ति अयोगोलके आर्द्रेन्धनसंयोगाभावादिति\nसाधनाव्यापकता।", "padacchedaText": "", "audioFile": "PB_hear2read_000701.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000702", "originalText": "एवं साध्यव्यापकत्वे सति\nसाधनाव्यापकत्वादार्द्रेन्धनसंयोग उपाधिः। सोपाधिकत्वात् वह्निमत्त्वं\nव्याप्यत्वासिद्धम्॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000702.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000703", "originalText": "दीपिका\nव्याप्यत्वासिद्धस्य लक्षणमाह——— सोपाधिक इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000703.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000704", "originalText": "उपाधेर्लक्षणमाह——— साध्येति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000704.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000705", "originalText": "उपादिश्चतुर्विधः केवलसाध्यव्यापकः,\nपक्षधर्मावच्छिन्नसाध्यव्यापकः,\nसाधनावच्छिन्नसाध्यव्यापकः,\nउदासीनधर्मावच्छिन्नसाध्यव्यापकश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000705.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000706", "originalText": "आद्यः आर्द्रेन्धनसंयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000706.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000707", "originalText": "द्वितीयो यथा वायुः प्रत्यक्षः प्रत्यक्षस्पर्शाश्रयत्वात् इत्यत्र\nबहिर्द्रव्यत्वावच्छिन्नप्रत्यक्षत्वव्यापकमुद्भूतरूपवत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000707.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000708", "originalText": "तृतीयो\nयथा——— प्रागभावो विनाशी जन्यत्वादित्यत्र\nजन्यत्वावच्छिन्नानित्यत्वव्यापकं भावत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000708.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000709", "originalText": "चतुर्थो यथा———\nप्रागभावो विनाशी प्रमेयत्वात् इत्यत्र जन्यत्वावच्छिन्नानित्यत्वव्यापकं\nभावत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000709.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000710", "originalText": "यस्य साध्याभावः प्रमाणान्तरेण निश्चितः स बाधितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000710.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000711", "originalText": "यथा\nवह्निरनुष्णो द्रव्यत्वात् जलवत्। अत्रानुष्णत्वं साध्यं तदभाव उष्णत्वं\nस्पर्शनप्रत्यक्षेण गुह्यात इति बाधितत्वम्॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000711.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000712", "originalText": "दीपिका\nबाधितस्य लक्षणमाह———— यस्येति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000712.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000713", "originalText": "अत्र बाधस्य\nग्राह्याभावनिश्चयत्वेन, सत्प्रतिपक्षस्य विरोधिज्ञानसामग्रीत्वेन\nसाक्षादनुमितिप्रतिबन्धकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000713.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000714", "originalText": "इतरेषां तु परामर्शप्रतिबन्धकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000714.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000715", "originalText": "तत्रापि साधारणस्याव्यभिचाराभावरूपतया, विरूद्धस्य\nसमानाधिकरण्याभावतया व्याप्यत्वासिद्धस्य विशिष्टव्याप्त्यभावतया,\nअसाधारणनुपसंहारिणोः व्याप्तिसंशयाधायकत्वेन\nव्याप्तिज्ञानप्रतिबन्धकत्वम्, आश्रयासिद्धिस्वरूपासिद्धयोः\nपक्षधर्मताज्ञानप्रतिबन्धकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000715.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000716", "originalText": "उपाधिस्तु व्यभिचारज्ञानद्वारा\nव्याप्तिज्ञानप्रतिबन्धकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000716.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000717", "originalText": "सिद्धसाधनं तु पक्षताविघटकतया\nआश्रयासिद्धावन्तर्भवतीति प्राञ्चः। निग्रहस्थानान्तरमिति नवीनाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000717.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000718", "originalText": "अथ षष्ठोऽध्याय।", "padacchedaText": "", "audioFile": "PB_hear2read_000718.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000719", "originalText": "उपमितिकरणमुपमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000719.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000720", "originalText": "संज्ञासंज्ञिसम्बन्धज्ञानमुपमितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000720.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000721", "originalText": "तत्करणं\nसादृश्यज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000721.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000722", "originalText": "अतिदेशवाक्यार्थस्मरणमवान्तर व्यापारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000722.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000723", "originalText": "तथा हि\nकश्चिद्गवयशब्दार्थमजानन् कुतिश्चित् आरण्यकपुरुषाद्गोसदृशो\nगवय इति श्रुत्वा वनं गतो वाक्यार्थं स्मरन् गोसदृशं पिण्डं\nपश्यति। तदन्तरमसौ गवयशब्दवाच्य इत्युपमितिरूत्पद्यते॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000723.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000724", "originalText": "दीपिका\nउपमानं लक्षयति———— उपमितिकरणमिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000724.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000725", "originalText": "अथ सप्तमोऽध्याय।", "padacchedaText": "", "audioFile": "PB_hear2read_000725.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000726", "originalText": "आप्तवाक्यं शब्दः।", "padacchedaText": "", "audioFile": "PB_hear2read_000726.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000727", "originalText": "आप्तस्तु, यथार्थवक्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000727.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000728", "originalText": "वाक्यं पदसमूहः।", "padacchedaText": "", "audioFile": "PB_hear2read_000728.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000729", "originalText": "यथा\nगामानयेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000729.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000730", "originalText": "शक्तं पदम्। अस्मात्पदात् अयमर्थो बोद्धव्य इतीश्वरसंकेतः\nशक्तिः॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000730.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000731", "originalText": "दीपिका\nशब्दं लक्षयति——— आप्तेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000731.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000732", "originalText": "आप्तं लक्षयति——— आप्तस्त्विति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000732.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000733", "originalText": "वाक्यलक्षणमाह———— वाक्यमिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000733.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000734", "originalText": "पदलक्षणमाह——— शक्तमिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000734.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000735", "originalText": "अर्थस्मृत्यनुकूलपदपदार्थसंबन्धः शक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000735.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000736", "originalText": "सा च पदार्थान्तरमिति\nमीमांसकाः। तन्निरासार्थमाह——— अस्मादिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000736.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000737", "originalText": "डित्थादीनामिव\nघटादीनामपि संकेत एव शक्तिः न तु पदार्थान्तरमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000737.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000738", "originalText": "ननु\nगवादिपदानां जातावेव शक्तिः, विशेषणतया जातेः\nप्रथममुपस्थित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000738.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000739", "originalText": "व्यक्तिलाभास्तु आक्षेपादिति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000739.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000740", "originalText": "तत् न,\nगामान्येत्यादौ वृद्धव्यवहारेण सर्वत्रानयनादेर्व्यक्तावेव\nसंभवेन, जातिविशिष्टव्यक्तावेव शक्तिकल्पनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000740.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000741", "originalText": "शक्तिग्रहश्च\nवृद्धव्यवहारेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000741.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000742", "originalText": "व्युत्पित्सुर्बालो `गामानय'\nइत्युत्तमवृद्धवाक्यश्रवणान्तरं मध्यमवृद्धस्य\nप्रवृत्तिमुपलभ्य गवानयनं च दृष्ट्वा\nमध्यमवृद्धप्रवृत्तिजनकज्ञानस्यान्वयव्यतिरेकाभ्यां वाक्तजन्यत्वं\nनिश्चित्य `अश्वमानय गां बधान' इति वाक्यान्तरे आवापोद्वापाभ्यां\nगोपदस्य गोत्वविशिष्टे शक्तिः, अश्वपदस्य अश्वत्वविशिष्टे\nशक्तिरिति व्युत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000742.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000743", "originalText": "ननु सर्वत्र कार्यपरत्वाद्वयवहारस्य\nकार्यपरवाक्य एव व्युत्पर्त्तिन सिद्धपर इति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000743.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000744", "originalText": "``काश्यां\nत्रिभुवन्तिलको भूपतिरास्ते'' इत्यादौ सिद्धेऽपि व्यवहारात्, `\nविकसितपद्मे मधुकरस्तिष्ठति'' इत्यादौ\nप्रसिद्धपदसमभिव्यवहारात्सिद्धेऽपि मधुकरादिव्युत्पत्तिदर्शनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000744.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000745", "originalText": "लक्षणापि शब्दवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000745.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000746", "originalText": "शक्यसंबन्दो लक्षणा।", "padacchedaText": "", "audioFile": "PB_hear2read_000746.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000747", "originalText": "गङ्गायां घोष\nइत्यत्र गङ्गापदवाच्यप्रवाहसंबन्धादेव तीरोपस्थितौ तीरेऽपि\nशक्तिर्न कल्प्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000747.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000748", "originalText": "सैधवादौ लवणाश्वयोः\nपरस्परसंबन्धाभावान्नानाशक्तिकल्पनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000748.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000749", "originalText": "लक्षणा त्रिविधा————\nजहल्लक्षणा, अजहल्लक्षणा, जहदजल्लक्षणा चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000749.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000750", "originalText": "यत्र\nवाच्यार्थस्यान्वयाभावः तत्र जहल्लक्षणा।", "padacchedaText": "", "audioFile": "PB_hear2read_000750.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000751", "originalText": "यथा मञ्चाः क्रोशन्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000751.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000752", "originalText": "यत्र वाच्यार्थस्याप्यन्वयः, तत्र अजहदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000752.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000753", "originalText": "यथा छत्रिणो\nगच्चन्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000753.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000754", "originalText": "यत्र वाच्यैकदेशत्यागेन एकदेशान्वयः, तत्र\nजहदजहदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000754.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000755", "originalText": "यथा तत्त्वमसीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000755.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000756", "originalText": "गौण्यपि लक्षणैव\nलक्ष्यमाणगुणसंबन्धस्वरूपा यथा अग्निर्माणवक इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000756.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000757", "originalText": "व्यञ्चनापि\nशक्तिलक्षणान्तर्भूता, शब्दशक्तिमूला अर्थशक्तिमूला च।", "padacchedaText": "", "audioFile": "PB_hear2read_000757.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000758", "originalText": "अनुमानादिना अन्यथासिद्धा।", "padacchedaText": "", "audioFile": "PB_hear2read_000758.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000759", "originalText": "तात्पर्यानुपपत्तिर्लक्षणाबीजम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000759.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000760", "originalText": "तत्प्रीतीतीच्छयोच्चरितत्वं तात्पर्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000760.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000761", "originalText": "तात्पर्यज्ञानञ्च\nवाक्यार्थज्ञाने हेतुः नानार्थानुरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000761.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000762", "originalText": "प्रकरणादिकं तात्पर्यग्राहकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000762.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000763", "originalText": "द्वारमित्यादौ पिधेहीति शब्दाध्याहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000763.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000764", "originalText": "ननु\nअर्थज्ञानार्थत्वाच्छब्दस्यार्थमविज्ञाय\nशब्दाध्याहारासंभवादर्थाध्याहार एव युक्त इति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000764.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000765", "originalText": "पदविशेषजन्यपदार्थोपस्तिथेः शाब्दज्ञाने हेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000765.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000766", "originalText": "अन्यथा `\nघटः कर्मत्वमानयं कृतिः'' इत्यत्रापि शाब्दज्ञानप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000766.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000767", "originalText": "पङ्कजादिपदेषु योगरूढिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000767.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000768", "originalText": "अवयवशक्तिर्योगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000768.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000769", "originalText": "समुदायशक्ती रूढिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000769.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000770", "originalText": "नियतपद्मत्वादिज्ञानार्थं समुदायशक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000770.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000771", "originalText": "अन्यथा कुमुदेऽपि\nप्रयोगप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000771.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000772", "originalText": "``इतरान्विते शक्तिः'' इति प्राभाकराः।", "padacchedaText": "", "audioFile": "PB_hear2read_000772.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000773", "originalText": "अन्वयस्य\nवाक्यार्थतया भानसम्भवादन्वयांशेऽपि शक्तिर्न कल्पनीया इति\nगौतमीयाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000773.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000774", "originalText": "आकांक्षा योग्यता संनिधिश्च वाक्यार्थज्ञानहेतुः पदस्य\nपदान्तरव्यतिरेकप्रयुक्तान्वयाननुभावकत्वम् आकांक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_000774.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000775", "originalText": "अर्थाबाधो\nयोग्यता। पदानामविलम्बेनोच्चारणं संनिधिः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000775.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000776", "originalText": "दीपिका\nआकांक्षेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000776.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000777", "originalText": "आकाङ्क्षादिज्ञानमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000777.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000778", "originalText": "अन्यथा\nआकांक्षादिभ्रमाच्छाब्दभ्रमो न स्यात्। आकाङ्क्षां लक्षयति———\nपदस्येति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000778.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000779", "originalText": "योग्यतालक्षणमाह———— अर्थेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000779.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000780", "originalText": "संनिधिलक्षणमाह———— पदानामिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000780.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000781", "originalText": "अविलम्बेन पदार्थोपस्थितिः संनिधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000781.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000782", "originalText": "उच्चारणं तु\nतदुपयोगितयोक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000782.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000783", "originalText": "आकांक्षादिरहितं वाक्यप्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000783.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000784", "originalText": "यथा गौरश्वः पुरूषो हस्तीति न\nप्रमाणमाकांक्षाविरहात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000784.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000785", "originalText": "अग्निना सिञ्चेदिति न प्रमाणं योग्यताविरहात्। प्रहरे प्रहरेऽसहोच्चारितानि गामानयेत्यादिपदानि न प्रमाणं\nसांनिध्याभावात्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000785.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000786", "originalText": "दीपिका\nगौरश्व इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000786.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000787", "originalText": "घटकर्मत्वमित्यप्यनाकांक्षोदाहरणं द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000787.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000788", "originalText": "वाक्यं द्विविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000788.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000789", "originalText": "वैदिकं लौकिकं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000789.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000790", "originalText": "वैदिकमीश्वरोक्तत्वात्सर्वमेव\nप्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000790.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000791", "originalText": "लौकिकं त्वाप्तोक्तं प्रमाणम्। अन्यदप्रमाणम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000791.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000792", "originalText": "दीपिका\nवाक्यं विभजते——— वाक्यमिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000792.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000793", "originalText": "वैदिकस्य विशेषमाह———\nवैदिकमीश्वरोक्तत्वादिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000793.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000794", "originalText": "ननु वेदस्यानादित्वात्कथमीश्वरोक्तत्वमिति चेत्\nन।", "padacchedaText": "", "audioFile": "PB_hear2read_000794.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000795", "originalText": "``वेदः पौरूषेयः वाक्यसमूहत्वात् भारतादिवत्'' इत्यनुमानेन\nपौरूषेयत्वसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000795.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000796", "originalText": "न च स्मर्यमाणकर्तृकत्वमुपाधिः,\nगौतमादिभिः शिष्यपरम्परया वेदेऽपि सकर्तृकत्वस्मरणेन\nसाधनव्यापकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000796.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000797", "originalText": "``तस्मात्तेपानात्त्रयो वेदा अजायन्त'' इति\nश्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000797.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000798", "originalText": "ननु वर्णा नित्याः, स एवायं गकार इति प्रत्यभिज्ञाबलात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000798.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000799", "originalText": "तथा च कथं वेदस्यानित्यत्वमिति चेत् न, ``उत्पन्नो गकारो\nविनिष्टो गकार ' इत्यादिप्रतीत्या वर्णानामनित्यत्वात्, ``सोऽयं\nगकार ' इति प्रत्यभिज्ञायाः ``सीयं दीपज्वाला '\nइतिवत्साजात्यावलम्बनत्वात्, वर्णानां\nनित्यत्वेऽप्यानुपूर्वाविशिष्टवाक्यस्यानित्यत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000799.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000800", "originalText": "तस्मादीश्वरोक्ता वेदाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000800.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000801", "originalText": "मन्वादिस्मृतीनामाचाराणां च वेदमूलकतया प्रमाण्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000801.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000802", "originalText": "स्मृतिमूलवाक्यानामिदानीमनध्ययनात्तन्मूलभूता काचिच्छारवोत्सन्नेति\nकल्प्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000802.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000803", "originalText": "ननु पठ्यमानवेदवाक्योत्सादनस्य कल्पयितुमशक्यतया\nविप्रकीर्णवादस्यायुक्तत्वान्नित्यानुमेयो वेदो मूलमिति चेत् न, तथा सति\nकदापि वर्णानामानुपूर्वीज्ञानासंभवेन बोधकत्वास/न्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000803.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000804", "originalText": "वाक्यार्थज्ञानं शाब्दज्ञानम्। तत्करणं शब्दः॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000804.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000805", "originalText": "दीपिका\nननु एतानि पदानि स्मारितार्थसंसर्गवन्ति आकांक्षादिमत्पदकदम्बकत्वात्\nमद्वाक्यवत् इत्यनुमानादेव संसर्गज्ञासंभवाच्छब्दो न\nप्रमाणान्तरमिति चेन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000805.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000806", "originalText": "अनुमित्यपेक्षया विलक्षणस्य शाब्दज्ञानस्य\n``शाब्दात्प्रत्येमि'' इत्वनुव्यवसायंसाक्षिकस्य सर्वसंमतत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000806.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000807", "originalText": "नन्वर्थापत्तिरपि प्रमाणान्तरमस्ति ``पीनो देवदत्तो दिवा न भुङ्क्ते\n' इति दृष्टे श्रुते वा पीनत्वान्यथानुपपत्त्या\nरात्रिभोजनमर्थापत्त्या कल्प्यत इति चेन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000807.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000808", "originalText": "``देवदत्तो रात्रौ\nभुङ्क्ते दिवाऽभुञ्जानत्वे सति पीनत्वात्'' इत्यनुमानेनैव\nरात्रिभोजनस्य सिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000808.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000809", "originalText": "शते पञ्चाशदिति सम्भवोऽप्यनुमानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000809.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000810", "originalText": "``इह वटे यक्षस्तिष्ठति'' इत्यैतिह्यमपि\nअज्ञातम्लवक्तृकशब्द एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000810.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000811", "originalText": "चेष्टापि शब्दानुमानद्वारा व्यवहारहेतुरिति\nन प्रमाणान्तरम्। तस्मात्प्रत्यक्षानुमानोपमानशब्दाश्चत्वार्येव प्रमाणानि॥", "padacchedaText": "", "audioFile": "PB_hear2read_000811.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000812", "originalText": "अथ अष्टमोऽध्याय।", "padacchedaText": "", "audioFile": "PB_hear2read_000812.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000813", "originalText": "NaiyAyikA theory on epistemology\n\n\nज्ञानानां तद्वति तत्प्रकारकत्वं स्वतोग्राह्यं परतो वेति विचार्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000813.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000814", "originalText": "तत्र विप्रतिपत्तिः—————— ज्ञानप्रामाण्यं\nतदप्रामाण्याग्राहकयावज्ज्ञानग्राहकसामग्रीग्राह्यं न वा इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000814.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000815", "originalText": "अत्र\nविधिकोटिः स्वतस्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000815.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000816", "originalText": "निषेधकोटिः परतस्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000816.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000817", "originalText": "अनुमानादिग्राह्यत्वेन\nसिद्धसाधनवारणाय यावदिति। '' इदं ज्ञानमप्रमा ``इति ज्ञानेन\nप्रामाण्याग्रहाद्वाधवारणाय————— अप्रामाण्याग्राहकेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000817.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000818", "originalText": "इदं ज्ञानमप्रमा इत्यनुव्यवसायनिष्ठप्रामाण्यग्राहकस्यापि\nअप्रामाण्याग्राहकत्वाभावात्स्वतस्त्वं न स्यादतस्तदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000818.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000819", "originalText": "तस्मिन्ग्राह्यप्रामाण्याश्रयेऽप्रामाण्याग्राहिकेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000819.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000820", "originalText": "उदाहृतस्थले\nव्यवसायाप्रामाण्यग्राहकस्याप्यनुव्यवसाये तद्ग्राहकत्वात्स्वतस्त्वसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000820.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000821", "originalText": "ननु स्वत एव प्रामाण्यं गृह्यते, ``घटमहं जानामि '\nइत्यनुव्यवसायेन घटघटत्वयोरिव तत्संबन्धस्यापि विषयीकरणात्\nव्यवसायरूप प्रत्यासत्तेस्तुल्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000821.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000822", "originalText": "पुरोवर्तिनि प्रकारसंबन्धस्यैव\nप्रमात्वपदार्थत्वादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000822.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000823", "originalText": "स्वतःप्रामाण्यग्रहे ``जलज्ञानं प्रमा\nन वा'' इत्यनभ्यासदशायां प्रमात्वसंशयो न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000823.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000824", "originalText": "अनुव्यवसायेन\nप्रामाणस्य निश्चितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000824.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000825", "originalText": "तस्मात्स्वतोग्राह्यत्वाभावात्परतो ग्राह्यत्वमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000825.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000826", "originalText": "तथाहि।", "padacchedaText": "", "audioFile": "PB_hear2read_000826.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000827", "originalText": "प्रथमं जलज्ञानान्तरं प्रवृत्तौ सत्यां जललाभे सति\nपूर्वोत्पन्नं जलज्ञानं प्रमा सफलप्रवृत्तिजनकत्वात् यन्नैवं\nतन्नैवं यथा अप्रमा इति व्यतिरेकिणा प्रमात्वं निश्चीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000827.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000828", "originalText": "द्वितीयादिज्ञानेषु पूर्वज्ञानदृष्टान्तेन\nतत्सजातीयत्वलिङ्गेनान्वयव्यतिरेकिणापि गृह्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000828.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000829", "originalText": "प्रमाया\nगुणजन्यत्वमुत्पत्तौ परतस्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000829.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000830", "originalText": "प्रमासाधारणकारणं गुणः,\nअप्रमासाधारणकारणं दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000830.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000831", "originalText": "तत्र प्रत्यक्षे\nविशेषणवद्विशेष्यसंनिकर्षो गुणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000831.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000832", "originalText": "अनुमितौ व्यापकवति\nव्याप्यज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000832.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000833", "originalText": "उपमितौ यथार्थसादृश्यज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000833.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000834", "originalText": "शाब्दज्ञाने\nयथार्थयोग्यताज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000834.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000835", "originalText": "इत्याद्यूहनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000835.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000836", "originalText": "पुरोवर्तिनि\nप्रकाराभावस्यानुव्यवसायेनानुपस्थितत्वादप्रमात्वं परत एव गृह्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000836.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000837", "originalText": "पित्तादिदोषजन्यत्वमुत्पत्तौ परतस्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000837.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000838", "originalText": "ननु सर्वेषां ज्ञानानां\nयथार्थत्वादयथार्थज्ञानमेव नास्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000838.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000839", "originalText": "न च ``शुक्ताविदं रजतम्''\nइति ज्ञानात्प्रवृत्तिदर्शनादन्यथाख्यातिसिद्धिरिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000839.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000840", "originalText": "रजतस्मृतिपुरोवर्तिज्ञानाभ्यामेव प्रवृत्तिसंभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000840.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000841", "originalText": "स्वतन्त्रोपस्थितेष्टभेदाग्रहस्यैव सर्वत्र प्रवर्तकत्वेन ``नेदं\nरजतम्'' इत्यादौ अतिप्रसङ्गाभावादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_hear2read_000841.mp3", "zipFile": "TarkaSangrahaDipika.zip"}, {"id": "B_000842", "originalText": "सत्यरजस्थले\nपुरोवर्तिविशेष्यकरजतत्वप्रकारकज्ञानस्य लाघवेन\nप्रवृत्तिजनकतया शुक्तावपि रजतार्थि प्रवृत्तिजनकत्वेन\nविशिष्टज्ञानस्यैव कल्पनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000842.mp3", "zipFile": "TarkaSangrahaDipika.zip"}];
        const contentDiv = document.getElementById('content');
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentSource = null;
        let isPlaying = false;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            if (currentSource) {
                currentSource.playbackRate.value = this.value;
            }
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = async () => {
            if (isPlaying) {
                if (currentSource) {
                    currentSource.onended = null;
                    currentSource.stop();
                    currentSource = null;
                }
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                if (currentIndex >= 0) {
                    playAudio(currentIndex);
                } else {
                    playAudio(0);
                }
                playPauseBtn.innerText = "Stop";
            }
        };
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- Web Audio API Prefetching Logic ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> AudioBuffer

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchAndDecode(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const audioBuffer = await fetchAndDecode(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, audioBuffer);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old buffers to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentSource) {
                currentSource.onended = null;
                currentSource.stop();
                currentSource = null;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Resume AudioContext if it was suspended (browser autoplay policy)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            
            try {
                let audioBuffer;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioBuffer = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioBuffer = await fetchAndDecode(sourceUrl);
                }
                
                currentSource = audioCtx.createBufferSource();
                currentSource.buffer = audioBuffer;
                currentSource.playbackRate.value = document.getElementById('speed-slider').value;
                currentSource.connect(audioCtx.destination);
                
                currentSource.onended = () => { playAudio(currentIndex + 1); };
                currentSource.start(0);
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
</body>
</html>
